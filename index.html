<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Live Mic Anti-Kresek</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            display: inline-block;
        }
        .bg-active { background-color: #ef4444; box-shadow: 0 0 15px #ef4444; }
        .bg-idle { background-color: #4b5563; }
        
        input[type=range]::-webkit-slider-runnable-track {
            background: #1f2937;
            height: 10px;
            border-radius: 5px;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            background: #3b82f6;
            margin-top: -7px;
            border-radius: 50%;
            border: 2px solid white;
        }
    </style>
</head>
<body class="bg-gray-950 text-white min-h-screen flex flex-col font-sans">

    <div class="flex-1 flex flex-col items-center justify-center p-6">
        <!-- Status Indicator -->
        <div class="mb-12 flex items-center space-x-3 bg-gray-900 px-4 py-2 rounded-full border border-gray-800">
            <span id="dot" class="status-dot bg-idle"></span>
            <span id="statusText" class="text-xs font-bold uppercase tracking-tighter text-gray-400">Siap Digunakan</span>
        </div>

        <!-- Main Button -->
        <div class="relative group">
            <div id="ring" class="absolute inset-0 rounded-full bg-blue-600 opacity-0 transition-all duration-500 scale-125 blur-xl"></div>
            <button id="micBtn" class="relative w-48 h-48 bg-gray-900 rounded-full border-8 border-gray-800 flex items-center justify-center transition-all active:scale-95">
                <svg id="micIcon" xmlns="http://www.w3.org/2000/svg" class="w-20 h-20 text-gray-600" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2a3 3 0 013 3v7a3 3 0 01-6 0V5a3 3 0 013-3z" />
                    <path d="M19 11a7 7 0 01-14 0h2a5 5 0 0010 0h2z" />
                    <path d="M11 18.1V22h2v-3.9A7.01 7.01 0 0119 11h-2a5 5 0 00-10 0H5a7.01 7.01 0 016 7.1z" />
                </svg>
            </button>
        </div>

        <!-- Visualizer -->
        <div class="w-full max-w-xs mt-12 h-16 flex items-end justify-center space-x-1">
            <div id="v1" class="w-2 bg-blue-500 rounded-full transition-all duration-75" style="height: 10%"></div>
            <div id="v2" class="w-2 bg-blue-500 rounded-full transition-all duration-75" style="height: 15%"></div>
            <div id="v3" class="w-2 bg-blue-500 rounded-full transition-all duration-75" style="height: 30%"></div>
            <div id="v4" class="w-2 bg-blue-500 rounded-full transition-all duration-75" style="height: 20%"></div>
            <div id="v5" class="w-2 bg-blue-500 rounded-full transition-all duration-75" style="height: 10%"></div>
        </div>
    </div>

    <!-- Controls Panel -->
    <div class="bg-gray-900 p-8 rounded-t-[3rem] border-t border-gray-800">
        <div class="max-w-md mx-auto space-y-8">
            <div>
                <div class="flex justify-between items-end mb-4">
                    <label class="text-xs font-black uppercase text-gray-500 tracking-widest">Gain Suara</label>
                    <span id="volVal" class="text-2xl font-black text-blue-500">1.0x</span>
                </div>
                <input type="range" id="volRange" min="0" max="4" step="0.1" value="1" class="w-full appearance-none bg-transparent">
            </div>

            <div class="flex space-x-4">
                <button id="clearBtn" class="flex-1 bg-gray-800 py-4 rounded-2xl text-xs font-bold uppercase tracking-widest border border-gray-700 active:bg-gray-700">Bersihkan Kresek</button>
            </div>
            
            <p class="text-center text-[10px] text-gray-600 uppercase tracking-widest font-bold">
                Tips: Jauhkan HP dari speaker bluetooth agar tidak kresek.
            </p>
        </div>
    </div>

    <script>
        let audioCtx, micStream, source, filter, gainNode, analyser, isActive = false;

        const micBtn = document.getElementById('micBtn');
        const micIcon = document.getElementById('micIcon');
        const statusText = document.getElementById('statusText');
        const dot = document.getElementById('dot');
        const ring = document.getElementById('ring');
        const volRange = document.getElementById('volRange');
        const volVal = document.getElementById('volVal');

        async function initAudio() {
            try {
                micStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    }
                });

                audioCtx = new (window.AudioContext || window.webkitAudioContext)({
                    latencyHint: 'playback' // Memberikan buffer lebih untuk bluetooth agar tidak kresek
                });

                source = audioCtx.createMediaStreamSource(micStream);
                
                // HIGH PASS FILTER - Membuang suara dengung rendah (sub-bass/rumble)
                filter = audioCtx.createBiquadFilter();
                filter.type = "highpass";
                filter.frequency.value = 150; // Memotong frekuensi di bawah 150Hz

                gainNode = audioCtx.createGain();
                analyser = audioCtx.createAnalyser();
                analyser.fftSize = 32;

                // Routing: Mic -> Filter -> Gain -> Analyser -> Output
                source.connect(filter);
                filter.connect(gainNode);
                gainNode.connect(analyser);
                gainNode.connect(audioCtx.destination);

                gainNode.gain.value = volRange.value;
                
                isActive = true;
                updateUI(true);
                monitor();
            } catch (err) {
                alert("Izin mic ditolak atau perangkat tidak mendukung.");
            }
        }

        function stopAudio() {
            if (micStream) micStream.getTracks().forEach(t => t.stop());
            if (audioCtx) audioCtx.close();
            isActive = false;
            updateUI(false);
            resetVisuals();
        }

        function updateUI(active) {
            if (active) {
                micIcon.classList.add('text-blue-500');
                statusText.innerText = "Mikrofon Aktif";
                statusText.classList.replace('text-gray-400', 'text-blue-500');
                dot.classList.replace('bg-idle', 'bg-active');
                ring.classList.add('opacity-30');
            } else {
                micIcon.classList.remove('text-blue-500');
                statusText.innerText = "Siap Digunakan";
                statusText.classList.replace('text-blue-500', 'text-gray-400');
                dot.classList.replace('bg-active', 'bg-idle');
                ring.classList.remove('opacity-30');
            }
        }

        function monitor() {
            if (!isActive) return;
            const data = new Uint8Array(analyser.frequencyBinCount);
            analyser.getByteFrequencyData(data);
            
            // Animasi bar sederhana
            for(let i=1; i<=5; i++) {
                const val = (data[i] / 255) * 100;
                document.getElementById('v'+i).style.height = Math.max(10, val) + '%';
            }
            requestAnimationFrame(monitor);
        }

        function resetVisuals() {
            for(let i=1; i<=5; i++) {
                document.getElementById('v'+i).style.height = '10%';
            }
        }

        micBtn.onclick = () => {
            if (!isActive) initAudio();
            else stopAudio();
        };

        volRange.oninput = (e) => {
            const v = e.target.value;
            volVal.innerText = parseFloat(v).toFixed(1) + 'x';
            if (gainNode) gainNode.gain.setTargetAtTime(v, audioCtx.currentTime, 0.05);
        };

        document.getElementById('clearBtn').onclick = () => {
            if (filter) {
                // Menaikkan filter jika masih kresek
                filter.frequency.value = filter.frequency.value >= 300 ? 150 : 300;
                statusText.innerText = filter.frequency.value === 300 ? "Mode Anti-Bising" : "Mode Normal";
                setTimeout(() => { if(isActive) statusText.innerText = "Mikrofon Aktif"; }, 2000);
            }
        };
    </script>
</body>
</html>
