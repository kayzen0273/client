<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aiO Unlimited | Clean Text</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617;
        }

        .chat-area::-webkit-scrollbar {
            width: 5px;
        }
        .chat-area::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
        }

        .message-anim {
            animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .no-asterisk-output {
            line-height: 1.6;
        }
    </style>
</head>
<body class="h-screen flex flex-col text-slate-200">

    <!-- Header -->
    <header class="border-b border-white/5 bg-slate-950/80 backdrop-blur-xl p-4 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 bg-gradient-to-tr from-cyan-500 to-blue-600 rounded-2xl flex items-center justify-center shadow-lg shadow-cyan-500/20">
                    <i data-lucide="zap" class="text-white w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="font-bold text-lg text-white">aiO <span class="text-cyan-400">Unlimited</span></h1>
                    <p class="text-[10px] text-slate-500 font-bold tracking-widest uppercase">Clean Text Mode Active</p>
                </div>
            </div>
            <div class="flex space-x-2">
                <div class="px-3 py-1 bg-white/5 rounded-full border border-white/10 flex items-center space-x-2">
                    <span class="w-1.5 h-1.5 bg-cyan-400 rounded-full animate-pulse"></span>
                    <span class="text-[10px] font-bold text-slate-300 uppercase">Asterisk-Free</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Chat Window -->
    <main id="chat-window" class="flex-1 overflow-y-auto chat-area p-4 md:p-8 space-y-8">
        <div id="intro" class="max-w-2xl mx-auto text-center py-20">
            <div class="inline-block p-4 bg-cyan-500/10 rounded-3xl mb-6">
                <i data-lucide="shield-check" class="w-12 h-12 text-cyan-400"></i>
            </div>
            <h2 class="text-4xl font-black text-white mb-4 tracking-tight">Halo, saya aiO.</h2>
            <p class="text-slate-400 text-lg">Berikan saya perintah apapun. Saya akan memberikan jawaban bersih tanpa karakter tanda bintang atau simbol markdown yang mengganggu.</p>
        </div>
    </main>

    <!-- Loading Bar -->
    <div id="loader" class="hidden">
        <div class="max-w-5xl mx-auto px-4 py-2">
            <div class="flex items-center space-x-3 text-cyan-400 animate-pulse">
                <i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i>
                <span class="text-xs font-bold uppercase tracking-wider">Memproses Perintah...</span>
            </div>
        </div>
    </div>

    <!-- Input Zone -->
    <div class="p-4 md:p-8 bg-slate-950 border-t border-white/5">
        <div class="max-w-4xl mx-auto relative">
            <textarea 
                id="user-prompt"
                placeholder="Tulis perintah anda di sini..."
                rows="1"
                class="w-full bg-slate-900/50 border border-white/10 text-white rounded-3xl py-5 pl-6 pr-16 focus:outline-none focus:ring-2 focus:ring-cyan-500/50 transition-all resize-none text-lg"
                oninput="this.style.height = ''; this.style.height = this.scrollHeight + 'px'"
            ></textarea>
            <button 
                onclick="processAI()"
                id="send-btn"
                class="absolute right-3 bottom-3 w-12 h-12 bg-cyan-500 hover:bg-cyan-400 text-slate-950 rounded-2xl flex items-center justify-center transition-all shadow-lg shadow-cyan-500/20 active:scale-90"
            >
                <i data-lucide="send-horizontal" class="w-6 h-6"></i>
            </button>
        </div>
        <div class="max-w-4xl mx-auto mt-4 flex justify-center space-x-6 text-[10px] text-slate-600 font-bold uppercase tracking-widest">
            <span>Tanpa Limit</span>
            <span>Tanpa Tanda Bintang</span>
            <span>Respons Cepat</span>
        </div>
    </div>

    <script>
        const apiKey = ""; 
        const model = "gemini-2.5-flash-preview-09-2025";
        
        lucide.createIcons();
        const chatWindow = document.getElementById('chat-window');
        const userPrompt = document.getElementById('user-prompt');
        const loader = document.getElementById('loader');
        const intro = document.getElementById('intro');

        async function processAI() {
            const prompt = userPrompt.value.trim();
            if (!prompt) return;

            if (intro) intro.remove();
            
            // Add user message
            addMessage('user', prompt);
            userPrompt.value = '';
            userPrompt.style.height = 'auto';
            loader.classList.remove('hidden');

            try {
                const response = await callGemini(prompt);
                loader.classList.add('hidden');
                addMessage('ai', response);
            } catch (err) {
                loader.classList.add('hidden');
                addMessage('ai', "Maaf, sistem sedang mengalami gangguan. Silakan coba sesaat lagi.");
            }
        }

        async function callGemini(prompt, retries = 5) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;
            const systemInstruction = "PENTING: Jangan gunakan karakter tanda bintang (*) atau simbol markdown seperti #, -, atau __ dalam jawaban Anda. Gunakan teks polos, paragraf yang rapi, atau angka (1., 2.) untuk daftar. Jangan pernah mencetak karakter bintang sama sekali.";

            for (let i = 0; i < retries; i++) {
                try {
                    const res = await fetch(url, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: prompt }] }],
                            systemInstruction: { parts: [{ text: systemInstruction }] }
                        })
                    });

                    if (res.ok) {
                        const data = await res.json();
                        let text = data.candidates[0].content.parts[0].text;
                        // Final safety check to remove any accidental asterisks
                        return text.replace(/\*/g, '');
                    }
                    await new Promise(resolve => setTimeout(resolve, Math.pow(2, i) * 1000));
                } catch (e) {
                    if (i === retries - 1) throw e;
                }
            }
        }

        function addMessage(role, content) {
            const div = document.createElement('div');
            div.className = `flex ${role === 'user' ? 'justify-end' : 'justify-start'} message-anim`;
            
            const isUser = role === 'user';
            
            div.innerHTML = `
                <div class="${isUser ? 'bg-cyan-500 text-slate-950 rounded-l-3xl rounded-tr-3xl' : 'bg-slate-900 border border-white/5 text-slate-200 rounded-r-3xl rounded-tl-3xl'} p-6 shadow-2xl max-w-[85%] md:max-w-[70%]">
                    <div class="flex items-center space-x-2 mb-3 opacity-60">
                        <i data-lucide="${isUser ? 'user' : 'bot'}" class="w-3.5 h-3.5"></i>
                        <span class="text-[10px] font-black uppercase tracking-[0.2em]">${isUser ? 'Pengguna' : 'aiO Engine'}</span>
                    </div>
                    <div class="no-asterisk-output text-base md:text-lg font-medium whitespace-pre-wrap">${content}</div>
                </div>
            `;
            
            chatWindow.appendChild(div);
            chatWindow.scrollTo({ top: chatWindow.scrollHeight, behavior: 'smooth' });
            lucide.createIcons();
        }

        userPrompt.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                processAI();
            }
        });
    </script>
</body>
</html>
