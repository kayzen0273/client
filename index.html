<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Opname Supabase</title>
    <!-- Import Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Pustaka untuk Export Excel -->
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 15px; background-color: #f4f7f6; color: #333; }
        .container { max-width: 1100px; margin: 0 auto; background: white; padding: 15px 18px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .header-area { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #f4f7f6; padding-bottom: 12px; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        h2 { margin: 0; color: #2c3e50; font-size: 18px; }
        
        /* Area tombol aksi dibuat lebih rapat */
        .action-area { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        
        /* Dropdown Outlet diperpendek */
        select { padding: 6px 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-weight: bold; width: 110px; cursor: pointer; font-size: 12px; background-color: #fff; height: 30px; }
        
        /* Tombol Edit Nama diperpendek */
        .edit-outlet { background: #3498db; color: white; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: bold; border: none; transition: background 0.2s ease; height: 30px; display: inline-flex; align-items: center; }
        .edit-outlet:hover { background: #2980b9; }

        /* Tombol Centang Abjad diperpendek */
        .checkbox-abjad { 
            font-size: 12px; 
            font-weight: 600; 
            cursor: pointer; 
            display: inline-flex; 
            align-items: center; 
            gap: 4px; 
            background: #f1f5f9; 
            color: #475569; 
            padding: 6px 10px; 
            border: 1px solid #cbd5e1; 
            border-radius: 20px; 
            transition: all 0.2s ease;
            user-select: none;
            white-space: nowrap;
            height: 30px;
        }
        .checkbox-abjad:hover { 
            background: #e2e8f0; 
            border-color: #94a3b8;
        }
        .checkbox-abjad:has(input:checked) {
            background: #2980b9;
            color: white;
            border-color: #2980b9;
            box-shadow: 0 2px 6px rgba(41, 128, 185, 0.2);
        }
        .checkbox-abjad input[type="checkbox"] {
            cursor: pointer;
            accent-color: #ffffff;
            width: 12px;
            height: 12px;
            margin: 0;
        }

        /* Tombol Excel diperpendek menyesuaikan tinggi tombol lainnya */
        .btn-excel { background-color: #1f6e43; font-weight: bold; padding: 6px 10px; font-size: 12px; height: 30px; display: inline-flex; align-items: center; border-radius: 6px; color: white; border: none; cursor: pointer; transition: background 0.2s ease; }
        .btn-excel:hover { background-color: #165231; }

        .form-group { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 25px; background: #fdfdfd; padding: 15px; border: 1px dashed #cbd5e1; border-radius: 6px; }
        input { padding: 10px; border: 1px solid #ccc; border-radius: 4px; flex: 1; min-width: 120px; font-size: 14px; }
        
        /* Tombol Tambah Barang Utama tetap proporsional */
        button { padding: 10px 15px; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 500; transition: background 0.2s ease; }
        .btn-tambah { background-color: #27ae60; }
        .btn-tambah:hover { background-color: #219653; }
        
        /* Tombol aksi dalam tabel */
        .btn-hapus { background-color: #e74c3c; padding: 5px 10px; font-size: 12px; }
        .btn-hapus:hover { background-color: #c0392b; }
        .btn-edit { background-color: #f39c12; padding: 5px 10px; font-size: 12px; margin-right: 5px; }
        .btn-edit:hover { background-color: #d35400; }
        
        table { width: 100%; border-collapse: collapse; margin-bottom: 20px; }
        th, td { border: 1px solid #cbd5e1; padding: 10px 12px; font-size: 13px; }
        th { background-color: #f8fafc; color: #475569; text-align: left; }
        .group-title { background-color: #e2e8f0; padding: 8px 12px; font-weight: bold; border-left: 5px solid #2980b9; margin-top: 15px; margin-bottom: 5px; border-radius: 0 4px 4px 0; }

        /* Gaya CSS untuk Pop-up/Modal Kustom */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background-color: white;
            padding: 22px;
            border-radius: 8px;
            width: 90%;
            max-width: 450px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            animation: fadeIn 0.2s ease-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .modal-content h3 {
            margin-top: 0;
            margin-bottom: 18px;
            color: #2c3e50;
            font-size: 18px;
            border-bottom: 2px solid #f4f7f6;
            padding-bottom: 8px;
        }
        .modal-field {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .modal-field label {
            font-size: 13px;
            font-weight: 600;
            color: #475569;
        }
        .modal-field input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
        }
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }
        .btn-batal {
            background-color: #95a5a6;
        }
        .btn-batal:hover {
            background-color: #7f8c8d;
        }
        .btn-simpan {
            background-color: #27ae60;
        }
        .btn-simpan:hover {
            background-color: #219653;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-area">
        <h2>Stock Opname</h2>
        <div class="action-area">
            <select id="pilihOutlet" onchange="loadData()">
                <option value="Outlet_A">Outlet A</option>
                <option value="Outlet_B">Outlet B</option>
            </select>
            <button type="button" class="edit-outlet" onclick="bukaEditOutletModal()">Edit Nama</button>
            <label class="checkbox-abjad">
                <input type="checkbox" id="modeAbjad" onchange="loadData()">
                <span>A-Z</span>
            </label>
            <button class="btn-excel" onclick="exportKeExcel()">📊 Excel</button>
        </div>
    </div>
    
    <div class="form-group">
        <input type="text" id="nama" placeholder="Nama Barang..." autocomplete="off">
        <input type="number" id="jumlah" placeholder="Stok" min="0">
        <input type="text" id="golongan" placeholder="Pilih/Ketik Rak..." list="listRak" autocomplete="off">
        <datalist id="listRak"></datalist>
        <button class="btn-tambah" onclick="tambahData()">Tambah</button>
    </div>

    <div id="tabelContainer">Memuat data...</div>
</div>

<!-- Pop-up/Modal untuk Edit Data Barang -->
<div id="editModal" class="modal">
    <div class="modal-content">
        <h3>✏️ Edit Data Barang</h3>
        <input type="hidden" id="editId">
        <div class="modal-field">
            <label for="editNama">Nama Barang</label>
            <input type="text" id="editNama" autocomplete="off">
        </div>
        <div class="modal-field">
            <label for="editJumlah">Jumlah Stok</label>
            <input type="number" id="editJumlah" min="0">
        </div>
        <div class="modal-field">
            <label for="editGolongan">Rak / Golongan</label>
            <input type="text" id="editGolongan" autocomplete="off">
        </div>
        <div class="modal-actions">
            <button type="button" class="btn-batal" onclick="tutupEditModal()">Batal</button>
            <button type="button" class="btn-simpan" onclick="simpanEditBarang()">Simpan Perubahan</button>
        </div>
    </div>
</div>

<!-- Pop-up/Modal untuk Edit Nama Outlet -->
<div id="outletModal" class="modal">
    <div class="modal-content">
        <h3>🏬 Edit Nama Outlet</h3>
        <div class="modal-field">
            <label for="editOutletNama">Nama Outlet Baru</label>
            <input type="text" id="editOutletNama" autocomplete="off">
        </div>
        <div class="modal-actions">
            <button type="button" class="btn-batal" onclick="tutupOutletModal()">Batal</button>
            <button type="button" class="btn-simpan" onclick="simpanEditOutlet()">Simpan Perubahan</button>
        </div>
    </div>
</div>

<script>
    const SUPABASE_URL = 'https://mczuqbwofvlzcfezlptu.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1jenVxYndvZnZsemNmZXpscHR1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIzNzU4MzEsImV4cCI6MjA5Nzk1MTgzMX0.zZNZGVVuyhXSltqZWiCrEZsdHSJqS_Tf9kyXkioy_G0';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    
    let currentData = [];

    // Fungsi untuk memperbarui datalist (autocomplete) rak
    function updateDatalist(data) {
        const datalist = document.getElementById('listRak');
        datalist.innerHTML = '';
        const rakUnik = [...new Set(data.map(item => (item.golongan || '').trim()))].filter(r => r !== '');
        rakUnik.forEach(r => { 
            const opt = document.createElement('option'); 
            opt.value = r; 
            datalist.appendChild(opt); 
        });
    }

    // Membuka modal edit barang
    function bukaEditModal(id, nama, jumlah, golongan) {
        document.getElementById('editId').value = id;
        document.getElementById('editNama').value = nama;
        document.getElementById('editJumlah').value = jumlah;
        document.getElementById('editGolongan').value = golongan || '';
        document.getElementById('editModal').style.display = 'flex';
    }

    // Menutup modal edit barang
    function tutupEditModal() {
        document.getElementById('editModal').style.display = 'none';
    }

    // Menyimpan perubahan hasil edit barang ke Supabase
    async function simpanEditBarang() {
        const id = document.getElementById('editId').value;
        const namaBaru = document.getElementById('editNama').value.trim();
        const jumlahBaru = document.getElementById('editJumlah').value;
        const golonganBaru = document.getElementById('editGolongan').value.trim();

        if (!namaBaru || !jumlahBaru) {
            return alert("Nama Barang dan Jumlah tidak boleh kosong!");
        }

        const { error } = await supabaseClient
            .from('stok_barang')
            .update({ 
                nama: namaBaru, 
                jumlah: parseInt(jumlahBaru), 
                golongan: golonganBaru 
            })
            .eq('id', id);
        
        if (error) {
            alert("Gagal memperbarui data: " + error.message);
        } else {
            tutupEditModal();
            loadData();
        }
    }

    // Membuka modal edit outlet
    function bukaEditOutletModal() {
        const select = document.getElementById('pilihOutlet');
        const outletAktif = select.options[select.selectedIndex].text;
        document.getElementById('editOutletNama').value = outletAktif;
        document.getElementById('outletModal').style.display = 'flex';
    }

    // Menutup modal edit outlet
    function tutupOutletModal() {
        document.getElementById('outletModal').style.display = 'none';
    }

    // Menyimpan perubahan nama outlet ke Supabase
    async function simpanEditOutlet() {
        const select = document.getElementById('pilihOutlet');
        const outletLama = select.value;
        const namaBaru = document.getElementById('editOutletNama').value.trim();

        if (!namaBaru) {
            return alert("Nama outlet tidak boleh kosong!");
        }

        if (namaBaru === select.options[select.selectedIndex].text) {
            tutupOutletModal();
            return;
        }

        const { error } = await supabaseClient
            .from('stok_barang')
            .update({ outlet: namaBaru })
            .eq('outlet', outletLama);
        
        if (error) {
            alert("Gagal memperbarui nama outlet: " + error.message);
        } else {
            select.options[select.selectedIndex].text = namaBaru;
            select.options[select.selectedIndex].value = namaBaru;
            tutupOutletModal();
            alert("Nama outlet berhasil diubah!");
            loadData();
        }
    }

    async function loadData() {
        const outlet = document.getElementById('pilihOutlet').value;
        const urutAbjad = document.getElementById('modeAbjad').checked;
        
        let query = supabaseClient.from('stok_barang').select('*').eq('outlet', outlet);
        if (urutAbjad) query = query.order('nama', { ascending: true });
        else query = query.order('created_at', { ascending: true });

        const { data, error } = await query;
        if (error) return console.error("Error loadData:", error);
        
        currentData = data;
        updateDatalist(data);
        renderTabel(data, urutAbjad);
    }

    function renderTabel(data, urutAbjad) {
        const container = document.getElementById('tabelContainer');
        container.innerHTML = '';
        if (!data || !data.length) return container.innerHTML = '<p style="text-align:center; padding: 20px; color: #7f8c8d;">Belum ada data barang.</p>';
        
        if (urutAbjad) {
            buatTabel(data, "Semua Barang (Urut A-Z)");
        } else {
            const kelompok = {};
            data.forEach(item => {
                const rak = item.golongan?.trim() || 'Tanpa Rak';
                if (!kelompok[rak]) kelompok[rak] = [];
                kelompok[rak].push(item);
            });
            for (const rak in kelompok) buatTabel(kelompok[rak], rak);
        }
    }

    function buatTabel(data, title) {
        const div = document.createElement('div');
        div.innerHTML = `<div class="group-title">📍 ${title}</div>`;
        let rows = data.map((item, index) => `
            <tr>
                <td style="width: 50px;">${index + 1}</td>
                <td>${item.nama}</td>
                <td style="width: 100px;">${item.jumlah}</td>
                <td style="width: 200px;">${item.golongan || '-'}</td>
                <td style="width: 150px; text-align: center;">
                    <button class="btn-edit" onclick="bukaEditModal('${item.id}', '${item.nama.replace(/'/g, "\\'")}', '${item.jumlah}', '${(item.golongan || '').replace(/'/g, "\\'")}')">Edit</button>
                    <button class="btn-hapus" onclick="konfirmasiHapus('${item.id}', '${item.nama.replace(/'/g, "\\'")}')">Hapus</button>
                </td>
            </tr>
        `).join('');
        div.innerHTML += `<table><thead><tr><th>No</th><th>Barang</th><th>Stok</th><th>Rak</th><th>Aksi</th></tr></thead><tbody>${rows}</tbody></table>`;
        document.getElementById('tabelContainer').appendChild(div);
    }

    async function konfirmasiHapus(id, nama) {
        if (confirm(`Apakah Anda yakin ingin menghapus barang "${nama}"?`)) {
            const { error } = await supabaseClient.from('stok_barang').delete().eq('id', id);
            if (error) alert('Gagal menghapus');
            else loadData();
        }
    }

    async function tambahData() {
        const nama = document.getElementById('nama').value.trim();
        const jumlah = document.getElementById('jumlah').value;
        const golongan = document.getElementById('golongan').value.trim();
        const outlet = document.getElementById('pilihOutlet').value;
        
        if(!nama || !jumlah) return alert('Isi Nama Barang dan Stok!');
        
        const { error } = await supabaseClient
            .from('stok_barang')
            .insert([{ nama, jumlah: parseInt(jumlah), golongan, outlet }]);

        if (error) alert('Gagal: ' + error.message);
        else {
            document.getElementById('nama').value = '';
            document.getElementById('jumlah').value = '';
            loadData();
        }
    }

    function exportKeExcel() {
        if (currentData.length === 0) return alert("Tidak ada data untuk di-export.");
        // Ambil hanya kolom-kolom yang relevan untuk file Excel agar rapi
        const dataBersih = currentData.map((item, index) => ({
            No: index + 1,
            Barang: item.nama,
            Stok: item.jumlah,
            Rak: item.golongan || '-',
            Outlet: item.outlet
        }));
        
        const ws = XLSX.utils.json_to_sheet(dataBersih);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, "Stock_Opname");
        
        const outlet = document.getElementById('pilihOutlet').value;
        XLSX.writeFile(wb, `Stock_Opname_${outlet}.xlsx`);
    }

    loadData();
</script>
</body>
</html>
