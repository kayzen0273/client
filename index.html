<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NebulaHeart 3D - Web Gesture Controller</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: black;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 2;
            pointer-events: none;
        }
        #camera-feed {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 240px;
            height: 180px;
            z-index: 2;
            border: 2px solid #00ff00;
            border-radius: 8px;
            transform: scaleX(-1); /* Mirror camera */
            background-color: #222;
        }
        .status-text {
            font-size: 24px;
            font-weight: bold;
            color: #00ff00;
            text-shadow: 2px 2px 4px #000;
            margin-bottom: 5px;
        }
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            font-size: 20px;
            text-align: center;
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div class="loading" id="loading-screen">
        <h2>Mempersiapkan NebulaHeart 3D...</h2>
        <p>Mohon izinkan akses Kamera saat diminta.</p>
    </div>

    <div id="ui-layer">
        <div class="status-text" id="mode-text">MODE: MENCARI TANGAN...</div>
    </div>
    
    <video id="camera-feed" autoplay playsinline></video>
    <div id="canvas-container"></div>

    <script>
        // ==========================================
        // KONFIGURASI & INISIALISASI
        // ==========================================
        const NUM_PARTICLES = 1500;
        let currentMode = 1; 
        // 1: Kosmos, 2: Saturnus, 3: Teks, 4: Hati

        let handTarget = { x: 0, y: 0, z: 0 };
        let handCurrent = { x: 0, y: 0, z: -12 };
        let rotationAngle = 0;

        // Teks Label Mode
        const modeLabels = {
            1: "ROTASI ANGCOSMOS (Terbuka)",
            2: "SATURNUS 3D (Satu Jari)",
            3: "TEKS I LOVE YOU (Peace)",
            4: "BENTUK HATI / LOVE (Kepal)"
        };

        // ==========================================
        // SETUP THREE.JS (RENDERER 3D)
        // ==========================================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 50);
        camera.position.z = 0; // Kamera di pusat, partikel digeser ke z = -12
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // Geometri Partikel
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(NUM_PARTICLES * 3);
        const colors = new Float32Array(NUM_PARTICLES * 3);
        const currentPositions = new Float32Array(NUM_PARTICLES * 3);
        
        // Data Target Posisi
        const posSpace = new Float32Array(NUM_PARTICLES * 3);
        const posPlanet = new Float32Array(NUM_PARTICLES * 3);
        const posText = new Float32Array(NUM_PARTICLES * 3);
        const posHeart = new Float32Array(NUM_PARTICLES * 3);

        // Inisialisasi Data Bentuk
        generateShapes();

        // Salin posSpace ke currentPositions awal
        for(let i = 0; i < NUM_PARTICLES * 3; i++) {
            currentPositions[i] = posSpace[i];
            positions[i] = posSpace[i];
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        // Material Partikel (Additive Blending agar bercahaya/neon)
        const material = new THREE.PointsMaterial({
            size: 0.15,
            vertexColors: true,
            blending: THREE.AdditiveBlending,
            transparent: true,
            opacity: 0.8,
            depthWrite: false
        });

        const particleSystem = new THREE.Points(geometry, material);
        scene.add(particleSystem);

        // ==========================================
        // GENERASI DATA BENTUK (Matematika Python -> JS)
        // ==========================================
        function generateShapes() {
            const NUM_SPHERE = 700;

            // 1. Kosmos (Random Box)
            for(let i=0; i < NUM_PARTICLES; i++) {
                posSpace[i*3] = (Math.random() * 8) - 4.0;
                posSpace[i*3+1] = (Math.random() * 8) - 4.0;
                posSpace[i*3+2] = (Math.random() * 8) - 4.0;
            }

            // 2. Saturnus (Bola Inti + Cincin)
            for(let i=0; i < NUM_PARTICLES; i++) {
                if(i < NUM_SPHERE) {
                    let phi = Math.random() * 2 * Math.PI;
                    let costheta = (Math.random() * 2) - 1;
                    let theta = Math.acos(costheta);
                    let r = 1.3;
                    posPlanet[i*3] = r * Math.sin(theta) * Math.cos(phi);
                    posPlanet[i*3+1] = r * Math.sin(theta) * Math.sin(phi);
                    posPlanet[i*3+2] = r * Math.cos(theta);
                } else {
                    let theta = Math.random() * 2 * Math.PI;
                    let r = 1.8 + Math.random() * 2.0; // 1.8 to 3.8
                    posPlanet[i*3] = r * Math.cos(theta);
                    posPlanet[i*3+1] = (Math.random() * 0.1) - 0.05;
                    posPlanet[i*3+2] = r * Math.sin(theta);
                }
            }

            // 3. Teks "I LOVE YOU" (Membaca pixel dari Canvas 2D)
            const offCanvas = document.createElement('canvas');
            offCanvas.width = 800; offCanvas.height = 200;
            const ctx = offCanvas.getContext('2d');
            ctx.fillStyle = "black"; ctx.fillRect(0, 0, 800, 200);
            ctx.fillStyle = "white"; ctx.font = "bold 120px sans-serif";
            ctx.fillText("I LOVE YOU", 20, 140);
            
            const imgData = ctx.getImageData(0, 0, 800, 200).data;
            const textPoints = [];
            for (let y = 0; y < 200; y += 2) {
                for (let x = 0; x < 800; x += 2) {
                    let alpha = imgData[((y * 800) + x) * 4 + 0]; // Cek channel R
                    if (alpha > 128) {
                        textPoints.push({
                            x: (x - 400) / 70.0,
                            y: -(y - 100) / 70.0,
                            z: (Math.random() * 0.2) - 0.1
                        });
                    }
                }
            }
            // Pilih 1500 titik secara acak dari pixel teks
            for(let i=0; i < NUM_PARTICLES; i++) {
                let p = textPoints[Math.floor(Math.random() * textPoints.length)];
                posText[i*3] = p.x;
                posText[i*3+1] = p.y;
                posText[i*3+2] = p.z;
            }

            // 4. Bentuk Hati (Rumus Parametrik)
            for(let i=0; i < NUM_PARTICLES; i++) {
                let t = (Math.random() * 2 * Math.PI) - Math.PI;
                let p = (Math.random() * 2 * Math.PI) - Math.PI;
                let x = 2.0 * Math.pow(Math.sin(t), 3);
                let y = 2.0 * Math.cos(t) - 0.7 * Math.cos(2*t) - 0.3 * Math.cos(3*t) - 0.1 * Math.cos(4*t);
                let z = Math.sin(p) * 0.4;
                
                posHeart[i*3] = x * 0.85;
                posHeart[i*3+1] = (y * 0.85) + 0.5;
                posHeart[i*3+2] = z;
            }
        }

        // ==========================================
        // LOGIKA DETEKSI GESTUR (MEDIAPIPE)
        // ==========================================
        function calculateGestureMode(landmarks) {
            const tips = [8, 12, 16, 20];
            const pips = [6, 10, 14, 18];
            
            // MediaPipe Web Y-axis terbalik dibanding OpenCV desktop (0 di atas, 1 di bawah)
            // Jari berdiri jika Y tip < Y pip
            let fingersUp = tips.map((tip, i) => landmarks[tip].y < landmarks[pips[i]].y);
            let upCount = fingersUp.filter(Boolean).length;

            if (upCount === 0) return 4; // Hati (Kepal)
            if (fingersUp[0] && !fingersUp[1] && !fingersUp[2] && !fingersUp[3]) return 2; // Saturnus (Telunjuk)
            if (fingersUp[0] && fingersUp[1] && !fingersUp[2] && !fingersUp[3]) return 3; // Peace (Teks)
            
            return 1; // Default
        }

        const videoElement = document.getElementById('camera-feed');
        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        hands.onResults((results) => {
            document.getElementById('loading-screen').style.display = 'none';

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                currentMode = calculateGestureMode(landmarks);
                document.getElementById('mode-text').innerText = "MODE: " + modeLabels[currentMode];

                // Hitung translasi tangan berdasarkan Pergelangan (Wrist - index 0)
                const wrist = landmarks[0];
                // Mirror X (karena kamera di-mirror)
                handTarget.x = -((wrist.x - 0.5) * 15.0); 
                handTarget.y = -((wrist.y - 0.5) * 10.0);
                
                // Estimasi Z dari jarak pergelangan ke pangkal kelingking (Index 17)
                const pinkyMcp = landmarks[17];
                const dx = wrist.x - pinkyMcp.x;
                const dy = wrist.y - pinkyMcp.y;
                const distance = Math.sqrt(dx*dx + dy*dy);
                handTarget.z = -10.0 - (1.0 / (distance + 0.01)) * 0.2;
            } else {
                currentMode = 1;
                document.getElementById('mode-text').innerText = "MODE: ROTASI ANGCOSMOS (Tidak ada tangan)";
                handTarget = { x: 0, y: 0, z: -12 };
            }
        });

        const cameraFeed = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: 480,
            height: 360
        });
        cameraFeed.start();

        // ==========================================
        // LOOP ANIMASI RENDERING 3D
        // ==========================================
        function animate() {
            requestAnimationFrame(animate);

            // Lerp pergerakan sistem (Tangan)
            handCurrent.x += (handTarget.x - handCurrent.x) * 0.15;
            handCurrent.y += (handTarget.y - handCurrent.y) * 0.15;
            handCurrent.z += (handTarget.z - handCurrent.z) * 0.15;

            // Set referensi posisi target berdasarkan mode
            let targetPosArray;
            if (currentMode === 1) { targetPosArray = posSpace; rotationAngle += 0.005; }
            else if (currentMode === 2) { targetPosArray = posPlanet; rotationAngle += 0.02; }
            else if (currentMode === 3) { targetPosArray = posText; rotationAngle = 0; }
            else if (currentMode === 4) { targetPosArray = posHeart; rotationAngle += 0.015; }

            const posAttr = geometry.attributes.position.array;
            const colAttr = geometry.attributes.color.array;

            // Update posisi tiap partikel (Lerp) & Warnanya
            for (let i = 0; i < NUM_PARTICLES; i++) {
                // Lerp Posisi
                currentPositions[i*3] += (targetPosArray[i*3] - currentPositions[i*3]) * 0.15;
                currentPositions[i*3+1] += (targetPosArray[i*3+1] - currentPositions[i*3+1]) * 0.15;
                currentPositions[i*3+2] += (targetPosArray[i*3+2] - currentPositions[i*3+2]) * 0.15;

                posAttr[i*3] = currentPositions[i*3];
                posAttr[i*3+1] = currentPositions[i*3+1];
                posAttr[i*3+2] = currentPositions[i*3+2];

                // Warna (R, G, B)
                if (currentMode === 3) { // Cyan
                    colAttr[i*3] = 0.0; colAttr[i*3+1] = 0.8; colAttr[i*3+2] = 1.0;
                } else if (currentMode === 4) { // Pink/Red
                    colAttr[i*3] = 1.0; colAttr[i*3+1] = 0.1; colAttr[i*3+2] = 0.4;
                } else if (currentMode === 2) { 
                    if (i < 700) { // Oranye Inti Saturnus
                        colAttr[i*3] = 1.0; colAttr[i*3+1] = 0.5; colAttr[i*3+2] = 0.0;
                    } else { // Emas Cincin
                        colAttr[i*3] = 1.0; colAttr[i*3+1] = 0.7; colAttr[i*3+2] = 0.3;
                    }
                } else { // Biru Angcosmos
                    colAttr[i*3] = 0.1; colAttr[i*3+1] = 0.5; colAttr[i*3+2] = 1.0;
                }
            }

            geometry.attributes.position.needsUpdate = true;
            geometry.attributes.color.needsUpdate = true;

            // Transformasi Kamera/Grup
            if ([2, 3, 4].includes(currentMode)) {
                particleSystem.position.set(handCurrent.x, handCurrent.y, handCurrent.z);
                if (currentMode === 2) {
                    particleSystem.rotation.set(0.43, rotationAngle, 0); // glRotatef(25, 1, 0, 0.5) equivalent approx
                } else {
                    particleSystem.rotation.set(0, rotationAngle, 0);
                }
            } else {
                particleSystem.position.set(0, 0, -12);
                particleSystem.rotation.set(0, rotationAngle, 0);
            }

            renderer.render(scene, camera);
        }

        animate();

        // Handle Resize Layar
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
