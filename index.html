<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Opname Supabase</title>
    <!-- Import Supabase Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; padding: 15px; background-color: #f4f7f6; color: #333; }
        .container { max-width: 1100px; margin: 0 auto; background: white; padding: 15px 18px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .header-area { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #f4f7f6; padding-bottom: 10px; margin-bottom: 15px; }
        select { padding: 10px; width: 100%; border: 1px solid #2980b9; border-radius: 4px; font-weight: bold; }
        .form-group { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 25px; padding: 15px; border: 1px dashed #cbd5e1; border-radius: 6px; }
        input { padding: 10px; border: 1px solid #ccc; border-radius: 4px; flex: 1; }
        button { padding: 10px 20px; color: white; border: none; border-radius: 4px; cursor: pointer; background-color: #27ae60; }
        table { width: 100%; border-collapse: collapse; }
        th, td { border: 1px solid #cbd5e1; padding: 10px; text-align: left; }
        .btn-hapus { background-color: #e74c3c; padding: 5px 10px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header-area">
        <h2>📦 Stock Opname (Supabase)</h2>
    </div>

    <select id="pilihOutlet" onchange="loadData()">
        <option value="Outlet_A">📍 Outlet A</option>
        <option value="Outlet_B">📍 Outlet B</option>
    </select>
    
    <div class="form-group">
        <input type="text" id="nama" placeholder="Nama Barang...">
        <input type="number" id="jumlah" placeholder="Stok">
        <input type="text" id="golongan" placeholder="Rak/Golongan...">
        <button onclick="tambahData()">Tambah</button>
    </div>

    <div id="tabelContainer">Memuat data...</div>
</div>

<script>
    const SUPABASE_URL = 'https://mczuqbwofvlzcfezlptu.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1jenVxYndvZnZsemNmZXpscHR1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIzNzU4MzEsImV4cCI6MjA5Nzk1MTgzMX0.zZNZGVVuyhXSltqZWiCrEZsdHSJqS_Tf9kyXkioy_G0';
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function loadData() {
        const outlet = document.getElementById('pilihOutlet').value;
        // Menggunakan nama tabel yang benar: stok_barang
        const { data, error } = await supabaseClient
            .from('stok_barang')
            .select('*')
            .eq('outlet', outlet)
            .order('created_at', { ascending: true });

        if (error) return console.error("Error loadData:", error);
        renderTabel(data);
    }

    async function tambahData() {
        const nama = document.getElementById('nama').value;
        const jumlah = document.getElementById('jumlah').value;
        const golongan = document.getElementById('golongan').value;
        const outlet = document.getElementById('pilihOutlet').value;

        // Menggunakan nama tabel yang benar: stok_barang
        const { error } = await supabaseClient
            .from('stok_barang')
            .insert([{ nama, jumlah: parseInt(jumlah), golongan, outlet }]);

        if (error) alert('Gagal menambah: ' + error.message);
        else loadData();
    }

    async function hapusData(id) {
        // Menggunakan nama tabel yang benar: stok_barang
        const { error } = await supabaseClient.from('stok_barang').delete().eq('id', id);
        if (error) alert('Gagal menghapus');
        else loadData();
    }

    function renderTabel(data) {
        const container = document.getElementById('tabelContainer');
        if (!data || !data.length) return container.innerHTML = 'Data kosong.';
        
        let html = `<table><tr><th>Barang</th><th>Stok</th><th>Rak</th><th>Aksi</th></tr>`;
        data.forEach(item => {
            html += `<tr>
                <td>${item.nama}</td>
                <td>${item.jumlah}</td>
                <td>${item.golongan}</td>
                <td><button class="btn-hapus" onclick="hapusData('${item.id}')">Hapus</button></td>
            </tr>`;
        });
        container.innerHTML = html + `</table>`;
    }

    loadData();
</script>

</body>
</html>
