<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PHOTO BOX — Studio Foto Instan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --booth-black:#1a1816;
    --curtain-red:#b23a30;
    --curtain-red-dark:#8c2c24;
    --paper-cream:#f2e8d5;
    --bulb-amber:#f4b942;
    --ink:#2b2622;
    --teal:#3f6b64;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(ellipse at top, #2a2622 0%, var(--booth-black) 60%);
    color:var(--paper-cream);
    font-family:'Space Mono', monospace;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:32px 16px 80px;
    overflow-x:hidden;
  }

  .marquee{
    position:relative;
    width:100%;
    max-width:720px;
    text-align:center;
    padding:22px 10px 26px;
    margin-bottom:28px;
    background:repeating-linear-gradient(
      -8deg,
      var(--curtain-red),
      var(--curtain-red) 22px,
      var(--curtain-red-dark) 22px,
      var(--curtain-red-dark) 44px
    );
    border-radius:10px;
    box-shadow: 0 10px 0 rgba(0,0,0,.25), 0 14px 24px rgba(0,0,0,.45);
  }
  .marquee::before, .marquee::after{
    content:"";
    position:absolute;
    top:8px; bottom:8px;
    width:14px;
    background-image: radial-gradient(circle, var(--bulb-amber) 0 3.5px, transparent 4px);
    background-size: 22px 22px;
    background-repeat: repeat-y;
    opacity:.9;
    filter: drop-shadow(0 0 4px var(--bulb-amber));
  }
  .marquee::before{ left:6px; }
  .marquee::after{ right:6px; }

  .marquee h1{
    font-family:'Anton', sans-serif;
    font-size:clamp(38px, 7vw, 64px);
    letter-spacing:4px;
    margin:0;
    color:var(--paper-cream);
    text-shadow: 3px 3px 0 var(--ink), 0 0 18px rgba(244,185,66,.35);
  }
  .marquee p{
    margin:6px 0 0;
    font-size:12px;
    letter-spacing:3px;
    text-transform:uppercase;
    color:var(--paper-cream);
    opacity:.85;
  }

  .studio{
    display:flex;
    gap:28px;
    width:100%;
    max-width:940px;
    align-items:flex-start;
    flex-wrap:wrap;
    justify-content:center;
  }

  .camera-unit{
    background: linear-gradient(180deg, #262220, #16130f);
    border-radius:18px;
    padding:18px;
    width:min(520px, 100%);
    box-shadow: inset 0 0 0 2px rgba(244,185,66,.15), 0 18px 40px rgba(0,0,0,.5);
    position:relative;
  }
  .viewfinder{
    position:relative;
    aspect-ratio: 4/3;
    background:#000;
    border-radius:10px;
    overflow:hidden;
    box-shadow: inset 0 0 0 6px var(--ink), inset 0 0 0 8px rgba(244,185,66,.35);
  }
  #video{
    width:100%;
    height:100%;
    object-fit:cover;
    transform: scaleX(-1);
    display:block;
    background:#000;
  }
  #video.mirror-off{ transform:none; }
  .tint{
    position:absolute; inset:0;
    pointer-events:none;
    opacity:0;
    transition:opacity .15s;
  }

  .idle-msg, .error-msg{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:12px;
    text-align:center; padding:24px;
    font-size:13px; line-height:1.6;
    color:var(--paper-cream); background:rgba(0,0,0,.72);
  }
  .idle-msg{ background:rgba(20,17,14,.9); }
  .idle-msg .spinner{
    width:26px; height:26px;
    border-radius:50%;
    border:3px solid rgba(244,185,66,.25);
    border-top-color:var(--bulb-amber);
    animation:spin 1s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .error-msg{ color:#ffb4a8; }
  .retry-btn{
    font-family:'Space Mono', monospace;
    font-size:11px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    background:var(--bulb-amber);
    color:var(--ink);
    border:none;
    padding:8px 16px;
    border-radius:20px;
    cursor:pointer;
    font-weight:700;
  }
  .retry-btn:hover{ filter:brightness(1.08); }

  .countdown{
    position:absolute; inset:0;
    display:none;
    align-items:center; justify-content:center;
    font-family:'Anton', sans-serif;
    font-size:130px;
    color:var(--bulb-amber);
    text-shadow: 0 0 30px rgba(244,185,66,.8);
    background:rgba(0,0,0,.15);
  }
  .flash{
    position:absolute; inset:0;
    background:#fff;
    opacity:0;
    pointer-events:none;
  }
  @keyframes flashPop{
    0%{opacity:0;} 12%{opacity:1;} 100%{opacity:0;}
  }
  .flash.pop{ animation: flashPop .45s ease-out; }

  .shot-counter{
    position:absolute; top:10px; left:10px;
    background:rgba(0,0,0,.6);
    padding:4px 10px;
    border-radius:20px;
    font-size:11px;
    letter-spacing:2px;
    color:var(--bulb-amber);
  }

  .controls{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    margin-top:16px;
    flex-wrap:wrap;
  }
  .filters{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .filter-btn{
    font-family:'Space Mono', monospace;
    font-size:10px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    background:transparent;
    border:1px solid rgba(244,232,213,.35);
    color:var(--paper-cream);
    padding:7px 11px;
    border-radius:20px;
    cursor:pointer;
    transition:.15s;
  }
  .filter-btn:hover{ border-color:var(--bulb-amber); color:var(--bulb-amber); }
  .filter-btn.active{ background:var(--bulb-amber); color:var(--ink); border-color:var(--bulb-amber); font-weight:700; }

  .flip-btn{
    width:40px; height:40px;
    border-radius:50%;
    background:rgba(244,232,213,.08);
    border:1px solid rgba(244,232,213,.35);
    color:var(--paper-cream);
    font-size:16px;
    cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    transition:.15s;
  }
  .flip-btn:hover{ border-color:var(--bulb-amber); color:var(--bulb-amber); }
  .flip-btn:disabled{ opacity:.35; cursor:not-allowed; }

  .shutter-wrap{ display:flex; flex-direction:column; align-items:center; gap:6px; }
  .shutter{
    width:66px; height:66px;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #d75145, var(--curtain-red-dark));
    border:4px solid var(--paper-cream);
    box-shadow: 0 6px 0 rgba(0,0,0,.4), 0 10px 18px rgba(0,0,0,.45);
    cursor:pointer;
    transition: transform .1s;
  }
  .shutter:active{ transform: translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,.4); }
  .shutter:disabled{ opacity:.4; cursor:not-allowed; }
  .shutter-label{ font-size:9px; letter-spacing:2px; opacity:.7; text-transform:uppercase; }

  .strip-area{
    width:min(230px, 100%);
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .frame-picker{
    width:100%;
    margin-bottom:14px;
  }
  .frame-picker-label{
    font-size:9px;
    letter-spacing:2.5px;
    text-transform:uppercase;
    opacity:.6;
    margin-bottom:8px;
    text-align:center;
  }
  .frames{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    justify-content:center;
  }
  .frame-btn{
    font-family:'Space Mono', monospace;
    font-size:9px;
    letter-spacing:1px;
    text-transform:uppercase;
    background:rgba(244,232,213,.06);
    border:1px solid rgba(244,232,213,.3);
    color:var(--paper-cream);
    padding:7px 9px;
    border-radius:8px;
    cursor:pointer;
    transition:.15s;
    display:flex;
    align-items:center;
    gap:5px;
  }
  .frame-btn .swatch{
    width:10px; height:10px;
    border-radius:3px;
    flex-shrink:0;
  }
  .frame-btn:hover{ border-color:var(--bulb-amber); }
  .frame-btn.active{ background:var(--bulb-amber); color:var(--ink); border-color:var(--bulb-amber); font-weight:700; }
  .frame-btn:disabled{ opacity:.4; cursor:not-allowed; }
  .strip-slot{
    background: repeating-linear-gradient(180deg, #100e0c, #100e0c 6px, #17140f 6px, #17140f 12px);
    border-radius: 4px 4px 14px 14px;
    padding:10px 10px 20px;
    width:100%;
    min-height:120px;
    box-shadow: inset 0 6px 14px rgba(0,0,0,.6);
    display:flex;
    justify-content:center;
  }
  #stripCanvas{
    width:100%;
    max-width:190px;
    display:block;
    border-radius:2px;
    box-shadow: 0 10px 24px rgba(0,0,0,.5);
    background:var(--paper-cream);
  }
  @keyframes printOut{
    from{ clip-path: inset(0 0 100% 0); }
    to{ clip-path: inset(0 0 0 0); }
  }
  #stripCanvas.printing{ animation: printOut 1.1s steps(24) forwards; }

  .strip-caption{
    margin-top:10px;
    font-size:10px;
    letter-spacing:2px;
    text-align:center;
    opacity:.65;
    text-transform:uppercase;
  }

  .paper-picker{
    width:100%;
    margin-top:12px;
  }
  .paper-swatches{
    display:flex;
    gap:8px;
    justify-content:center;
  }
  .paper-swatch{
    width:22px; height:22px;
    border-radius:50%;
    cursor:pointer;
    border:2px solid transparent;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.2);
    transition:.15s;
  }
  .paper-swatch.active{ border-color:var(--bulb-amber); transform:scale(1.12); }
  .paper-swatch:disabled{ opacity:.4; cursor:not-allowed; }

  .strip-actions{
    display:flex;
    gap:10px;
    margin-top:16px;
    width:100%;
  }
  .action-btn{
    flex:1;
    font-family:'Space Mono', monospace;
    font-size:11px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    padding:10px 8px;
    border-radius:8px;
    border:1px solid rgba(244,232,213,.3);
    background:transparent;
    color:var(--paper-cream);
    cursor:pointer;
    transition:.15s;
  }
  .action-btn.primary{
    background:var(--teal);
    border-color:var(--teal);
    color:#f2fbf8;
    font-weight:700;
  }
  .action-btn:hover{ filter:brightness(1.15); }
  .action-btn:disabled{ opacity:.35; cursor:not-allowed; }

  .footer-note{
    margin-top:36px;
    font-size:10px;
    letter-spacing:2px;
    opacity:.45;
    text-transform:uppercase;
    text-align:center;
  }

  @media (max-width: 640px){
    .studio{ flex-direction:column; align-items:center; }
    .strip-area{ width:min(260px, 100%); }
  }

  @media (prefers-reduced-motion: reduce){
    .flash.pop{ animation:none; }
    #stripCanvas.printing{ animation:none; }
  }
</style>
</head>
<body>

  <div class="marquee">
    <h1>PHOTO BOX</h1>
    <p>4 Pose · 1 Strip · Kenangan Instan</p>
  </div>

  <div class="studio">

    <div class="camera-unit">
      <div class="viewfinder normal" id="viewfinder">
        <video id="video" autoplay playsinline muted></video>
        <div class="tint" id="tint"></div>
        <div class="idle-msg" id="idleMsg"><div class="spinner"></div>Menyalakan kamera…<br>Izinkan akses kamera di browser kamu.</div>
        <div class="error-msg" id="errorMsg" style="display:none;"></div>
        <div class="countdown" id="countdown">3</div>
        <div class="flash" id="flash"></div>
        <div class="shot-counter" id="shotCounter" style="display:none;">POSE 0/4</div>
      </div>

      <div class="controls">
        <div class="filters" id="filters">
          <button class="filter-btn active" data-filter="normal">Normal</button>
          <button class="filter-btn" data-filter="bw">B&amp;W</button>
          <button class="filter-btn" data-filter="sepia">Sephia</button>
          <button class="filter-btn" data-filter="vintage">Vintage</button>
          <button class="filter-btn" data-filter="cool">Cool</button>
          <button class="filter-btn" data-filter="warm">Warm</button>
          <button class="filter-btn" data-filter="noir">Noir</button>
        </div>
        <div class="shutter-wrap">
          <button class="shutter" id="shutterBtn" title="Mulai sesi foto"></button>
          <span class="shutter-label">Jepret</span>
        </div>
        <button class="flip-btn" id="flipBtn" title="Ganti kamera depan/belakang">⟲</button>
      </div>
    </div>

    <div class="strip-area">
      <div class="frame-picker">
        <div class="frame-picker-label">Pilih Bingkai</div>
        <div class="frames" id="frames">
          <button class="frame-btn active" data-frame="plain"><span class="swatch" style="background:#1a1816;"></span>Klasik</button>
          <button class="frame-btn" data-frame="film"><span class="swatch" style="background:#100e0c;"></span>Film</button>
          <button class="frame-btn" data-frame="polaroid"><span class="swatch" style="background:#ffffff;"></span>Polaroid</button>
          <button class="frame-btn" data-frame="pesta"><span class="swatch" style="background:#e8bb3c;"></span>Pesta</button>
          <button class="frame-btn" data-frame="love"><span class="swatch" style="background:#c8546b;"></span>Love</button>
          <button class="frame-btn" data-frame="neon"><span class="swatch" style="background:#00eaff;"></span>Neon</button>
          <button class="frame-btn" data-frame="birthday"><span class="swatch" style="background:#e8443a;"></span>Ultah</button>
          <button class="frame-btn" data-frame="pastel"><span class="swatch" style="background:linear-gradient(135deg,#ffd6ec,#d6e8ff);"></span>Pastel</button>
          <button class="frame-btn" data-frame="sunset"><span class="swatch" style="background:linear-gradient(135deg,#ffb347,#ff6f9d,#7b2d6b);"></span>Sunset</button>
        </div>
      </div>
      <div class="strip-slot">
        <canvas id="stripCanvas" width="380" height="1160"></canvas>
      </div>
      <div class="strip-caption">Strip kamu akan tercetak di sini</div>
      <div class="paper-picker">
        <div class="frame-picker-label">Warna Kertas</div>
        <div class="paper-swatches" id="paperSwatches">
          <button class="paper-swatch active" data-paper="cream" style="background:#f2e8d5;" title="Krem"></button>
          <button class="paper-swatch" data-paper="pink" style="background:#f7dbe4;" title="Pink"></button>
          <button class="paper-swatch" data-paper="mint" style="background:#dff2e7;" title="Mint"></button>
          <button class="paper-swatch" data-paper="black" style="background:#141212;" title="Hitam"></button>
        </div>
      </div>
      <div class="strip-actions">
        <button class="action-btn" id="retakeBtn" disabled>Ulangi</button>
        <button class="action-btn primary" id="downloadBtn" disabled>Unduh</button>
      </div>
    </div>

  </div>

  <div class="footer-note">Semua foto diproses di perangkatmu — tidak diunggah ke mana pun</div>

<script>
(function(){
  const video = document.getElementById('video');
  const viewfinder = document.getElementById('viewfinder');
  const tintEl = document.getElementById('tint');
  const idleMsg = document.getElementById('idleMsg');
  const errorMsg = document.getElementById('errorMsg');
  const countdownEl = document.getElementById('countdown');
  const flashEl = document.getElementById('flash');
  const shotCounter = document.getElementById('shotCounter');
  const shutterBtn = document.getElementById('shutterBtn');
  const flipBtn = document.getElementById('flipBtn');
  const filterBtns = document.querySelectorAll('.filter-btn');
  const stripCanvas = document.getElementById('stripCanvas');
  const ctx = stripCanvas.getContext('2d');
  const retakeBtn = document.getElementById('retakeBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const paperBtns = document.querySelectorAll('.paper-swatch');

  const TOTAL_SHOTS = 4;
  let currentFilter = 'normal';
  let currentFrame = 'plain';
  let currentPaper = 'cream';
  let capturedFrames = [];
  let busy = false;
  let currentFacing = 'user';
  let currentStream = null;
  const frameBtns = document.querySelectorAll('.frame-btn');

  const PAPERS = {
    cream: { bg:'#f2e8d5', text:'#2b2622', sub:'#6b5f4f' },
    pink:  { bg:'#f7dbe4', text:'#5a2233', sub:'#8a4d5f' },
    mint:  { bg:'#dff2e7', text:'#1f4636', sub:'#3f6b54' },
    black: { bg:'#141212', text:'#f2e8d5', sub:'#a89f8f' }
  };

  const FILTERS = {
    normal:  { css:'none' },
    bw:      { css:'grayscale(1) contrast(1.15)' },
    sepia:   { css:'sepia(.75) contrast(1.05) saturate(1.2)' },
    vintage: { css:'contrast(1.1) saturate(1.35) hue-rotate(-6deg) brightness(1.02)' },
    cool:    { css:'contrast(1.08) saturate(1.1) brightness(1.03)', tint:'#3f7fd1', tintAlpha:.18, blend:'soft-light' },
    warm:    { css:'contrast(1.05) saturate(1.2) brightness(1.05)', tint:'#e8a34e', tintAlpha:.18, blend:'soft-light' },
    noir:    { css:'grayscale(1) contrast(1.55) brightness(.92)' }
  };

  function applyFilter(name){
    const f = FILTERS[name] || FILTERS.normal;
    video.style.filter = f.css;
    if(f.tint){
      tintEl.style.background = f.tint;
      tintEl.style.mixBlendMode = f.blend || 'soft-light';
      tintEl.style.opacity = f.tintAlpha;
    } else {
      tintEl.style.opacity = 0;
    }
  }

  function cameraErrorText(err){
    if(location.protocol !== 'https:' && location.hostname !== 'localhost' && location.protocol !== 'file:'){
      return 'Kamera butuh koneksi HTTPS. Buka halaman ini lewat https:// atau localhost.';
    }
    if(err && err.name === 'NotAllowedError'){
      return 'Izin kamera ditolak. Klik ikon kamera di address bar browser lalu izinkan akses, atau cek pengaturan privasi perangkat.';
    }
    if(err && err.name === 'NotFoundError'){
      return 'Kamera tidak ditemukan di perangkat ini.';
    }
    if(err && err.name === 'NotReadableError'){
      return 'Kamera sedang dipakai aplikasi lain. Tutup aplikasi tersebut lalu coba lagi.';
    }
    if(err && err.name === 'OverconstrainedError'){
      return 'Kamera yang diminta tidak tersedia di perangkat ini.';
    }
    return 'Kamera tidak bisa diakses. Cek izin kamera lalu coba lagi.';
  }

  function showCameraError(msg){
    idleMsg.style.display = 'none';
    errorMsg.style.display = 'flex';
    errorMsg.innerHTML = msg + '<br><button class="retry-btn" id="retryCamBtn">Coba Lagi</button>';
    shutterBtn.disabled = true;
    const retryBtn = document.getElementById('retryCamBtn');
    if(retryBtn) retryBtn.addEventListener('click', initCamera);
  }

  function stopCurrentStream(){
    if(currentStream){
      currentStream.getTracks().forEach(t => t.stop());
      currentStream = null;
    }
  }

  async function initCamera(){
    idleMsg.style.display = 'flex';
    errorMsg.style.display = 'none';
    shutterBtn.disabled = true;

    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      showCameraError('Browser ini tidak mendukung akses kamera, atau halaman tidak dibuka lewat HTTPS/localhost.');
      return;
    }

    stopCurrentStream();

    try{
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: currentFacing, width:{ideal:1280}, height:{ideal:960} },
        audio:false
      });
      currentStream = stream;
      video.srcObject = stream;
      video.muted = true;
      video.classList.toggle('mirror-off', currentFacing === 'environment');

      const reveal = () => {
        idleMsg.style.display = 'none';
        errorMsg.style.display = 'none';
        shutterBtn.disabled = false;
      };

      video.onloadedmetadata = () => {
        const playPromise = video.play();
        if(playPromise && playPromise.catch){ playPromise.catch(()=>{}); }
      };
      video.onplaying = reveal;
      // fallback in case 'playing' never fires on some browsers
      setTimeout(()=>{ if(video.readyState >= 2) reveal(); }, 800);
    }catch(err){
      showCameraError(cameraErrorText(err));
    }
  }
  initCamera();

  flipBtn.addEventListener('click', ()=>{
    if(busy) return;
    currentFacing = currentFacing === 'user' ? 'environment' : 'user';
    initCamera();
  });

  filterBtns.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(busy) return;
      filterBtns.forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      applyFilter(currentFilter);
    });
  });

  paperBtns.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(busy) return;
      paperBtns.forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      currentPaper = btn.dataset.paper;
      if(capturedFrames.length > 0){ renderStrip(); }
      else { drawStripPlaceholder(); }
    });
  });

  frameBtns.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(busy) return;
      frameBtns.forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      currentFrame = btn.dataset.frame;
      if(capturedFrames.length > 0){ renderStrip(); }
    });
  });

  function wait(ms){ return new Promise(r=>setTimeout(r, ms)); }

  async function runCountdown(){
    countdownEl.style.display = 'flex';
    for(const n of [3,2,1]){
      countdownEl.textContent = n;
      await wait(650);
    }
    countdownEl.style.display = 'none';
  }

  function doFlash(){
    flashEl.classList.remove('pop');
    void flashEl.offsetWidth;
    flashEl.classList.add('pop');
  }

  function captureFrame(){
    const c = document.createElement('canvas');
    const vw = video.videoWidth || 640;
    const vh = video.videoHeight || 480;
    const targetRatio = 4/3;
    let sw = vw, sh = vh, sx = 0, sy = 0;
    if (vw/vh > targetRatio){
      sw = vh * targetRatio; sx = (vw - sw)/2;
    } else {
      sh = vw / targetRatio; sy = (vh - sh)/2;
    }
    c.width = 380; c.height = 285;
    const cctx = c.getContext('2d');
    const f = FILTERS[currentFilter] || FILTERS.normal;
    cctx.filter = f.css;
    cctx.save();
    if(currentFacing !== 'environment'){
      cctx.translate(c.width, 0);
      cctx.scale(-1,1);
    }
    cctx.drawImage(video, sx, sy, sw, sh, 0, 0, c.width, c.height);
    cctx.restore();
    cctx.filter = 'none';
    if(f.tint){
      cctx.save();
      cctx.globalCompositeOperation = f.blend || 'soft-light';
      cctx.globalAlpha = f.tintAlpha;
      cctx.fillStyle = f.tint;
      cctx.fillRect(0, 0, c.width, c.height);
      cctx.restore();
    }
    return c;
  }

  // ---------- small shape helpers ----------
  function roundRect(c, x, y, w, h, r){
    c.beginPath();
    c.moveTo(x+r, y);
    c.arcTo(x+w, y, x+w, y+h, r);
    c.arcTo(x+w, y+h, x, y+h, r);
    c.arcTo(x, y+h, x, y, r);
    c.arcTo(x, y, x+w, y, r);
    c.closePath();
  }

  function drawHeart(c, x, y, size, color){
    c.save();
    c.fillStyle = color;
    c.beginPath();
    const top = size*0.3;
    c.moveTo(x, y+top);
    c.bezierCurveTo(x, y, x-size/2, y, x-size/2, y+top);
    c.bezierCurveTo(x-size/2, y+(size+top)/2, x, y+(size+top)/2, x, y+size);
    c.bezierCurveTo(x, y+(size+top)/2, x+size/2, y+(size+top)/2, x+size/2, y+top);
    c.bezierCurveTo(x+size/2, y, x, y, x, y+top);
    c.closePath();
    c.fill();
    c.restore();
  }

  function drawStar(c, x, y, r, color){
    c.save();
    c.fillStyle = color;
    c.beginPath();
    for(let i=0; i<10; i++){
      const ang = (Math.PI/5)*i - Math.PI/2;
      const rad = i%2===0 ? r : r*0.42;
      const px = x + Math.cos(ang)*rad;
      const py = y + Math.sin(ang)*rad;
      i===0 ? c.moveTo(px,py) : c.lineTo(px,py);
    }
    c.closePath();
    c.fill();
    c.restore();
  }

  // seeded pseudo-random so confetti layout stays stable across re-renders
  function seededRand(seed){
    let s = seed;
    return function(){
      s = (s*9301+49297) % 233280;
      return s/233280;
    };
  }

  // ---------- frame decorations ----------
  function decorateFilm(c, W, H, pad, regionTop, regionBottom){
    c.fillStyle = '#100e0c';
    c.fillRect(0, regionTop-10, W, (regionBottom-regionTop)+20);
    const holeW = 10, holeH = 14, spacing = 22;
    c.fillStyle = '#f2e8d5';
    for(let y = regionTop; y <= regionBottom; y += spacing){
      roundRect(c, pad/2 - holeW/2, y, holeW, holeH, 3); c.fill();
      roundRect(c, W - pad/2 - holeW/2, y, holeW, holeH, 3); c.fill();
    }
  }

  function decoratePolaroid(c, p){
    c.save();
    c.shadowColor = 'rgba(0,0,0,.35)';
    c.shadowBlur = 10;
    c.shadowOffsetY = 4;
    c.fillStyle = '#ffffff';
    c.fillRect(p.x-12, p.y-12, p.w+24, p.h+34);
    c.restore();
  }

  function decorateWashiTape(c, p, color){
    c.save();
    c.translate(p.x + p.w/2, p.y-10);
    c.rotate(-0.06);
    c.fillStyle = color;
    c.globalAlpha = .8;
    c.fillRect(-34, -9, 68, 18);
    c.restore();
  }

  function decorateConfetti(c, W, H, topPad, bottomLimit, rand){
    const colors = ['#e8bb3c','#c8443a','#3f6b64','#e58a5f','#f2e8d5'];
    for(let i=0; i<46; i++){
      const x = rand()*W;
      const y = topPad - 18 + rand()*(bottomLimit - topPad + 30);
      const s = 3 + rand()*5;
      const col = colors[Math.floor(rand()*colors.length)];
      c.save();
      c.translate(x, y);
      c.rotate(rand()*Math.PI);
      c.fillStyle = col;
      if(rand() > .5){ c.fillRect(-s/2, -s/2, s, s*1.6); }
      else { c.beginPath(); c.arc(0,0,s*0.6,0,Math.PI*2); c.fill(); }
      c.restore();
    }
  }

  function decorateHearts(c, positions, W, topPad){
    const pink = '#c8546b';
    const rose = '#e58a9a';
    positions.forEach((p)=>{
      drawHeart(c, p.x+6, p.y+6, 12, pink);
      drawHeart(c, p.x+p.w-6, p.y+6, 10, rose);
    });
    drawHeart(c, W/2 - 30, topPad/2 - 4, 14, pink);
    drawHeart(c, W/2 + 30, topPad/2 - 4, 10, rose);
  }

  function decorateNeon(c, W, H, positions, regionTop, regionBottom){
    c.fillStyle = '#0d0221';
    c.fillRect(0, regionTop-16, W, (regionBottom-regionTop)+32);
    positions.forEach(p=>{
      c.save();
      c.shadowColor = '#00eaff';
      c.shadowBlur = 16;
      c.strokeStyle = '#00eaff';
      c.lineWidth = 3;
      roundRect(c, p.x-7, p.y-7, p.w+14, p.h+14, 9);
      c.stroke();
      c.restore();
      c.save();
      c.shadowColor = '#ff3fd8';
      c.shadowBlur = 10;
      c.strokeStyle = '#ff3fd8';
      c.lineWidth = 1.5;
      roundRect(c, p.x-3, p.y-3, p.w+6, p.h+6, 6);
      c.stroke();
      c.restore();
    });
  }

  function drawBalloon(c, x, y, size, color){
    c.save();
    c.fillStyle = color;
    c.beginPath();
    c.ellipse(x, y, size*0.62, size*0.78, 0, 0, Math.PI*2);
    c.fill();
    c.strokeStyle = 'rgba(0,0,0,.2)';
    c.lineWidth = 1;
    c.beginPath();
    c.moveTo(x, y+size*0.78);
    c.quadraticCurveTo(x+5, y+size*0.78+18, x, y+size*0.78+30);
    c.stroke();
    c.restore();
  }

  function decorateBirthday(c, W, topPad, positions, regionBottom){
    const colors = ['#e8443a','#3f9dd1','#e8bb3c','#5fbf6a','#c8546b'];
    const flagY = topPad*0.42;
    const n = 9;
    for(let i=0; i<n; i++){
      const x = (W/(n-1))*i;
      c.save();
      c.fillStyle = colors[i % colors.length];
      c.beginPath();
      c.moveTo(x-9, 6);
      c.lineTo(x+9, 6);
      c.lineTo(x, flagY);
      c.closePath();
      c.fill();
      c.restore();
    }
    drawBalloon(c, 26, regionBottom+16, 20, colors[1]);
    drawBalloon(c, W-26, regionBottom+16, 18, colors[3]);
  }

  function decoratePastelBg(c, W, top, bottom){
    const grad = c.createLinearGradient(0, top, W, bottom);
    grad.addColorStop(0, '#ffe3f1');
    grad.addColorStop(0.5, '#eaf0ff');
    grad.addColorStop(1, '#eaffe6');
    c.fillStyle = grad;
    c.fillRect(0, top, W, bottom-top);
  }

  function decoratePastelBlobs(c, W, top, bottom, rand){
    const colors = ['#ffd6ec','#d6e8ff','#d6ffe4','#fff3c4','#e6d6ff'];
    for(let i=0; i<14; i++){
      const x = rand()*W;
      const y = top + rand()*(bottom-top);
      const r = 10 + rand()*22;
      c.save();
      c.globalAlpha = 0.32;
      c.fillStyle = colors[Math.floor(rand()*colors.length)];
      c.beginPath();
      c.arc(x, y, r, 0, Math.PI*2);
      c.fill();
      c.restore();
    }
  }

  function decoratePastelSticker(c, p){
    c.save();
    c.shadowColor = 'rgba(120,120,170,.28)';
    c.shadowBlur = 12;
    c.shadowOffsetY = 5;
    c.fillStyle = '#ffffff';
    roundRect(c, p.x-7, p.y-7, p.w+14, p.h+14, 14);
    c.fill();
    c.restore();
  }

  function decorateSunsetBg(c, W, top, bottom){
    const grad = c.createLinearGradient(0, top, 0, bottom);
    grad.addColorStop(0, '#2b1055');
    grad.addColorStop(0.35, '#7b2d6b');
    grad.addColorStop(0.7, '#ff6f61');
    grad.addColorStop(1, '#ffb347');
    c.fillStyle = grad;
    c.fillRect(0, top, W, bottom-top);
  }

  function decorateSunsetSun(c, W, topPad){
    const cx = W/2, cy = topPad*0.42, r = 30;
    c.save();
    const grad = c.createRadialGradient(cx, cy, 2, cx, cy, r);
    grad.addColorStop(0, '#fff6c8');
    grad.addColorStop(0.5, '#ffb347');
    grad.addColorStop(1, '#ff6f61');
    c.fillStyle = grad;
    c.beginPath();
    c.arc(cx, cy, r, 0, Math.PI*2);
    c.fill();
    c.restore();
    c.save();
    c.strokeStyle = 'rgba(255,255,255,.55)';
    c.lineWidth = 2;
    for(let i=0; i<4; i++){
      const ly = cy + r*0.55 + i*7;
      c.globalAlpha = 0.5 - i*0.1;
      c.beginPath();
      c.moveTo(cx - r*1.6 + i*3, ly);
      c.lineTo(cx + r*1.6 - i*3, ly);
      c.stroke();
    }
    c.restore();
  }

  function decorateSunsetBorder(c, p, i){
    const pairs = [['#ffd56b','#ff6f9d'], ['#ff9a56','#c9599c']];
    const cols = pairs[i % pairs.length];
    c.save();
    const g = c.createLinearGradient(p.x, p.y, p.x+p.w, p.y+p.h);
    g.addColorStop(0, cols[0]);
    g.addColorStop(1, cols[1]);
    c.strokeStyle = g;
    c.lineWidth = 4;
    roundRect(c, p.x-4, p.y-4, p.w+8, p.h+8, 8);
    c.stroke();
    c.restore();
  }

  function drawStripPlaceholder(){
    const paper = PAPERS[currentPaper] || PAPERS.cream;
    ctx.clearRect(0,0,stripCanvas.width, stripCanvas.height);
    ctx.fillStyle = paper.bg;
    ctx.fillRect(0,0,stripCanvas.width, stripCanvas.height);
  }
  drawStripPlaceholder();

  function renderStrip(){
    const paper = PAPERS[currentPaper] || PAPERS.cream;
    const W = stripCanvas.width;
    const pad = currentFrame === 'film' ? 36 : (currentFrame === 'neon' ? 30 : ((currentFrame === 'pastel' || currentFrame === 'sunset') ? 26 : 22));
    const photoW = W - pad*2;
    const photoH = photoW * 0.75;
    const gap = currentFrame === 'polaroid' ? 30 : (currentFrame === 'pastel' ? 24 : 16);
    const topPad = (currentFrame === 'love' || currentFrame === 'birthday') ? 42 : (currentFrame === 'sunset' ? 46 : (currentFrame === 'pastel' ? 30 : 26));
    const bottomCaption = 92;
    const n = capturedFrames.length;
    const H = topPad + n*photoH + (n-1)*gap + bottomCaption;
    stripCanvas.height = H;

    ctx.fillStyle = paper.bg;
    ctx.fillRect(0,0,W,H);

    const positions = capturedFrames.map((_, i)=>({
      x: pad, y: topPad + i*(photoH+gap), w: photoW, h: photoH
    }));
    const regionTop = topPad;
    const regionBottom = topPad + n*photoH + (n-1)*gap;

    if(currentFrame === 'film'){
      decorateFilm(ctx, W, H, pad, regionTop, regionBottom);
    }
    if(currentFrame === 'neon'){
      ctx.fillStyle = '#0d0221';
      ctx.fillRect(0, regionTop-16, W, (regionBottom-regionTop)+32);
    }
    if(currentFrame === 'pastel'){
      decoratePastelBg(ctx, W, regionTop-14, regionBottom+14);
      decoratePastelBlobs(ctx, W, regionTop-14, regionBottom+14, seededRand(7));
    }
    if(currentFrame === 'sunset'){
      decorateSunsetBg(ctx, W, regionTop-20, regionBottom+20);
      decorateSunsetSun(ctx, W, topPad);
    }

    positions.forEach((p, i)=>{
      if(currentFrame === 'polaroid'){
        decoratePolaroid(ctx, p);
        const tapeColors = ['#e8bb3c','#c8443a','#3f6b64','#e58a5f'];
        decorateWashiTape(ctx, p, tapeColors[i % tapeColors.length]);
      } else if(currentFrame === 'pastel'){
        decoratePastelSticker(ctx, p);
      } else if(currentFrame !== 'sunset'){
        ctx.fillStyle = '#1a1816';
        ctx.fillRect(p.x-4, p.y-4, p.w+8, p.h+8);
      }
      ctx.drawImage(capturedFrames[i], p.x, p.y, p.w, p.h);
      if(currentFrame === 'sunset'){
        decorateSunsetBorder(ctx, p, i);
      }
    });

    if(currentFrame === 'pesta'){
      const rand = seededRand(42);
      decorateConfetti(ctx, W, H, regionTop, regionBottom, rand);
    }
    if(currentFrame === 'love'){
      decorateHearts(ctx, positions, W, topPad);
    }
    if(currentFrame === 'neon'){
      decorateNeon(ctx, W, H, positions, regionTop, regionBottom);
    }
    if(currentFrame === 'birthday'){
      decorateBirthday(ctx, W, topPad, positions, regionBottom);
    }

    const capY = H - bottomCaption + 34;
    const captionColors = {
      plain: paper.text, film: paper.text, polaroid: paper.text,
      pesta: '#3f6b64', love: '#c8546b', neon: '#00eaff', birthday: '#e8443a',
      pastel: '#9b7bc4', sunset: '#e8574a'
    };
    ctx.fillStyle = captionColors[currentFrame] || paper.text;
    ctx.textAlign = 'center';
    ctx.font = "22px 'Anton', sans-serif";
    ctx.fillText('PHOTO BOX', W/2, capY);
    ctx.font = "12px 'Space Mono', monospace";
    ctx.fillStyle = paper.sub;
    const dateStr = new Date().toLocaleDateString('id-ID', {day:'2-digit', month:'short', year:'numeric'});
    ctx.fillText(dateStr, W/2, capY + 22);
  }

  async function startSession(){
    if(busy || errorMsg.style.display === 'flex') return;
    busy = true;
    capturedFrames = [];
    shutterBtn.disabled = true;
    flipBtn.disabled = true;
    filterBtns.forEach(b=>b.disabled = true);
    frameBtns.forEach(b=>b.disabled = true);
    paperBtns.forEach(b=>b.disabled = true);
    retakeBtn.disabled = true;
    downloadBtn.disabled = true;
    shotCounter.style.display = 'block';

    for(let i=1; i<=TOTAL_SHOTS; i++){
      shotCounter.textContent = `POSE ${i}/${TOTAL_SHOTS}`;
      await runCountdown();
      doFlash();
      await wait(120);
      const frame = captureFrame();
      capturedFrames.push(frame);
      renderStrip();
      await wait(400);
    }

    shotCounter.textContent = `SELESAI · ${TOTAL_SHOTS}/${TOTAL_SHOTS}`;
    stripCanvas.classList.remove('printing');
    void stripCanvas.offsetWidth;
    stripCanvas.classList.add('printing');

    busy = false;
    shutterBtn.disabled = false;
    flipBtn.disabled = false;
    filterBtns.forEach(b=>b.disabled = false);
    frameBtns.forEach(b=>b.disabled = false);
    paperBtns.forEach(b=>b.disabled = false);
    retakeBtn.disabled = false;
    downloadBtn.disabled = false;
  }

  shutterBtn.addEventListener('click', startSession);

  retakeBtn.addEventListener('click', ()=>{
    if(busy) return;
    capturedFrames = [];
    stripCanvas.height = 1160;
    drawStripPlaceholder();
    shotCounter.style.display = 'none';
    retakeBtn.disabled = true;
    downloadBtn.disabled = true;
  });

  downloadBtn.addEventListener('click', ()=>{
    if(capturedFrames.length === 0) return;
    const link = document.createElement('a');
    link.download = 'photo-box-strip.png';
    link.href = stripCanvas.toDataURL('image/png');
    link.click();
  });

})();
</script>

</body>
