<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NebulaHeart 3D - Web Gesture Controller (FINAL FIX)</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: black;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        #ui-layer {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 2;
            pointer-events: none;
        }
        #camera-feed {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 240px;
            height: 180px;
            z-index: 2;
            border: 2px solid #00ff00;
            border-radius: 8px;
            transform: scaleX(-1); /* Mirror camera */
            background-color: #222;
        }
        .status-text {
            font-size: 24px;
            font-weight: bold;
            color: #00ff00;
            text-shadow: 2px 2px 4px #000;
            margin-bottom: 5px;
        }
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 10;
            font-size: 20px;
            text-align: center;
        }
        .falling-heart {
            position: absolute;
            top: -30px;
            font-size: 18px;
            opacity: 0;
            pointer-events: none;
            z-index: 3;
            animation-name: fall;
            animation-timing-function: linear;
            animation-fill-mode: forwards;
        }
        @keyframes fall {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.9; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }
        .love-caption {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
            font-size: 32px;
            font-weight: bold;
            color: #ffb3d9;
            text-shadow: 2px 2px 6px #000;
            opacity: 0;
            transition: opacity 0.6s ease;
            pointer-events: none;
            text-align: center;
            max-width: 90vw;
        }
        .love-caption.show {
            opacity: 1;
        }
        #flower-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 4;
            border: none;
            display: none;
            pointer-events: none;
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div class="loading" id="loading-screen">
        <h2>Mempersiapkan NebulaHeart 3D...</h2>
        <p>Mohon izinkan akses Kamera saat diminta.</p>
    </div>

    <div id="ui-layer" style="display: none;">
        <div class="status-text" id="mode-text">MODE: MENCARI TANGAN...</div>
    </div>
    
    <video id="camera-feed" autoplay playsinline style="display: none;"></video>
    <div id="canvas-container"></div>
    <iframe id="flower-overlay"></iframe>
    <div id="love-caption" class="love-caption"></div>

    <script>
        // ==========================================
        // KONFIGURASI & INISIALISASI
        // ==========================================
        const NUM_PARTICLES = 1500;
        let currentMode = 1; 
        
        let handTarget = { x: 0, y: 0, z: 0 };
        let handCurrent = { x: 0, y: 0, z: -12 };
        let rotationAngle = 0;

        // Teks Label Mode
        const modeLabels = {
            1: "ROTASI KOSMOS (Semua Jari Buka)",
            2: "GALAKSI SPIRAL 🌌 (1 Jari Telunjuk)",
            3: "TEKS I LOVE YOU (2 Jari / Peace)",
            4: "BENTUK HATI (Tangan Mengepal)",
            5: "SELY 🫰 (Finger Heart)",
            7: "DNA HELIX 🧬 (Rock Sign)",
            8: "BUKET MAWAR 🌹 (OK Sign)",
            9: "ZEN & CINTA 🤟 (I Love You Sign)"
        };

        // ==========================================
        // SETUP THREE.JS (RENDERER 3D)
        // ==========================================
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 50);
        camera.position.z = 0; 
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // Render manual (autoClear = false) supaya bisa bikin efek "jejak komet" (trail)
        renderer.autoClear = false;
        const trailScene = new THREE.Scene();
        const trailCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
        const trailPlane = new THREE.Mesh(
            new THREE.PlaneGeometry(2, 2),
            new THREE.MeshBasicMaterial({
                color: 0x000000,
                transparent: true,
                opacity: 0.15,
                depthWrite: false,
                depthTest: false
            })
        );
        trailScene.add(trailPlane);

        // Latar bintang statis (Starfield) biar suasana makin "angkasa"
        const NUM_STARS = 600;
        const starGeometry = new THREE.BufferGeometry();
        const starPositions = new Float32Array(NUM_STARS * 3);
        for (let i = 0; i < NUM_STARS; i++) {
            starPositions[i * 3]     = (Math.random() - 0.5) * 60;
            starPositions[i * 3 + 1] = (Math.random() - 0.5) * 60;
            starPositions[i * 3 + 2] = -15 - Math.random() * 25;
        }
        starGeometry.setAttribute('position', new THREE.BufferAttribute(starPositions, 3));
        const starMaterial = new THREE.PointsMaterial({
            size: 0.08,
            color: 0xffffff,
            transparent: true,
            opacity: 0.5,
            sizeAttenuation: true
        });
        const starField = new THREE.Points(starGeometry, starMaterial);
        scene.add(starField);

        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(NUM_PARTICLES * 3);
        const colors = new Float32Array(NUM_PARTICLES * 3);
        const currentPositions = new Float32Array(NUM_PARTICLES * 3);
        
        const posSpace = new Float32Array(NUM_PARTICLES * 3);
        const posText = new Float32Array(NUM_PARTICLES * 3);
        const posHeart = new Float32Array(NUM_PARTICLES * 3);
        const posSely = new Float32Array(NUM_PARTICLES * 3);
        const posGalaxy = new Float32Array(NUM_PARTICLES * 3);
        const posDNA = new Float32Array(NUM_PARTICLES * 3);
        const posRose = new Float32Array(NUM_PARTICLES * 3);
        const ROSE_STEM_COUNT = Math.floor(NUM_PARTICLES * 0.15);
        const posPray = new Float32Array(NUM_PARTICLES * 3); // Mode 9: ZEN + HATI + SELY (vertikal)
        const PRAY_ZEN_COUNT = Math.floor(NUM_PARTICLES * 0.34);
        const PRAY_HEART_COUNT = Math.floor(NUM_PARTICLES * 0.33);

        generateShapes();

        for(let i = 0; i < NUM_PARTICLES * 3; i++) {
            currentPositions[i] = posSpace[i];
            positions[i] = posSpace[i];
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const material = new THREE.PointsMaterial({
            size: 0.15,
            vertexColors: true,
            blending: THREE.AdditiveBlending,
            transparent: true,
            opacity: 0.8,
            depthWrite: false
        });

        const particleSystem = new THREE.Points(geometry, material);
        scene.add(particleSystem);

        function createTextParticles(text, targetArray, scaleX, scaleY, offsetX, offsetY) {
            const offCanvas = document.createElement('canvas');
            offCanvas.width = 800; offCanvas.height = 200;
            const ctx = offCanvas.getContext('2d');
            ctx.fillStyle = "black"; ctx.fillRect(0, 0, 800, 200);
            ctx.fillStyle = "white"; ctx.font = "bold 130px sans-serif";
            ctx.fillText(text, offsetX, offsetY);
            
            const imgData = ctx.getImageData(0, 0, 800, 200).data;
            const textPoints = [];
            for (let y = 0; y < 200; y += 2) {
                for (let x = 0; x < 800; x += 2) {
                    let alpha = imgData[((y * 800) + x) * 4 + 0]; 
                    if (alpha > 128) {
                        textPoints.push({
                            x: (x - 400) / scaleX,
                            y: -(y - 100) / scaleY,
                            z: (Math.random() * 0.2) - 0.1
                        });
                    }
                }
            }
            for(let i=0; i < NUM_PARTICLES; i++) {
                let p = textPoints[Math.floor(Math.random() * textPoints.length)];
                targetArray[i*3] = p.x;
                targetArray[i*3+1] = p.y;
                targetArray[i*3+2] = p.z;
            }
        }

        function generateShapes() {
            for(let i=0; i < NUM_PARTICLES; i++) {
                posSpace[i*3] = (Math.random() * 8) - 4.0;
                posSpace[i*3+1] = (Math.random() * 8) - 4.0;
                posSpace[i*3+2] = (Math.random() * 8) - 4.0;
            }

            createTextParticles("I LOVE YOU", posText, 70.0, 70.0, 20, 140);
            createTextParticles("SELY", posSely, 70.0, 70.0, 230, 140);

            for(let i=0; i < NUM_PARTICLES; i++) {
                let t = (Math.random() * 2 * Math.PI) - Math.PI;
                let p = (Math.random() * 2 * Math.PI) - Math.PI;
                let x = 2.0 * Math.pow(Math.sin(t), 3);
                let y = 2.0 * Math.cos(t) - 0.7 * Math.cos(2*t) - 0.3 * Math.cos(3*t) - 0.1 * Math.cos(4*t);
                let z = Math.sin(p) * 0.4;
                
                posHeart[i*3] = x * 0.85;
                posHeart[i*3+1] = (y * 0.85) + 0.5;
                posHeart[i*3+2] = z;
            }

            // GALAKSI SPIRAL (Mode 6)
            const numArms = 3;
            const galaxyRadius = 2.6;
            for (let i = 0; i < NUM_PARTICLES; i++) {
                let arm = i % numArms;
                let t = Math.random();
                let angle = t * Math.PI * 4 + (arm * (2 * Math.PI / numArms));
                angle += (Math.random() - 0.5) * 0.45;
                let radius = t * galaxyRadius + (Math.random() - 0.5) * 0.15;
                posGalaxy[i*3]   = radius * Math.cos(angle);
                posGalaxy[i*3+1] = (Math.random() - 0.5) * 0.18 * (1 - t * 0.5);
                posGalaxy[i*3+2] = radius * Math.sin(angle);
            }

            // DNA HELIX (Mode 7)
            const dnaHeight = 3.6;
            const dnaRadius = 0.9;
            const dnaTurns = 3;
            for (let i = 0; i < NUM_PARTICLES; i++) {
                if (i % 10 === 0) {
                    // Partikel "anak tangga" yang menghubungkan dua untai DNA
                    let tt = (Math.floor(i / 10) / (NUM_PARTICLES / 10)) * dnaHeight - dnaHeight / 2;
                    let angle = (tt / dnaHeight) * dnaTurns * Math.PI * 2;
                    let frac = Math.random();
                    let rx1 = dnaRadius * Math.cos(angle);
                    let rz1 = dnaRadius * Math.sin(angle);
                    let rx2 = dnaRadius * Math.cos(angle + Math.PI);
                    let rz2 = dnaRadius * Math.sin(angle + Math.PI);
                    posDNA[i*3]   = rx1 + (rx2 - rx1) * frac;
                    posDNA[i*3+1] = tt;
                    posDNA[i*3+2] = rz1 + (rz2 - rz1) * frac;
                } else {
                    let strand = i % 2;
                    let tt = (i / NUM_PARTICLES) * dnaHeight - dnaHeight / 2;
                    let angle = (tt / dnaHeight) * dnaTurns * Math.PI * 2 + (strand === 1 ? Math.PI : 0);
                    posDNA[i*3]   = dnaRadius * Math.cos(angle) + (Math.random() - 0.5) * 0.05;
                    posDNA[i*3+1] = tt;
                    posDNA[i*3+2] = dnaRadius * Math.sin(angle) + (Math.random() - 0.5) * 0.05;
                }
            }

            // BUKET MAWAR (Mode 8) - 3 tangkai mawar berdampingan
            const numRoses = 3;
            const roseOffsets = [-1.1, 0, 1.1];
            for (let i = 0; i < NUM_PARTICLES; i++) {
                let roseIdx = i % numRoses;
                if (i < ROSE_STEM_COUNT) {
                    // Batang & daun hijau di bagian bawah
                    let tt = Math.random();
                    posRose[i*3]   = roseOffsets[roseIdx] + (Math.random() - 0.5) * 0.08;
                    posRose[i*3+1] = -1.0 - tt * 1.8;
                    posRose[i*3+2] = (Math.random() - 0.5) * 0.08;
                } else {
                    // Kelopak: beberapa lapis kurva "rose curve" bertumpuk membentuk bunga
                    let layer = Math.floor(Math.random() * 4); // 0 (dalam) - 3 (luar)
                    let theta = Math.random() * Math.PI * 2;
                    let rMax = 0.32 + layer * 0.14;
                    let r = rMax * Math.abs(Math.cos(2 * theta + layer));
                    let localX = r * Math.cos(theta);
                    let localY = r * Math.sin(theta) * 0.9;
                    posRose[i*3]   = roseOffsets[roseIdx] + localX + (Math.random() - 0.5) * 0.04;
                    posRose[i*3+1] = 0.6 + localY * 0.8 + layer * 0.04 + (Math.random() - 0.5) * 0.04;
                    posRose[i*3+2] = (layer - 1.5) * 0.09 + (Math.random() - 0.5) * 0.04;
                }
            }

            // ZEN + HATI + SELY (Mode 9) - disusun VERTIKAL: teks "ZEN" (atas),
            // bentuk hati (tengah), lalu teks "SELY" (bawah)
            const zenTextPoints = [];
            {
                const offCanvas3 = document.createElement('canvas');
                offCanvas3.width = 800; offCanvas3.height = 200;
                const ctx3 = offCanvas3.getContext('2d');
                ctx3.fillStyle = "black"; ctx3.fillRect(0, 0, 800, 200);
                ctx3.fillStyle = "white"; ctx3.font = "bold 130px sans-serif";
                const zenWidth = ctx3.measureText("ZEN").width;
                ctx3.fillText("ZEN", (800 - zenWidth) / 2, 140);
                const imgData3 = ctx3.getImageData(0, 0, 800, 200).data;
                for (let y = 0; y < 200; y += 2) {
                    for (let x = 0; x < 800; x += 2) {
                        let alpha = imgData3[((y * 800) + x) * 4 + 0];
                        if (alpha > 128) {
                            zenTextPoints.push({
                                x: (x - 400) / 90.0,
                                y: -(y - 100) / 90.0,
                                z: (Math.random() * 0.2) - 0.1
                            });
                        }
                    }
                }
            }

            const selyTextPoints = [];
            {
                const offCanvas2 = document.createElement('canvas');
                offCanvas2.width = 800; offCanvas2.height = 200;
                const ctx2 = offCanvas2.getContext('2d');
                ctx2.fillStyle = "black"; ctx2.fillRect(0, 0, 800, 200);
                ctx2.fillStyle = "white"; ctx2.font = "bold 130px sans-serif";
                ctx2.fillText("SELY", 230, 140);
                const imgData2 = ctx2.getImageData(0, 0, 800, 200).data;
                for (let y = 0; y < 200; y += 2) {
                    for (let x = 0; x < 800; x += 2) {
                        let alpha = imgData2[((y * 800) + x) * 4 + 0];
                        if (alpha > 128) {
                            selyTextPoints.push({
                                x: (x - 400) / 90.0,
                                y: -(y - 100) / 90.0,
                                z: (Math.random() * 0.2) - 0.1
                            });
                        }
                    }
                }
            }

            for (let i = 0; i < NUM_PARTICLES; i++) {
                if (i < PRAY_ZEN_COUNT) {
                    // Teks "ZEN" di ATAS
                    let p = zenTextPoints[Math.floor(Math.random() * zenTextPoints.length)];
                    posPray[i*3]   = p.x;
                    posPray[i*3+1] = p.y + 2.3; // posisi ATAS
                    posPray[i*3+2] = p.z;
                } else if (i < PRAY_ZEN_COUNT + PRAY_HEART_COUNT) {
                    // Bentuk hati kecil di TENGAH
                    let t = (Math.random() * 2 * Math.PI) - Math.PI;
                    let x = 2.0 * Math.pow(Math.sin(t), 3);
                    let y = 2.0 * Math.cos(t) - 0.7 * Math.cos(2*t) - 0.3 * Math.cos(3*t) - 0.1 * Math.cos(4*t);
                    posPray[i*3]   = x * 0.45;
                    posPray[i*3+1] = (y * 0.45) + 0.1; // posisi TENGAH
                    posPray[i*3+2] = (Math.random() - 0.5) * 0.3;
                } else {
                    // Teks "SELY" di BAWAH
                    let p = selyTextPoints[Math.floor(Math.random() * selyTextPoints.length)];
                    posPray[i*3]   = p.x;
                    posPray[i*3+1] = p.y - 2.4; // posisi BAWAH
                    posPray[i*3+2] = p.z;
                }
            }
        }

        // ==========================================
        // LOGIKA DETEKSI GESTUR - URUTAN DIPERBAIKI
        // ==========================================
        function calculateGestureMode(landmarks) {
            const tips = [8, 12, 16, 20];
            const pips = [6, 10, 14, 18];
            
            // Cek status masing-masing 4 jari (Telunjuk, Tengah, Manis, Kelingking)
            let fingersUp = tips.map((tip, i) => landmarks[tip].y < landmarks[pips[i]].y);

            // 1. Cek Mode SELY 🫰 (Prioritas Pertama)
            const thumbTip = landmarks[4];
            const indexTip = landmarks[8];
            const dxHeart = thumbTip.x - indexTip.x;
            const dyHeart = thumbTip.y - indexTip.y;
            const distHeart = Math.sqrt(dxHeart*dxHeart + dyHeart*dyHeart);
            
            // Jika Jempol & Telunjuk berdekatan, dan 3 jari lainnya menekuk
            if (distHeart < 0.08 && !fingersUp[1] && !fingersUp[2] && !fingersUp[3]) {
                return 5; 
            }

            // 2. Cek Mode BUKET MAWAR 🌹 (OK Sign: Jempol & Telunjuk berdekatan, 3 jari lain berdiri)
            if (distHeart < 0.08 && fingersUp[1] && fingersUp[2] && fingersUp[3]) {
                return 8;
            }

            // 3. Cek Mode ZEN & CINTA 🤟 (Sign ILY: Jempol + Telunjuk + Kelingking berdiri,
            //    Tengah & Manis menekuk, dan jempol terentang keluar dari telapak)
            if (fingersUp[0] && !fingersUp[1] && !fingersUp[2] && fingersUp[3]) {
                const thumbMcp = landmarks[2];
                const pinkyMcp = landmarks[17];
                const dxThumbTip = thumbTip.x - pinkyMcp.x;
                const dyThumbTip = thumbTip.y - pinkyMcp.y;
                const distThumbTipPinky = Math.sqrt(dxThumbTip*dxThumbTip + dyThumbTip*dyThumbTip);
                const dxThumbMcp = thumbMcp.x - pinkyMcp.x;
                const dyThumbMcp = thumbMcp.y - pinkyMcp.y;
                const distThumbMcpPinky = Math.sqrt(dxThumbMcp*dxThumbMcp + dyThumbMcp*dyThumbMcp);

                // Jempol terentang menjauh dari telapak (bukan terlipat) -> gestur 🤟
                if (distThumbTipPinky > distThumbMcpPinky * 1.1) {
                    return 9;
                }
            }

            // 4. Cek Mode DNA HELIX 🧬 (Rock Sign: Telunjuk + Kelingking berdiri, jempol terlipat)
            if (fingersUp[0] && !fingersUp[1] && !fingersUp[2] && fingersUp[3]) {
                return 7;
            }

            // 5. Cek Mode I LOVE YOU (2 Jari: Telunjuk & Tengah berdiri)
            if (fingersUp[0] && fingersUp[1] && !fingersUp[2] && !fingersUp[3]) {
                return 3;
            }

            // 6. Cek Mode GALAKSI SPIRAL 🌌 (Hanya 1 Jari Telunjuk berdiri)
            if (fingersUp[0] && !fingersUp[1] && !fingersUp[2] && !fingersUp[3]) {
                return 2;
            }

            // 7. Cek Mode KEPAL (Semua ke-4 jari menekuk)
            if (!fingersUp[0] && !fingersUp[1] && !fingersUp[2] && !fingersUp[3]) {
                return 4;
            }

            // 8. Default: KOSMOS (Semua jari terbuka bebas)
            return 1; 
        }

        // ==========================================
        // OVERLAY ANIMASI BUNGA (Mode 8 - OK Sign)
        // ==========================================
        const FLOWER_HTML = `<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
*,
*::after,
*::before {
  padding: 0;
  margin: 0;
  box-sizing: border-box;
}

:root {
  --dark-color: #000;
}

body {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  min-height: 100vh;
  background-color: var(--dark-color);
  overflow: hidden;
  perspective: 1000px;
}

.night {
  position: fixed;
  left: 50%;
  top: 0;
  transform: translateX(-50%);
  width: 100%;
  height: 100%;
  filter: blur(0.1vmin);
  background-image: radial-gradient(ellipse at top, transparent 0%, var(--dark-color)), radial-gradient(ellipse at bottom, var(--dark-color), rgba(145, 233, 255, 0.2)), repeating-linear-gradient(220deg, rgb(0, 0, 0) 0px, rgb(0, 0, 0) 19px, transparent 19px, transparent 22px), repeating-linear-gradient(189deg, rgb(0, 0, 0) 0px, rgb(0, 0, 0) 19px, transparent 19px, transparent 22px), repeating-linear-gradient(148deg, rgb(0, 0, 0) 0px, rgb(0, 0, 0) 19px, transparent 19px, transparent 22px), linear-gradient(90deg, rgb(7, 107, 42), rgb(240, 240, 240));
}

.flowers {
  position: relative;
  transform: scale(0.9);
}

.flower {
  position: absolute;
  bottom: 10vmin;
  transform-origin: bottom center;
  z-index: 10;
  --fl-speed: 0.3s;
}
.flower--1 {
  -webkit-animation: moving-flower-1 4s linear infinite;
          animation: moving-flower-1 4s linear infinite;
}
.flower--1 .flower__line {
  height: 70vmin;
  -webkit-animation-delay: 0.3s;
          animation-delay: 0.3s;
}
.flower--1 .flower__line__leaf--1 {
  -webkit-animation: blooming-leaf-right var(--fl-speed) 1.6s backwards;
          animation: blooming-leaf-right var(--fl-speed) 1.6s backwards;
}
.flower--1 .flower__line__leaf--2 {
  -webkit-animation: blooming-leaf-right var(--fl-speed) 1.4s backwards;
          animation: blooming-leaf-right var(--fl-speed) 1.4s backwards;
}
.flower--1 .flower__line__leaf--3 {
  -webkit-animation: blooming-leaf-left var(--fl-speed) 1.2s backwards;
          animation: blooming-leaf-left var(--fl-speed) 1.2s backwards;
}
.flower--1 .flower__line__leaf--4 {
  -webkit-animation: blooming-leaf-left var(--fl-speed) 1s backwards;
          animation: blooming-leaf-left var(--fl-speed) 1s backwards;
}
.flower--1 .flower__line__leaf--5 {
  -webkit-animation: blooming-leaf-right var(--fl-speed) 1.8s backwards;
          animation: blooming-leaf-right var(--fl-speed) 1.8s backwards;
}
.flower--1 .flower__line__leaf--6 {
  -webkit-animation: blooming-leaf-left var(--fl-speed) 2s backwards;
          animation: blooming-leaf-left var(--fl-speed) 2s backwards;
}

        const flowerOverlay = document.getElementById('flower-overlay');
        let flowerShown = false;
        function showFlowerOverlay() {
            if (!flowerShown) {
                flowerOverlay.srcdoc = FLOWER_HTML;
                flowerOverlay.style.display = 'block';
                flowerShown = true;
            }
        }
        function hideFlowerOverlay() {
            if (flowerShown) {
                flowerOverlay.style.display = 'none';
                flowerOverlay.srcdoc = '';
                flowerShown = false;
            }
        }

        const videoElement = document.getElementById('camera-feed');
        const captionEl = document.getElementById('love-caption');
        const loveCaptions = {
            4: "Untuk kamu, dengan sepenuh hati 💖",
            5: "Kamu spesial banget buat aku 🫰",
            8: "Sebuket mawar untuk cewek terbaik 🌹",
            9: "aku mau kamu jadi milik ku selamanya 🤟"
        };
        function updateCaption(mode) {
            if (loveCaptions[mode]) {
                captionEl.innerText = loveCaptions[mode];
                captionEl.classList.add('show');
            } else {
                captionEl.classList.remove('show');
            }
        }
        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        hands.onResults((results) => {
            document.getElementById('loading-screen').style.display = 'none';

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                currentMode = calculateGestureMode(landmarks);
                document.getElementById('mode-text').innerText = "MODE: " + modeLabels[currentMode];
                updateCaption(currentMode);
                if (currentMode === 8) {
                    showFlowerOverlay();
                } else {
                    hideFlowerOverlay();
                }

                const wrist = landmarks[0];
                handTarget.x = -((wrist.x - 0.5) * 15.0); 
                handTarget.y = -((wrist.y - 0.5) * 10.0);
                
                const pinkyMcp = landmarks[17];
                const dxDist = wrist.x - pinkyMcp.x;
                const dyDist = wrist.y - pinkyMcp.y;
                const distance = Math.sqrt(dxDist*dxDist + dyDist*dyDist);
                handTarget.z = -10.0 - (1.0 / (distance + 0.01)) * 0.2;
            } else {
                currentMode = 1;
                document.getElementById('mode-text').innerText = "MODE: ROTASI KOSMOS (Tidak ada tangan)";
                handTarget = { x: 0, y: 0, z: -12 };
                updateCaption(1);
                hideFlowerOverlay();
            }
        });

        const cameraFeed = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: 480,
            height: 360
        });
        cameraFeed.start();

        // ==========================================
        // HUJAN HATI & KELOPAK BUNGA (Nuansa Romantis)
        // ==========================================
        const romanticEmojis = ['💗', '🌸', '💕', '✨'];
        function spawnFallingHeart() {
            const heart = document.createElement('div');
            heart.className = 'falling-heart';
            heart.innerText = romanticEmojis[Math.floor(Math.random() * romanticEmojis.length)];
            heart.style.left = (Math.random() * 100) + 'vw';
            const duration = 7 + Math.random() * 6;
            heart.style.animationDuration = duration + 's';
            heart.style.fontSize = (14 + Math.random() * 16) + 'px';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), duration * 1000);
        }
        setInterval(spawnFallingHeart, 750);

        // ==========================================
        // LOOP ANIMASI RENDERING 3D
        // ==========================================
        function animate() {
            requestAnimationFrame(animate);

            handCurrent.x += (handTarget.x - handCurrent.x) * 0.15;
            handCurrent.y += (handTarget.y - handCurrent.y) * 0.15;
            handCurrent.z += (handTarget.z - handCurrent.z) * 0.15;

            let targetPosArray;
            if (currentMode === 1) { targetPosArray = posSpace; rotationAngle += 0.005; }
            else if (currentMode === 2) { targetPosArray = posGalaxy; rotationAngle += 0.006; }
            else if (currentMode === 3) { targetPosArray = posText; rotationAngle = 0; }
            else if (currentMode === 4) { targetPosArray = posHeart; rotationAngle += 0.015; }
            else if (currentMode === 5) { targetPosArray = posSely; rotationAngle = 0; }
            else if (currentMode === 7) { targetPosArray = posDNA; rotationAngle += 0.02; }
            else if (currentMode === 8) { targetPosArray = posRose; rotationAngle += 0.008; }
            else if (currentMode === 9) { targetPosArray = posPray; rotationAngle = 0; }

            const posAttr = geometry.attributes.position.array;
            const colAttr = geometry.attributes.color.array;

            for (let i = 0; i < NUM_PARTICLES; i++) {
                currentPositions[i*3] += (targetPosArray[i*3] - currentPositions[i*3]) * 0.15;
                currentPositions[i*3+1] += (targetPosArray[i*3+1] - currentPositions[i*3+1]) * 0.15;
                currentPositions[i*3+2] += (targetPosArray[i*3+2] - currentPositions[i*3+2]) * 0.15;

                posAttr[i*3] = currentPositions[i*3];
                posAttr[i*3+1] = currentPositions[i*3+1];
                posAttr[i*3+2] = currentPositions[i*3+2];

                if (currentMode === 3) { // Cyan
                    colAttr[i*3] = 0.0; colAttr[i*3+1] = 0.8; colAttr[i*3+2] = 1.0;
                } else if (currentMode === 4) { // Pink/Red
                    colAttr[i*3] = 1.0; colAttr[i*3+1] = 0.1; colAttr[i*3+2] = 0.4;
                } else if (currentMode === 5) { // Ungu Sely
                    colAttr[i*3] = 0.8; colAttr[i*3+1] = 0.2; colAttr[i*3+2] = 1.0;
                } else if (currentMode === 7) { // DNA - untai cyan & magenta, anak tangga putih
                    if (i % 10 === 0) { colAttr[i*3] = 1.0; colAttr[i*3+1] = 1.0; colAttr[i*3+2] = 1.0; }
                    else if (i % 2 === 0) { colAttr[i*3] = 0.0; colAttr[i*3+1] = 1.0; colAttr[i*3+2] = 0.9; }
                    else { colAttr[i*3] = 1.0; colAttr[i*3+1] = 0.0; colAttr[i*3+2] = 0.6; }
                } else if (currentMode === 8) { // Buket Mawar - batang hijau, kelopak merah muda ke merah tua
                    if (i < ROSE_STEM_COUNT) {
                        colAttr[i*3] = 0.1; colAttr[i*3+1] = 0.55; colAttr[i*3+2] = 0.2;
                    } else {
                        let shade = (i % 5) / 5;
                        colAttr[i*3] = 0.9 + shade * 0.1;
                        colAttr[i*3+1] = 0.08 + shade * 0.18;
                        colAttr[i*3+2] = 0.3 + shade * 0.3;
                    }
                } else if (currentMode === 9) { // ZEN (emas lembut) + HATI (pink) + SELY (putih keunguan)
                    if (i < PRAY_ZEN_COUNT) {
                        colAttr[i*3] = 1.0; colAttr[i*3+1] = 0.85; colAttr[i*3+2] = 0.55;
                    } else if (i < PRAY_ZEN_COUNT + PRAY_HEART_COUNT) {
                        colAttr[i*3] = 1.0; colAttr[i*3+1] = 0.15; colAttr[i*3+2] = 0.45;
                    } else {
                        colAttr[i*3] = 0.85; colAttr[i*3+1] = 0.75; colAttr[i*3+2] = 1.0;
                    }
                } else if (currentMode === 2) { // Galaksi - 3 lengan gradasi emas/ungu/biru
                    let arm = i % 3;
                    if (arm === 0) { colAttr[i*3] = 1.0; colAttr[i*3+1] = 0.85; colAttr[i*3+2] = 0.4; }
                    else if (arm === 1) { colAttr[i*3] = 0.6; colAttr[i*3+1] = 0.2; colAttr[i*3+2] = 1.0; }
                    else { colAttr[i*3] = 0.2; colAttr[i*3+1] = 0.6; colAttr[i*3+2] = 1.0; }
                } else { // Biru Angcosmos
                    colAttr[i*3] = 0.1; colAttr[i*3+1] = 0.5; colAttr[i*3+2] = 1.0;
                }
            }

            geometry.attributes.position.needsUpdate = true;
            geometry.attributes.color.needsUpdate = true;

            if ([2, 3, 4, 5, 7, 8, 9].includes(currentMode)) {
                particleSystem.position.set(handCurrent.x, handCurrent.y, handCurrent.z);
                if (currentMode === 2) {
                    particleSystem.rotation.set(0.3, rotationAngle, 0); // sedikit miring seperti galaksi asli
                } else {
                    particleSystem.rotation.set(0, rotationAngle, 0);
                }
            } else {
                particleSystem.position.set(0, 0, -12);
                particleSystem.rotation.set(0, rotationAngle, 0);
            }

            // Bintang latar berkelip pelan + rotasi sangat lambat
            starMaterial.opacity = 0.35 + Math.sin(Date.now() * 0.001) * 0.15;
            starField.rotation.y += 0.0002;

            // Render dengan efek jejak (trail) lalu gambar scene utama di atasnya
            renderer.render(trailScene, trailCamera);
            renderer.render(scene, camera);
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
