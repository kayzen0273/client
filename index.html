<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PHOTO BOX — Studio Foto Instan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --booth-black:#1a1816;
    --curtain-red:#b23a30;
    --curtain-red-dark:#8c2c24;
    --paper-cream:#f2e8d5;
    --bulb-amber:#f4b942;
    --ink:#2b2622;
    --teal:#3f6b64;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: radial-gradient(ellipse at top, #2a2622 0%, var(--booth-black) 60%);
    color:var(--paper-cream);
    font-family:'Space Mono', monospace;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:32px 16px 80px;
    overflow-x:hidden;
  }

  .marquee{
    position:relative;
    width:100%;
    max-width:720px;
    text-align:center;
    padding:22px 10px 26px;
    margin-bottom:28px;
    background:repeating-linear-gradient(
      -8deg,
      var(--curtain-red),
      var(--curtain-red) 22px,
      var(--curtain-red-dark) 22px,
      var(--curtain-red-dark) 44px
    );
    border-radius:10px;
    box-shadow: 0 10px 0 rgba(0,0,0,.25), 0 14px 24px rgba(0,0,0,.45);
  }
  .marquee::before, .marquee::after{
    content:"";
    position:absolute;
    top:8px; bottom:8px;
    width:14px;
    background-image: radial-gradient(circle, var(--bulb-amber) 0 3.5px, transparent 4px);
    background-size: 22px 22px;
    background-repeat: repeat-y;
    opacity:.9;
    filter: drop-shadow(0 0 4px var(--bulb-amber));
  }
  .marquee::before{ left:6px; }
  .marquee::after{ right:6px; }

  .marquee h1{
    font-family:'Anton', sans-serif;
    font-size:clamp(38px, 7vw, 64px);
    letter-spacing:4px;
    margin:0;
    color:var(--paper-cream);
    text-shadow: 3px 3px 0 var(--ink), 0 0 18px rgba(244,185,66,.35);
  }
  .marquee p{
    margin:6px 0 0;
    font-size:12px;
    letter-spacing:3px;
    text-transform:uppercase;
    color:var(--paper-cream);
    opacity:.85;
  }

  .studio{
    display:flex;
    gap:28px;
    width:100%;
    max-width:940px;
    align-items:flex-start;
    flex-wrap:wrap;
    justify-content:center;
  }

  .camera-unit{
    background: linear-gradient(180deg, #262220, #16130f);
    border-radius:18px;
    padding:18px;
    width:min(520px, 100%);
    box-shadow: inset 0 0 0 2px rgba(244,185,66,.15), 0 18px 40px rgba(0,0,0,.5);
    position:relative;
  }
  .viewfinder{
    position:relative;
    aspect-ratio: 4/3;
    background:#000;
    border-radius:10px;
    overflow:hidden;
    box-shadow: inset 0 0 0 6px var(--ink), inset 0 0 0 8px rgba(244,185,66,.35);
  }
  #video{
    width:100%;
    height:100%;
    object-fit:cover;
    transform: scaleX(-1);
    display:block;
  }
  .viewfinder.bw #video{ filter:grayscale(1) contrast(1.15); }
  .viewfinder.sepia #video{ filter:sepia(.75) contrast(1.05) saturate(1.2); }
  .viewfinder.vintage #video{ filter:contrast(1.1) saturate(1.35) hue-rotate(-6deg) brightness(1.02); }
  .viewfinder.normal #video{ filter:none; }

  .idle-msg, .error-msg{
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    text-align:center; padding:24px;
    font-size:13px; line-height:1.6;
    color:var(--paper-cream); background:rgba(0,0,0,.55);
  }
  .error-msg{ color:#ffb4a8; }

  .countdown{
    position:absolute; inset:0;
    display:none;
    align-items:center; justify-content:center;
    font-family:'Anton', sans-serif;
    font-size:130px;
    color:var(--bulb-amber);
    text-shadow: 0 0 30px rgba(244,185,66,.8);
    background:rgba(0,0,0,.15);
  }
  .flash{
    position:absolute; inset:0;
    background:#fff;
    opacity:0;
    pointer-events:none;
  }
  @keyframes flashPop{
    0%{opacity:0;} 12%{opacity:1;} 100%{opacity:0;}
  }
  .flash.pop{ animation: flashPop .45s ease-out; }

  .shot-counter{
    position:absolute; top:10px; left:10px;
    background:rgba(0,0,0,.6);
    padding:4px 10px;
    border-radius:20px;
    font-size:11px;
    letter-spacing:2px;
    color:var(--bulb-amber);
  }

  .controls{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    margin-top:16px;
    flex-wrap:wrap;
  }
  .filters{
    display:flex;
    gap:8px;
    flex-wrap:wrap;
  }
  .filter-btn{
    font-family:'Space Mono', monospace;
    font-size:10px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    background:transparent;
    border:1px solid rgba(244,232,213,.35);
    color:var(--paper-cream);
    padding:7px 11px;
    border-radius:20px;
    cursor:pointer;
    transition:.15s;
  }
  .filter-btn:hover{ border-color:var(--bulb-amber); color:var(--bulb-amber); }
  .filter-btn.active{ background:var(--bulb-amber); color:var(--ink); border-color:var(--bulb-amber); font-weight:700; }

  .shutter-wrap{ display:flex; flex-direction:column; align-items:center; gap:6px; }
  .shutter{
    width:66px; height:66px;
    border-radius:50%;
    background: radial-gradient(circle at 35% 30%, #d75145, var(--curtain-red-dark));
    border:4px solid var(--paper-cream);
    box-shadow: 0 6px 0 rgba(0,0,0,.4), 0 10px 18px rgba(0,0,0,.45);
    cursor:pointer;
    transition: transform .1s;
  }
  .shutter:active{ transform: translateY(4px); box-shadow:0 2px 0 rgba(0,0,0,.4); }
  .shutter:disabled{ opacity:.4; cursor:not-allowed; }
  .shutter-label{ font-size:9px; letter-spacing:2px; opacity:.7; text-transform:uppercase; }

  .strip-area{
    width:min(230px, 100%);
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .strip-slot{
    background: repeating-linear-gradient(180deg, #100e0c, #100e0c 6px, #17140f 6px, #17140f 12px);
    border-radius: 4px 4px 14px 14px;
    padding:10px 10px 20px;
    width:100%;
    min-height:120px;
    box-shadow: inset 0 6px 14px rgba(0,0,0,.6);
    display:flex;
    justify-content:center;
  }
  #stripCanvas{
    width:100%;
    max-width:190px;
    display:block;
    border-radius:2px;
    box-shadow: 0 10px 24px rgba(0,0,0,.5);
    background:var(--paper-cream);
  }
  @keyframes printOut{
    from{ clip-path: inset(0 0 100% 0); }
    to{ clip-path: inset(0 0 0 0); }
  }
  #stripCanvas.printing{ animation: printOut 1.1s steps(24) forwards; }

  .strip-caption{
    margin-top:10px;
    font-size:10px;
    letter-spacing:2px;
    text-align:center;
    opacity:.65;
    text-transform:uppercase;
  }

  .strip-actions{
    display:flex;
    gap:10px;
    margin-top:16px;
    width:100%;
  }
  .action-btn{
    flex:1;
    font-family:'Space Mono', monospace;
    font-size:11px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    padding:10px 8px;
    border-radius:8px;
    border:1px solid rgba(244,232,213,.3);
    background:transparent;
    color:var(--paper-cream);
    cursor:pointer;
    transition:.15s;
  }
  .action-btn.primary{
    background:var(--teal);
    border-color:var(--teal);
    color:#f2fbf8;
    font-weight:700;
  }
  .action-btn:hover{ filter:brightness(1.15); }
  .action-btn:disabled{ opacity:.35; cursor:not-allowed; }

  .footer-note{
    margin-top:36px;
    font-size:10px;
    letter-spacing:2px;
    opacity:.45;
    text-transform:uppercase;
    text-align:center;
  }

  @media (max-width: 640px){
    .studio{ flex-direction:column; align-items:center; }
    .strip-area{ width:min(260px, 100%); }
  }

  @media (prefers-reduced-motion: reduce){
    .flash.pop{ animation:none; }
    #stripCanvas.printing{ animation:none; }
  }
</style>
</head>
<body>

  <div class="marquee">
    <h1>PHOTO BOX</h1>
    <p>4 Pose · 1 Strip · Kenangan Instan</p>
  </div>

  <div class="studio">

    <div class="camera-unit">
      <div class="viewfinder normal" id="viewfinder">
        <video id="video" autoplay playsinline muted></video>
        <div class="idle-msg" id="idleMsg">Menyalakan kamera…<br>Izinkan akses kamera di browser kamu.</div>
        <div class="error-msg" id="errorMsg" style="display:none;">Kamera tidak bisa diakses.<br>Cek izin kamera lalu muat ulang halaman.</div>
        <div class="countdown" id="countdown">3</div>
        <div class="flash" id="flash"></div>
        <div class="shot-counter" id="shotCounter" style="display:none;">POSE 0/4</div>
      </div>

      <div class="controls">
        <div class="filters" id="filters">
          <button class="filter-btn active" data-filter="normal">Normal</button>
          <button class="filter-btn" data-filter="bw">B&amp;W</button>
          <button class="filter-btn" data-filter="sepia">Sephia</button>
          <button class="filter-btn" data-filter="vintage">Vintage</button>
        </div>
        <div class="shutter-wrap">
          <button class="shutter" id="shutterBtn" title="Mulai sesi foto"></button>
          <span class="shutter-label">Jepret</span>
        </div>
      </div>
    </div>

    <div class="strip-area">
      <div class="strip-slot">
        <canvas id="stripCanvas" width="380" height="1160"></canvas>
      </div>
      <div class="strip-caption">Strip kamu akan tercetak di sini</div>
      <div class="strip-actions">
        <button class="action-btn" id="retakeBtn" disabled>Ulangi</button>
        <button class="action-btn primary" id="downloadBtn" disabled>Unduh</button>
      </div>
    </div>

  </div>

  <div class="footer-note">Semua foto diproses di perangkatmu — tidak diunggah ke mana pun</div>

<script>
(function(){
  const video = document.getElementById('video');
  const viewfinder = document.getElementById('viewfinder');
  const idleMsg = document.getElementById('idleMsg');
  const errorMsg = document.getElementById('errorMsg');
  const countdownEl = document.getElementById('countdown');
  const flashEl = document.getElementById('flash');
  const shotCounter = document.getElementById('shotCounter');
  const shutterBtn = document.getElementById('shutterBtn');
  const filterBtns = document.querySelectorAll('.filter-btn');
  const stripCanvas = document.getElementById('stripCanvas');
  const ctx = stripCanvas.getContext('2d');
  const retakeBtn = document.getElementById('retakeBtn');
  const downloadBtn = document.getElementById('downloadBtn');

  const TOTAL_SHOTS = 4;
  let currentFilter = 'normal';
  let capturedFrames = [];
  let busy = false;

  const filterCSS = {
    normal: 'none',
    bw: 'grayscale(1) contrast(1.15)',
    sepia: 'sepia(.75) contrast(1.05) saturate(1.2)',
    vintage: 'contrast(1.1) saturate(1.35) hue-rotate(-6deg) brightness(1.02)'
  };

  async function initCamera(){
    try{
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode:'user', width:{ideal:1280}, height:{ideal:960} },
        audio:false
      });
      video.srcObject = stream;
      idleMsg.style.display = 'none';
    }catch(err){
      idleMsg.style.display = 'none';
      errorMsg.style.display = 'flex';
      shutterBtn.disabled = true;
    }
  }
  initCamera();

  filterBtns.forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(busy) return;
      filterBtns.forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      viewfinder.className = 'viewfinder ' + currentFilter;
    });
  });

  function wait(ms){ return new Promise(r=>setTimeout(r, ms)); }

  async function runCountdown(){
    countdownEl.style.display = 'flex';
    for(const n of [3,2,1]){
      countdownEl.textContent = n;
      await wait(650);
    }
    countdownEl.style.display = 'none';
  }

  function doFlash(){
    flashEl.classList.remove('pop');
    void flashEl.offsetWidth;
    flashEl.classList.add('pop');
  }

  function captureFrame(){
    const c = document.createElement('canvas');
    const vw = video.videoWidth || 640;
    const vh = video.videoHeight || 480;
    const targetRatio = 4/3;
    let sw = vw, sh = vh, sx = 0, sy = 0;
    if (vw/vh > targetRatio){
      sw = vh * targetRatio; sx = (vw - sw)/2;
    } else {
      sh = vw / targetRatio; sy = (vh - sh)/2;
    }
    c.width = 380; c.height = 285;
    const cctx = c.getContext('2d');
    cctx.filter = filterCSS[currentFilter];
    cctx.save();
    cctx.translate(c.width, 0);
    cctx.scale(-1,1);
    cctx.drawImage(video, sx, sy, sw, sh, 0, 0, c.width, c.height);
    cctx.restore();
    return c;
  }

  function drawStripPlaceholder(){
    ctx.clearRect(0,0,stripCanvas.width, stripCanvas.height);
    ctx.fillStyle = '#f2e8d5';
    ctx.fillRect(0,0,stripCanvas.width, stripCanvas.height);
  }
  drawStripPlaceholder();

  function renderStrip(){
    const W = stripCanvas.width;
    const pad = 20;
    const photoW = W - pad*2;
    const photoH = photoW * 0.75;
    const gap = 16;
    const topPad = 24;
    const bottomCaption = 90;
    const H = topPad + capturedFrames.length*photoH + (capturedFrames.length-1)*gap + bottomCaption;
    stripCanvas.height = H;

    ctx.fillStyle = '#f2e8d5';
    ctx.fillRect(0,0,W,H);

    capturedFrames.forEach((frameCanvas, i)=>{
      const y = topPad + i*(photoH+gap);
      ctx.fillStyle = '#1a1816';
      ctx.fillRect(pad-4, y-4, photoW+8, photoH+8);
      ctx.drawImage(frameCanvas, pad, y, photoW, photoH);
    });

    const capY = H - bottomCaption + 32;
    ctx.fillStyle = '#2b2622';
    ctx.textAlign = 'center';
    ctx.font = "22px 'Anton', sans-serif";
    ctx.fillText('PHOTO BOX', W/2, capY);
    ctx.font = "12px 'Space Mono', monospace";
    ctx.fillStyle = '#6b5f4f';
    const dateStr = new Date().toLocaleDateString('id-ID', {day:'2-digit', month:'short', year:'numeric'});
    ctx.fillText(dateStr, W/2, capY + 22);
  }

  async function startSession(){
    if(busy || errorMsg.style.display === 'flex') return;
    busy = true;
    capturedFrames = [];
    shutterBtn.disabled = true;
    filterBtns.forEach(b=>b.disabled = true);
    retakeBtn.disabled = true;
    downloadBtn.disabled = true;
    shotCounter.style.display = 'block';

    for(let i=1; i<=TOTAL_SHOTS; i++){
      shotCounter.textContent = `POSE ${i}/${TOTAL_SHOTS}`;
      await runCountdown();
      doFlash();
      await wait(120);
      const frame = captureFrame();
      capturedFrames.push(frame);
      renderStrip();
      await wait(400);
    }

    shotCounter.textContent = `SELESAI · ${TOTAL_SHOTS}/${TOTAL_SHOTS}`;
    stripCanvas.classList.remove('printing');
    void stripCanvas.offsetWidth;
    stripCanvas.classList.add('printing');

    busy = false;
    shutterBtn.disabled = false;
    filterBtns.forEach(b=>b.disabled = false);
    retakeBtn.disabled = false;
    downloadBtn.disabled = false;
  }

  shutterBtn.addEventListener('click', startSession);

  retakeBtn.addEventListener('click', ()=>{
    if(busy) return;
    capturedFrames = [];
    stripCanvas.height = 1160;
    drawStripPlaceholder();
    shotCounter.style.display = 'none';
    retakeBtn.disabled = true;
    downloadBtn.disabled = true;
  });

  downloadBtn.addEventListener('click', ()=>{
    if(capturedFrames.length === 0) return;
    const link = document.createElement('a');
    link.download = 'photo-box-strip.png';
    link.href = stripCanvas.toDataURL('image/png');
    link.click();
  });

})();
</script>

</body>
</html>
