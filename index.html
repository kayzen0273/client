<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Muslim App - Jadwal & Kiblat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background-color: #f8fafc; }
        .compass-container { position: relative; width: 220px; height: 220px; transition: all 0.5s ease; }
        .needle { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        #notification-banner { transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .active-prayer { border-color: #059669; background-color: #ecfdf5; }
    </style>
</head>
<body class="pb-10">

    <!-- NOTIFIKASI ATAS LAYAR -->
    <div id="notification-banner" class="fixed top-0 left-0 w-full bg-emerald-600 text-white p-4 shadow-2xl transform -translate-y-full z-50 flex items-center justify-between">
        <div class="flex items-center gap-3">
            <i class="fas fa-bell text-2xl animate-bounce"></i>
            <div>
                <p class="font-bold text-lg" id="notif-msg">Waktu Sholat Tiba!</p>
                <p class="text-sm opacity-90">Mari tunaikan ibadah sholat.</p>
            </div>
        </div>
        <button onclick="hideNotif()" class="bg-white/20 p-2 rounded-full"><i class="fas fa-times"></i></button>
    </div>

    <!-- HEADER -->
    <div class="bg-emerald-700 text-white p-6 rounded-b-[3rem] shadow-lg mb-6 relative overflow-hidden">
        <div class="absolute -right-10 -top-10 opacity-10">
            <i class="fas fa-moon text-9xl"></i>
        </div>
        <div class="max-w-md mx-auto relative z-10">
            <div class="flex justify-between items-start">
                <div>
                    <h1 class="text-2xl font-bold">MuslimKu</h1>
                    <p id="city-name" class="text-emerald-100 text-sm"><i class="fas fa-location-dot mr-1"></i> Mencari lokasi...</p>
                </div>
                <div class="text-right">
                    <p id="live-clock" class="text-2xl font-mono font-bold">00:00:00</p>
                    <p id="live-date" class="text-xs opacity-80">-- --- ----</p>
                </div>
            </div>
        </div>
    </div>

    <div class="max-w-md mx-auto px-4 space-y-5">
        
        <!-- STATUS CARD -->
        <div id="bg-info-card" class="bg-blue-50 border border-blue-200 rounded-2xl p-4 flex gap-3 items-start">
            <i class="fas fa-circle-info text-blue-500 mt-1"></i>
            <div class="text-xs text-blue-800">
                <p class="font-bold mb-1">Mode Notifikasi Aktif</p>
                <p>Agar tetap berbunyi, biarkan tab ini terbuka. Aplikasi akan otomatis mengingatkan saat waktu sholat tiba.</p>
            </div>
        </div>

        <!-- JADWAL SHOLAT -->
        <div class="bg-white rounded-3xl p-5 shadow-sm border border-emerald-50">
            <h2 class="font-bold text-gray-700 mb-4 flex items-center gap-2">
                <i class="fas fa-calendar-day text-emerald-600"></i> Jadwal Sholat Hari Ini
            </h2>
            <div id="prayer-grid" class="grid grid-cols-2 gap-3">
                <div class="animate-pulse bg-gray-100 h-12 rounded-xl col-span-2"></div>
            </div>
            
            <div class="flex gap-2 mt-4">
                <button onclick="testNotif()" class="flex-1 py-2.5 text-xs font-semibold text-emerald-700 bg-emerald-50 rounded-xl hover:bg-emerald-100 transition">
                    <i class="fas fa-vial mr-1"></i> Tes Suara & Notif
                </button>
                <button id="btn-notif-permission" onclick="requestNotifPermission()" class="flex-1 py-2.5 text-xs font-bold text-white bg-emerald-600 rounded-xl hover:bg-emerald-700 shadow-md transition animate-pulse">
                    <i class="fas fa-bell mr-1"></i> Aktifkan Izin
                </button>
            </div>
        </div>

        <!-- KOMPAS -->
        <div class="bg-white rounded-3xl p-6 shadow-sm border border-emerald-50 text-center">
            <h2 class="font-bold text-gray-700 mb-4 text-left flex items-center gap-2">
                <i class="fas fa-compass text-emerald-600"></i> Arah Kiblat
            </h2>
            <div class="flex justify-center mb-6">
                <div class="compass-container bg-slate-50 rounded-full border-8 border-white shadow-inner flex items-center justify-center">
                    <div id="compass-ring" class="absolute w-full h-full rounded-full border-2 border-dashed border-emerald-200">
                        <span class="absolute top-1 left-1/2 -translate-x-1/2 font-bold text-red-500">U</span>
                    </div>
                    <div id="qibla-needle" class="needle absolute w-full h-full flex flex-col items-center justify-start pt-4">
                        <i class="fas fa-location-arrow text-emerald-600 text-4xl"></i>
                    </div>
                    <div class="z-10 bg-gray-800 p-2 rounded-lg shadow-lg">
                        <i class="fas fa-kaaba text-white text-xl"></i>
                    </div>
                </div>
            </div>
            <button id="sensor-btn" onclick="requestSensor()" class="bg-emerald-50 text-emerald-700 border border-emerald-200 w-full py-3 rounded-2xl font-bold transition">
                <i class="fas fa-location-arrow mr-2"></i> Sinkron Kompas
            </button>
        </div>
    </div>

    <!-- Audio Element untuk Notifikasi -->
    <audio id="notif-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script>
        let qiblaAngle = 295;
        let prayerTimes = {};
        let scheduledTimeouts = [];
        const prayers = [
            {id: 'Fajr', label: 'Subuh'},
            {id: 'Dhuhr', label: 'Dzuhur'},
            {id: 'Asr', label: 'Ashar'},
            {id: 'Maghrib', label: 'Maghrib'},
            {id: 'Isha', label: 'Isya'}
        ];

        // 1. Inisialisasi Jam & Hari
        function updateClock() {
            const now = new Date();
            document.getElementById('live-clock').innerText = now.toLocaleTimeString('id-ID', { hour12: false });
            document.getElementById('live-date').innerText = now.toLocaleDateString('id-ID', {day:'numeric', month:'long', year:'numeric'});
        }
        setInterval(updateClock, 1000);

        // 2. Load Aplikasi
        async function initApp() {
            // Cek izin notifikasi
            if ("Notification" in window && Notification.permission === "granted") {
                document.getElementById('btn-notif-permission').classList.add('hidden');
            }

            // Dapatkan Lokasi
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    const { latitude, longitude } = pos.coords;
                    fetchPrayers(latitude, longitude);
                    calculateQibla(latitude, longitude);
                    document.getElementById('city-name').innerHTML = `<i class="fas fa-location-crosshairs mr-1"></i> Lokasi Aktif`;
                }, err => {
                    fetchPrayers(-6.2, 106.8); // Default Jakarta
                    document.getElementById('city-name').innerHTML = `<i class="fas fa-map-pin mr-1"></i> Jakarta (Default)`;
                });
            }
            
            // Wake Lock agar layar tidak mati (jika didukung)
            if ('wakeLock' in navigator) {
                try { await navigator.wakeLock.request('screen'); } catch (err) {}
            }
        }

        // 3. Ambil Jadwal Sholat
        async function fetchPrayers(lat, lon) {
            try {
                const res = await fetch(`https://api.aladhan.com/v1/timings?latitude=${lat}&longitude=${lon}&method=20`);
                const data = await res.json();
                prayerTimes = data.data.timings;
                renderPrayers();
                scheduleNotifications();
            } catch (e) {
                console.error("Gagal memuat jadwal");
            }
        }

        function renderPrayers() {
            const grid = document.getElementById('prayer-grid');
            grid.innerHTML = '';
            prayers.forEach(p => {
                grid.innerHTML += `
                    <div id="card-${p.id}" class="bg-white border border-emerald-100 p-3 rounded-2xl flex justify-between items-center transition-all">
                        <span class="text-gray-600 font-medium">${p.label}</span>
                        <span class="text-emerald-700 font-bold">${prayerTimes[p.id]}</span>
                    </div>
                `;
            });
        }

        // 4. Penjadwalan Notifikasi (Foreground)
        function scheduleNotifications() {
            // Bersihkan jadwal lama
            scheduledTimeouts.forEach(clearTimeout);
            scheduledTimeouts = [];

            const now = new Date();
            prayers.forEach(p => {
                const [h, m] = prayerTimes[p.id].split(':').map(Number);
                const pDate = new Date();
                pDate.setHours(h, m, 0, 0);

                const diff = pDate.getTime() - now.getTime();
                if (diff > 0) {
                    const timeout = setTimeout(() => {
                        triggerPrayerNotification(p.label);
                    }, diff);
                    scheduledTimeouts.push(timeout);
                }
            });
        }

        function triggerPrayerNotification(label) {
            // Banner In-App
            const banner = document.getElementById('notification-banner');
            document.getElementById('notif-msg').innerText = `Waktu ${label} Tiba!`;
            banner.classList.remove('-translate-y-full');
            
            // Bunyi
            const sound = document.getElementById('notif-sound');
            sound.play().catch(e => console.log("Interaksi user diperlukan untuk suara"));

            // Getar
            if (navigator.vibrate) navigator.vibrate([500, 200, 500]);

            // Sistem Notif (jika diizinkan)
            if (Notification.permission === "granted") {
                new Notification(`Waktu ${label}!`, {
                    body: `Sudah masuk waktu sholat ${label}.`,
                    icon: "https://cdn-icons-png.flaticon.com/512/3592/3592864.png"
                });
            }
        }

        async function requestNotifPermission() {
            const permission = await Notification.requestPermission();
            if (permission === "granted") {
                document.getElementById('btn-notif-permission').classList.add('hidden');
                triggerPrayerNotification("Notifikasi Aktif");
            }
        }

        function testNotif() {
            triggerPrayerNotification("Tes");
            setTimeout(hideNotif, 4000);
        }

        function hideNotif() {
            document.getElementById('notification-banner').classList.add('-translate-y-full');
        }

        // 5. Kompas Kiblat
        function calculateQibla(lat, lon) {
            const mLat = 21.422487 * Math.PI / 180;
            const mLon = 39.826206 * Math.PI / 180;
            const pLat = lat * Math.PI / 180;
            const pLon = lon * Math.PI / 180;
            const y = Math.sin(mLon - pLon);
            const x = Math.cos(pLat) * Math.tan(mLat) - Math.sin(pLat) * Math.cos(mLon - pLon);
            qiblaAngle = (Math.atan2(y, x) * 180 / Math.PI + 360) % 360;
            document.getElementById('qibla-needle').style.transform = `rotate(${qiblaAngle}deg)`;
        }

        function requestSensor() {
            if (typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permission => {
                        if (permission === 'granted') startCompass();
                    });
            } else {
                startCompass();
            }
        }

        function startCompass() {
            window.addEventListener('deviceorientation', (e) => {
                let heading = e.webkitCompassHeading || (360 - e.alpha);
                if (heading) {
                    document.getElementById('compass-ring').style.transform = `rotate(${-heading}deg)`;
                    document.getElementById('qibla-needle').style.transform = `rotate(${qiblaAngle - heading}deg)`;
                    document.getElementById('sensor-btn').innerHTML = `<i class="fas fa-check mr-2"></i> Kompas Aktif`;
                }
            }, true);
        }

        window.onload = initApp;
    </script>
</body>
</html>
