<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aplikasi Muslim Lengkap</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .font-arabic { font-family: 'Amiri', serif; }
        .pb-safe { padding-bottom: env(safe-area-inset-bottom, 16px); }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* Animasi Transisi */
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-gray-800 flex justify-center text-gray-800">

    <!-- Container Utama (Mempresentasikan Layar HP) -->
    <div class="w-full max-w-md bg-gray-50 min-h-screen flex flex-col relative shadow-2xl overflow-hidden">
        
        <!-- Area Konten -->
        <div id="app-content" class="flex-1 overflow-y-auto pb-24 hide-scrollbar">
            <!-- Konten dinamis akan dimuat di sini oleh JavaScript -->
        </div>

        <!-- Navigasi Bawah -->
        <nav id="bottom-nav" class="fixed bottom-0 w-full max-w-md bg-white border-t border-gray-200 flex justify-around items-center h-16 px-2 pb-safe z-50">
            <button onclick="switchTab('home')" id="nav-home" class="nav-btn flex flex-col items-center justify-center w-full h-full space-y-1 text-emerald-600 transition-colors">
                <i data-lucide="home" class="w-6 h-6 transition-transform"></i>
                <span class="text-[10px] font-medium">Beranda</span>
            </button>
            <button onclick="switchTab('quran')" id="nav-quran" class="nav-btn flex flex-col items-center justify-center w-full h-full space-y-1 text-gray-400 hover:text-emerald-500 transition-colors">
                <i data-lucide="book-open" class="w-6 h-6 transition-transform"></i>
                <span class="text-[10px] font-medium">Qur'an</span>
            </button>
            <button onclick="switchTab('jadwal')" id="nav-jadwal" class="nav-btn flex flex-col items-center justify-center w-full h-full space-y-1 text-gray-400 hover:text-emerald-500 transition-colors">
                <i data-lucide="clock" class="w-6 h-6 transition-transform"></i>
                <span class="text-[10px] font-medium">Jadwal</span>
            </button>
            <button onclick="switchTab('kiblat')" id="nav-kiblat" class="nav-btn flex flex-col items-center justify-center w-full h-full space-y-1 text-gray-400 hover:text-emerald-500 transition-colors">
                <i data-lucide="compass" class="w-6 h-6 transition-transform"></i>
                <span class="text-[10px] font-medium">Kiblat</span>
            </button>
        </nav>
    </div>

    <!-- JavaScript Aplikasi -->
    <script>
        // --- State Aplikasi ---
        let activeTab = 'home';
        let subView = null;
        let selectedData = null;

        // Cleanup variables
        let clockInterval = null;
        let quranList = [];
        let currentAudio = null;
        let playingAyat = null;
        let compassHandler = null;

        // --- Fungsi Utama Render ---
        function render() {
            cleanup();
            const content = document.getElementById('app-content');
            content.className = "flex-1 overflow-y-auto pb-24 hide-scrollbar fade-in"; // reset animation

            if (subView === 'quran-detail') renderSurahDetail(content);
            else if (subView === 'bacaan') renderBacaan(content);
            else if (subView === 'doa') renderDoa(content);
            else if (activeTab === 'home') renderHome(content);
            else if (activeTab === 'quran') renderQuran(content);
            else if (activeTab === 'jadwal') renderJadwal(content);
            else if (activeTab === 'kiblat') renderKiblat(content);

            updateNavVisibility();
            setTimeout(() => lucide.createIcons(), 10); // Render ikon
        }

        function cleanup() {
            if (clockInterval) clearInterval(clockInterval);
            if (currentAudio) { currentAudio.pause(); currentAudio = null; }
            if (compassHandler) {
                window.removeEventListener('deviceorientation', compassHandler, true);
                compassHandler = null;
            }
        }

        // --- Navigasi ---
        function switchTab(tab) {
            activeTab = tab;
            subView = null;
            selectedData = null;
            
            // Update styling nav bar
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('text-emerald-600');
                btn.classList.add('text-gray-400');
                btn.querySelector('i').classList.remove('scale-110');
            });
            const activeBtn = document.getElementById(`nav-${tab}`);
            activeBtn.classList.remove('text-gray-400');
            activeBtn.classList.add('text-emerald-600');
            activeBtn.querySelector('i').classList.add('scale-110');
            
            render();
        }

        function goTo(view, data = null) {
            subView = view;
            selectedData = data;
            render();
            window.scrollTo(0, 0);
        }

        function goBack() {
            subView = null;
            selectedData = null;
            render();
        }

        function updateNavVisibility() {
            const nav = document.getElementById('bottom-nav');
            if (subView) {
                nav.style.display = 'none';
                document.getElementById('app-content').classList.remove('pb-24');
            } else {
                nav.style.display = 'flex';
                document.getElementById('app-content').classList.add('pb-24');
            }
        }

        // --- View: Beranda ---
        function renderHome(container) {
            container.innerHTML = `
                <!-- Header -->
                <div class="bg-emerald-600 rounded-b-[40px] p-6 pt-10 text-white shadow-lg relative overflow-hidden">
                    <div class="absolute top-0 right-0 opacity-10 transform translate-x-1/4 -translate-y-1/4">
                        <i data-lucide="moon" style="width: 200px; height: 200px;"></i>
                    </div>
                    <div class="relative z-10">
                        <p class="text-emerald-100 font-medium mb-1">Assalamu'alaikum,</p>
                        <h1 class="text-2xl font-bold mb-6">Hamba Allah</h1>
                        
                        <div class="bg-white/20 backdrop-blur-sm rounded-2xl p-4 border border-white/30">
                            <div class="flex justify-between items-center mb-2">
                                <span class="text-sm font-medium">Waktu Sekarang</span>
                                <span class="text-xs bg-emerald-500/50 px-2 py-1 rounded-full" id="clock-date">Memuat...</span>
                            </div>
                            <div class="text-4xl font-bold font-mono tracking-widest text-center my-2" id="clock-time">
                                --:--:--
                            </div>
                            <p class="text-center text-sm mt-2 text-emerald-50">Persiapkan diri untuk waktu sholat berikutnya</p>
                        </div>
                    </div>
                </div>

                <!-- Menu Utama -->
                <div class="p-6">
                    <h2 class="text-lg font-bold text-gray-800 mb-4">Menu Utama</h2>
                    <div class="grid grid-cols-3 gap-4">
                        <button onclick="switchTab('quran')" class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col items-center justify-center space-y-2 hover:bg-emerald-50 transition-all active:scale-95">
                            <div class="bg-emerald-50 p-3 rounded-xl text-emerald-500"><i data-lucide="book-open"></i></div>
                            <span class="text-xs font-medium text-gray-600 text-center">Al-Qur'an</span>
                        </button>
                        <button onclick="switchTab('jadwal')" class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col items-center justify-center space-y-2 hover:bg-emerald-50 transition-all active:scale-95">
                            <div class="bg-amber-50 p-3 rounded-xl text-amber-500"><i data-lucide="clock"></i></div>
                            <span class="text-xs font-medium text-gray-600 text-center">Jadwal</span>
                        </button>
                        <button onclick="switchTab('kiblat')" class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col items-center justify-center space-y-2 hover:bg-emerald-50 transition-all active:scale-95">
                            <div class="bg-blue-50 p-3 rounded-xl text-blue-500"><i data-lucide="compass"></i></div>
                            <span class="text-xs font-medium text-gray-600 text-center">Kiblat</span>
                        </button>
                        <button onclick="goTo('bacaan')" class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col items-center justify-center space-y-2 hover:bg-emerald-50 transition-all active:scale-95">
                            <div class="bg-purple-50 p-3 rounded-xl text-purple-500"><i data-lucide="layout-grid"></i></div>
                            <span class="text-xs font-medium text-gray-600 text-center">Bacaan Sholat</span>
                        </button>
                        <button onclick="goTo('doa')" class="bg-white p-4 rounded-2xl shadow-sm border border-gray-100 flex flex-col items-center justify-center space-y-2 hover:bg-emerald-50 transition-all active:scale-95">
                            <div class="bg-indigo-50 p-3 rounded-xl text-indigo-500"><i data-lucide="moon"></i></div>
                            <span class="text-xs font-medium text-gray-600 text-center">Doa Harian</span>
                        </button>
                    </div>
                </div>
                
                <!-- Kutipan Hari Ini -->
                <div class="px-6 mb-6">
                    <div class="bg-gradient-to-r from-emerald-50 to-teal-50 border border-emerald-100 p-5 rounded-2xl relative overflow-hidden">
                        <div class="absolute top-2 right-2 text-emerald-200 opacity-50"><i data-lucide="book-open" class="w-10 h-10"></i></div>
                        <h3 class="font-bold text-emerald-800 mb-2 text-sm relative z-10">Ayat Hari Ini</h3>
                        <p class="text-sm text-gray-700 italic relative z-10">
                            "Maka ingatlah kepada-Ku, Aku pun akan ingat kepadamu. Bersyukurlah kepada-Ku, dan janganlah kamu ingkar kepada-Ku."
                        </p>
                        <p class="text-xs text-emerald-600 mt-2 font-medium relative z-10">- QS. Al-Baqarah: 152</p>
                    </div>
                </div>
            `;

            // Logic Jam Berjalan
            const updateTime = () => {
                const now = new Date();
                const timeEl = document.getElementById('clock-time');
                const dateEl = document.getElementById('clock-date');
                if(timeEl) timeEl.innerText = now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
                if(dateEl) dateEl.innerText = now.toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long' });
            };
            updateTime();
            clockInterval = setInterval(updateTime, 1000);
        }

        // --- View: Al-Qur'an ---
        async function renderQuran(container) {
            container.innerHTML = `
                <div class="bg-emerald-600 p-6 pt-10 sticky top-0 z-10 shadow-md">
                    <h1 class="text-xl font-bold text-white text-center mb-4">Al-Qur'an</h1>
                    <div class="relative">
                        <input type="text" id="quran-search" placeholder="Cari Surah..." class="w-full pl-10 pr-4 py-3 rounded-xl border-none focus:ring-2 focus:ring-emerald-300 shadow-inner bg-white/90 text-sm outline-none">
                        <i data-lucide="search" class="absolute left-3 top-3 text-gray-400 w-5 h-5"></i>
                    </div>
                </div>
                <div class="p-4" id="quran-list-container">
                    <div class="flex justify-center items-center py-20">
                        <div class="animate-spin rounded-full h-10 w-10 border-4 border-emerald-500 border-t-transparent"></div>
                    </div>
                </div>
            `;

            try {
                if(quranList.length === 0) {
                    const res = await fetch('https://equran.id/api/v2/surat');
                    const data = await res.json();
                    quranList = data.data;
                }
                displaySurahList(quranList);

                // Fitur Pencarian
                document.getElementById('quran-search').addEventListener('input', (e) => {
                    const keyword = e.target.value.toLowerCase();
                    const filtered = quranList.filter(s => 
                        s.namaLatin.toLowerCase().includes(keyword) || 
                        s.arti.toLowerCase().includes(keyword)
                    );
                    displaySurahList(filtered);
                });

            } catch (err) {
                document.getElementById('quran-list-container').innerHTML = '<p class="text-center text-red-500 mt-10">Gagal memuat data. Periksa koneksi internet.</p>';
            }
        }

        function displaySurahList(list) {
            const container = document.getElementById('quran-list-container');
            container.innerHTML = `<div class="space-y-3">
                ${list.map(surah => `
                    <button onclick='goTo("quran-detail", ${JSON.stringify(surah).replace(/'/g, "&#39;")})' class="w-full flex items-center p-4 bg-gray-50 hover:bg-emerald-50 rounded-2xl border border-gray-100 transition-colors text-left active:scale-[0.98]">
                        <div class="w-10 h-10 rounded-full bg-emerald-100 text-emerald-600 font-bold flex items-center justify-center text-sm mr-4 relative shrink-0">
                            <span class="absolute transform rotate-45 border border-emerald-300 w-8 h-8 rounded-sm"></span>
                            ${surah.nomor}
                        </div>
                        <div class="flex-1">
                            <h3 class="font-bold text-gray-800">${surah.namaLatin}</h3>
                            <p class="text-xs text-gray-500">${surah.arti} • ${surah.jumlahAyat} Ayat</p>
                        </div>
                        <div class="text-xl font-arabic text-emerald-600 font-bold shrink-0">
                            ${surah.nama}
                        </div>
                    </button>
                `).join('')}
            </div>`;
        }

        // --- View: Detail Surah ---
        async function renderSurahDetail(container) {
            const surah = selectedData;
            container.innerHTML = `
                <div class="bg-emerald-600 p-4 pt-8 sticky top-0 z-20 flex items-center shadow-md text-white">
                    <button onclick="goBack()" class="p-2 mr-2 hover:bg-emerald-700 rounded-full transition-colors">
                        <i data-lucide="arrow-left"></i>
                    </button>
                    <div>
                        <h1 class="text-lg font-bold">${surah.namaLatin}</h1>
                        <p class="text-xs text-emerald-100">${surah.arti} • ${surah.jumlahAyat} Ayat</p>
                    </div>
                </div>
                <div id="ayat-container" class="p-4 space-y-6">
                    <div class="flex justify-center pt-20">
                        <div class="animate-spin rounded-full h-8 w-8 border-4 border-emerald-500 border-t-transparent"></div>
                    </div>
                </div>
            `;

            try {
                const res = await fetch(`https://equran.id/api/v2/surat/${surah.nomor}`);
                const data = await res.json();
                const detail = data.data;

                let html = '';
                // Bismillah Header (Kecuali Al-Fatihah & At-Taubah)
                if (surah.nomor !== 9 && surah.nomor !== 1) {
                    html += `
                        <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex justify-center items-center mb-6">
                            <h2 class="text-2xl font-arabic text-emerald-800 font-bold leading-loose text-center">
                                بِسْمِ اللَّهِ الرَّحْمَنِ الرَّحِيم
                            </h2>
                        </div>
                    `;
                }

                html += detail.ayat.map(ayat => `
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                        <div class="flex justify-between items-center mb-4">
                            <div class="w-8 h-8 rounded-full bg-gray-100 text-gray-600 text-xs font-bold flex items-center justify-center">
                                ${ayat.nomorAyat}
                            </div>
                            <button onclick="toggleAudio('${ayat.audio['05']}', ${ayat.nomorAyat})" id="btn-audio-${ayat.nomorAyat}" class="text-emerald-500 hover:text-emerald-700 bg-emerald-50 p-2 rounded-full transition-colors">
                                <i data-lucide="play-circle" class="w-5 h-5"></i>
                            </button>
                        </div>
                        <div class="text-right mb-6">
                            <p class="text-[28px] font-arabic leading-[2.5] text-gray-800" dir="rtl">
                                ${ayat.teksArab}
                            </p>
                        </div>
                        <div class="space-y-2 border-t border-gray-50 pt-4">
                            <p class="text-sm text-emerald-600 font-medium italic">
                                ${ayat.teksLatin}
                            </p>
                            <p class="text-sm text-gray-600">
                                ${ayat.teksIndonesia}
                            </p>
                        </div>
                    </div>
                `).join('');

                document.getElementById('ayat-container').innerHTML = html;
                lucide.createIcons();

            } catch(err) {
                document.getElementById('ayat-container').innerHTML = '<p class="text-center text-red-500 mt-10">Gagal memuat ayat.</p>';
            }
        }

        window.toggleAudio = function(url, ayatNumber) {
            // Reset semua ikon ke play
            document.querySelectorAll('[id^="btn-audio-"]').forEach(btn => {
                btn.innerHTML = '<i data-lucide="play-circle" class="w-5 h-5"></i>';
            });

            if (playingAyat === ayatNumber) {
                currentAudio.pause();
                playingAyat = null;
            } else {
                if (currentAudio) currentAudio.pause();
                currentAudio = new Audio(url);
                currentAudio.play();
                playingAyat = ayatNumber;
                
                // Ubah ikon tombol ini jadi pause
                document.getElementById(`btn-audio-${ayatNumber}`).innerHTML = '<i data-lucide="pause-circle" class="w-5 h-5"></i>';
                
                currentAudio.onended = () => {
                    playingAyat = null;
                    document.getElementById(`btn-audio-${ayatNumber}`).innerHTML = '<i data-lucide="play-circle" class="w-5 h-5"></i>';
                    lucide.createIcons();
                };
            }
            lucide.createIcons();
        }

        // --- View: Jadwal Sholat ---
        function renderJadwal(container) {
            container.innerHTML = `
                <div class="bg-emerald-600 p-6 pt-10 text-white rounded-b-[40px] shadow-md mb-6 relative overflow-hidden">
                    <div class="absolute top-0 right-0 opacity-10 transform translate-x-1/4 -translate-y-1/4">
                        <i data-lucide="clock" style="width: 200px; height: 200px;"></i>
                    </div>
                    <h1 class="text-2xl font-bold mb-2 relative z-10">Jadwal Sholat</h1>
                    <div class="flex items-center space-x-2 bg-black/20 w-fit px-3 py-1.5 rounded-full relative z-10">
                        <i data-lucide="map-pin" class="w-4 h-4"></i>
                        <span class="text-sm" id="lokasi-text">Mendeteksi lokasi...</span>
                    </div>
                    <p class="mt-4 text-emerald-100 text-sm relative z-10" id="tanggal-jadwal"></p>
                </div>
                <div class="px-6 pb-6" id="jadwal-container">
                    <div class="space-y-3">
                        ${[1,2,3,4,5,6].map(() => `<div class="h-16 bg-gray-200 rounded-xl animate-pulse"></div>`).join('')}
                    </div>
                </div>
            `;

            document.getElementById('tanggal-jadwal').innerText = new Date().toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => fetchJadwalData(pos.coords.latitude, pos.coords.longitude),
                    (err) => {
                        fetchJadwalData(-6.2088, 106.8456); // Fallback Jakarta
                        document.getElementById('lokasi-text').innerText = "Jakarta (Default)";
                    }
                );
            } else {
                fetchJadwalData(-6.2088, 106.8456);
                document.getElementById('lokasi-text').innerText = "Jakarta (Default)";
            }
        }

        async function fetchJadwalData(lat, lng) {
            try {
                // Get Location Name
                fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`)
                    .then(res => res.json())
                    .then(data => {
                        const locName = data.address.city || data.address.town || data.address.county || "Lokasi Anda";
                        document.getElementById('lokasi-text').innerText = locName;
                    }).catch(()=>{});

                // Get Schedule
                const timestamp = Math.floor(Date.now() / 1000);
                const res = await fetch(`https://api.aladhan.com/v1/timings/${timestamp}?latitude=${lat}&longitude=${lng}&method=20`);
                const data = await res.json();
                const timings = data.data.timings;

                const sholatList = [
                    { nama: 'Imsak', waktu: timings.Imsak, icon: 'moon', color: 'text-gray-500' },
                    { nama: 'Subuh', waktu: timings.Fajr, icon: 'sun', color: 'text-indigo-400' },
                    { nama: 'Terbit', waktu: timings.Sunrise, icon: 'sun', color: 'text-orange-400' },
                    { nama: 'Dzuhur', waktu: timings.Dhuhr, icon: 'sun', color: 'text-yellow-500' },
                    { nama: 'Ashar', waktu: timings.Asr, icon: 'sun', color: 'text-amber-500' },
                    { nama: 'Maghrib', waktu: timings.Maghrib, icon: 'moon', color: 'text-purple-500' },
                    { nama: 'Isya', waktu: timings.Isha, icon: 'moon', color: 'text-indigo-800' }
                ];

                const nowTime = new Date().toLocaleTimeString('en-US', {hour12:false, hour:'2-digit', minute:'2-digit'});

                let html = '<div class="space-y-3">';
                sholatList.forEach(item => {
                    const isPassed = item.waktu < nowTime;
                    html += `
                        <div class="flex justify-between items-center p-4 rounded-2xl border transition-all ${!isPassed ? 'bg-emerald-50 border-emerald-200 shadow-sm' : 'bg-white border-gray-100 opacity-60'}">
                            <div class="flex items-center space-x-4">
                                <div class="p-2 rounded-full ${!isPassed ? 'bg-emerald-100 text-emerald-600' : 'bg-gray-100 text-gray-500'}">
                                    <i data-lucide="${item.icon}" class="${!isPassed ? item.color : ''} w-5 h-5"></i>
                                </div>
                                <span class="font-semibold ${!isPassed ? 'text-emerald-900' : 'text-gray-600'}">${item.nama}</span>
                            </div>
                            <span class="text-xl font-bold font-mono ${!isPassed ? 'text-emerald-700' : 'text-gray-500'}">
                                ${item.waktu}
                            </span>
                        </div>
                    `;
                });
                html += '</div>';
                
                document.getElementById('jadwal-container').innerHTML = html;
                lucide.createIcons();

            } catch(err) {
                document.getElementById('jadwal-container').innerHTML = '<p class="text-center text-red-500 mt-10">Gagal memuat jadwal sholat.</p>';
            }
        }

        // --- View: Arah Kiblat ---
        function renderKiblat(container) {
            container.innerHTML = `
                <div class="bg-gray-50 min-h-screen flex flex-col items-center pt-10 px-6">
                    <h1 class="text-2xl font-bold text-gray-800 mb-2">Arah Kiblat</h1>
                    <p class="text-sm text-gray-500 text-center mb-10">Posisikan HP Anda secara horizontal (datar) dan jauhkan dari magnet.</p>

                    <div id="kiblat-content" class="w-full flex flex-col items-center">
                        <!-- Tampilan Izin / Kompas Akan di render disini -->
                    </div>
                </div>
            `;
            initCompass();
        }

        function initCompass() {
            let qiblaAngle = 295; // Default Indonesia

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((pos) => {
                    fetch(`https://api.aladhan.com/v1/qibla/${pos.coords.latitude}/${pos.coords.longitude}`)
                        .then(res => res.json())
                        .then(data => { if (data && data.data) qiblaAngle = data.data.direction; });
                });
            }

            const content = document.getElementById('kiblat-content');

            // Cek Izin (iOS)
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                content.innerHTML = `
                    <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 text-center mt-10 w-full max-w-sm">
                        <i data-lucide="compass" class="mx-auto text-emerald-500 w-16 h-16 mb-4"></i>
                        <h3 class="font-bold text-gray-800 mb-2">Akses Sensor Dibutuhkan</h3>
                        <p class="text-sm text-gray-600 mb-6">Kami memerlukan akses kompas perangkat untuk menunjukkan arah kiblat.</p>
                        <button onclick="requestCompassPermission(${qiblaAngle})" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-3 px-6 rounded-xl transition-colors">
                            Berikan Akses
                        </button>
                    </div>
                `;
                lucide.createIcons();
            } else {
                startCompassEngine(qiblaAngle);
            }
        }

        window.requestCompassPermission = function(qiblaAngle) {
            DeviceOrientationEvent.requestPermission()
                .then(permissionState => {
                    if (permissionState === 'granted') startCompassEngine(qiblaAngle);
                    else alert('Akses sensor ditolak');
                }).catch(console.error);
        }

        function startCompassEngine(qiblaAngle) {
            const content = document.getElementById('kiblat-content');
            content.innerHTML = `
                <div class="relative flex flex-col items-center w-full max-w-[300px] mt-4">
                    <div id="kiblat-status" class="mb-12 px-6 py-2 rounded-full text-sm font-bold shadow-sm transition-colors duration-500 bg-white text-gray-600 border border-gray-200">
                        Putar Perangkat Anda
                    </div>

                    <div class="relative w-72 h-72">
                        <!-- Compass Ring -->
                        <div id="compass-ring" class="absolute inset-0 rounded-full border-4 border-gray-200 shadow-inner flex items-center justify-center transition-transform duration-100 ease-linear bg-white">
                            <div class="absolute top-2 font-bold text-gray-400">U</div>
                            <div class="absolute bottom-2 font-bold text-gray-400">S</div>
                            <div class="absolute right-4 font-bold text-gray-400">T</div>
                            <div class="absolute left-4 font-bold text-gray-400">B</div>
                            
                            <!-- Qibla Indicator Line -->
                            <div class="absolute w-1 h-full py-1" style="transform: rotate(${qiblaAngle}deg)">
                                <div class="w-4 h-4 rounded-full bg-emerald-500 mx-auto -mt-2 shadow-[0_0_10px_rgba(16,185,129,0.8)]"></div>
                            </div>
                        </div>

                        <!-- Static Center Pointing Arrow -->
                        <div class="absolute inset-0 flex items-center justify-center pointer-events-none">
                            <div class="w-16 h-16 rounded-full bg-white shadow-md flex items-center justify-center border border-gray-100 z-10">
                                <div class="w-3 h-3 rounded-full bg-emerald-600"></div>
                            </div>
                            <div class="absolute top-8 w-1 h-1/2 bg-gradient-to-t from-transparent to-red-500 opacity-50 rounded-full"></div>
                        </div>
                    </div>

                    <div class="mt-16 text-center">
                        <p class="text-3xl font-mono font-bold text-gray-800" id="compass-degree">--°</p>
                        <p class="text-sm text-gray-500 mt-1">Arah Kiblat: ${Math.round(qiblaAngle)}°</p>
                    </div>
                </div>
            `;

            compassHandler = (event) => {
                let heading = null;
                if (event.webkitCompassHeading) {
                    heading = event.webkitCompassHeading; // iOS
                } else if (event.alpha !== null) {
                    heading = Math.abs(event.alpha - 360); // Android (Absolute needed to be true north if supported)
                }

                if (heading !== null) {
                    const compassRing = document.getElementById('compass-ring');
                    const degreeText = document.getElementById('compass-degree');
                    const statusText = document.getElementById('kiblat-status');
                    
                    if(compassRing) {
                        compassRing.style.transform = `rotate(${-heading}deg)`;
                        degreeText.innerText = `${Math.round(heading)}°`;

                        // Toleransi 5 derajat
                        let diff = Math.abs(heading - qiblaAngle);
                        if (diff > 180) diff = 360 - diff;

                        if (diff < 5) {
                            statusText.className = "mb-12 px-6 py-2 rounded-full text-sm font-bold shadow-sm transition-colors duration-500 bg-emerald-500 text-white";
                            statusText.innerText = "Anda Menghadap Kiblat";
                        } else {
                            statusText.className = "mb-12 px-6 py-2 rounded-full text-sm font-bold shadow-sm transition-colors duration-500 bg-white text-gray-600 border border-gray-200";
                            statusText.innerText = "Putar Perangkat Anda";
                        }
                    }
                }
            };

            window.addEventListener('deviceorientation', compassHandler, true);
        }

        // --- View: Bacaan Sholat ---
        function renderBacaan(container) {
            const data = [
                { title: "Takbiratul Ihram", arab: "اللَّهُ أَكْبَرُ", latin: "Allahu Akbar", arti: "Allah Maha Besar." },
                { title: "Doa Iftitah", arab: "اللَّهُمَّ بَاعِدْ بَيْنِي وَبَيْنَ خَطَايَايَ كَمَا بَاعَدْتَ بَيْنَ الْمَشْرِقِ وَالْمَغْرِبِ", latin: "Allahumma baa'id bainii wa baina khathaayaaya kamaa baa'adta bainal masyriqi wal maghrib.", arti: "Ya Allah, jauhkanlah antara diriku dan kesalahan-kesalahanku sebagaimana Engkau jauhkan antara timur dan barat." },
                { title: "Bacaan Ruku", arab: "سُبْحَانَ رَبِّيَ الْعَظِيمِ وَبِحَمْدِهِ", latin: "Subhaana rabbiyal 'azhiimi wa bihamdih. (3x)", arti: "Maha Suci Tuhanku Yang Maha Agung dan dengan memuji-Nya." },
                { title: "I'tidal", arab: "سَمِعَ اللَّهُ لِمَنْ حَمِدَهُ - رَبَّنَا وَلَكَ الْحَمْدُ", latin: "Sami'allahu liman hamidah. Rabbanaa walakal hamdu.", arti: "Allah mendengar orang yang memuji-Nya. Ya Tuhan kami, bagi-Mu segala puji." },
                { title: "Sujud", arab: "سُبْحَانَ رَبِّيَ الأَعْلَى وَبِحَمْدِهِ", latin: "Subhaana rabbiyal a'laa wa bihamdih. (3x)", arti: "Maha Suci Tuhanku Yang Maha Tinggi dan dengan memuji-Nya." },
                { title: "Duduk Diantara Dua Sujud", arab: "رَبِّ اغْفِرْ لِي وَارْحَمْنِي وَاجْبُرْنِي وَارْفَعْنِي وَارْزُقْنِي وَاهْدِنِي وَعَافِنِي وَاعْفُ عَنِّي", latin: "Rabbighfirlii warhamnii wajburnii warfa'nii warzuqnii wahdinii wa'aafinii wa'fu 'annii.", arti: "Ya Tuhanku ampunilah aku, rahmatilah aku, cukupkanlah aku, angkatlah derajatku, berilah rezeki kepadaku, tunjukilah aku, berilah kesehatan kepadaku, dan maafkanlah aku." },
                { title: "Tahiyat (Tasyahud) Akhir", arab: "التَّحِيَّاتُ الْمُبَارَكَاتُ الصَّلَوَاتُ الطَّيِّبَاتُ لِلَّهِ، السَّلاَمُ عَلَيْكَ أَيُّهَا النَّبِيُّ وَرَحْمَةُ اللَّهِ وَبَرَكَاتُهُ...", latin: "At-tahiyyaatul mubaarakaatush shalawaatuth thayyibaatulillaah. Assalaamu 'alaika ayyuhan nabiyyu wa rahmatullahi wabarakaatuh...", arti: "Segala penghormatan, keberkahan, shalawat, dan kebaikan hanya milik Allah. Semoga keselamatan, rahmat Allah, dan keberkahan-Nya tetap tercurahkan atasmu wahai Nabi..." },
                { title: "Salam", arab: "السَّلاَمُ عَلَيْكُمْ وَرَحْمَةُ اللَّهِ", latin: "Assalaamu 'alaikum wa rahmatullah.", arti: "Semoga keselamatan dan rahmat Allah dilimpahkan kepadamu." }
            ];

            let html = `
                <div class="bg-emerald-600 p-4 pt-8 sticky top-0 z-20 flex items-center shadow-md text-white">
                    <button onclick="goBack()" class="p-2 mr-2 hover:bg-emerald-700 rounded-full transition-colors">
                        <i data-lucide="arrow-left"></i>
                    </button>
                    <h1 class="text-lg font-bold">Panduan Bacaan Sholat</h1>
                </div>
                <div class="p-4 space-y-4">
            `;

            data.forEach((item, index) => {
                html += `
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100">
                        <h2 class="font-bold text-emerald-700 mb-4 flex items-center">
                            <span class="w-6 h-6 rounded-full bg-emerald-100 text-emerald-700 text-xs flex items-center justify-center mr-2">${index + 1}</span>
                            ${item.title}
                        </h2>
                        <p class="text-[26px] font-arabic text-right mb-4 leading-[2.5] text-gray-800" dir="rtl">${item.arab}</p>
                        <p class="text-sm text-emerald-600 italic mb-2">${item.latin}</p>
                        <p class="text-sm text-gray-600 border-t border-gray-50 pt-2">${item.arti}</p>
                    </div>
                `;
            });

            html += `</div>`;
            container.innerHTML = html;
        }

        // --- View: Doa Harian ---
        function renderDoa(container) {
            const data = [
                { title: "Doa Sebelum Tidur", arab: "بِاسْمِكَ اللَّهُمَّ أَحْيَا وَبِاسْمِكَ أَمُوتُ", latin: "Bismika Allahumma ahyaa wa bismika amuut.", arti: "Dengan nama-Mu ya Allah aku hidup dan dengan nama-Mu aku mati." },
                { title: "Doa Bangun Tidur", arab: "الْحَمْدُ لِلَّهِ الَّذِي أَحْيَانَا بَعْدَ مَا أَمَاتَنَا وَإِلَيْهِ النُّشُورُ", latin: "Alhamdulillahilladzii ahyaanaa ba'da maa amaatanaa wa ilaihin nusyuur.", arti: "Segala puji bagi Allah yang menghidupkan kami setelah mematikan kami dan kepada-Nya kami kembali." },
                { title: "Doa Sebelum Makan", arab: "اللَّهُمَّ بَارِكْ لَنَا فِيمَا رَزَقْتَنَا وَقِنَا عَذَابَ النَّارِ", latin: "Allahumma baarik lanaa fiimaa razaqtanaa wa qinaa 'adzaaban naar.", arti: "Ya Allah, berkahilah kami dalam rezeki yang telah Engkau berikan kepada kami dan peliharalah kami dari siksa api neraka." },
                { title: "Doa Sesudah Makan", arab: "الْحَمْدُ لِلَّهِ الَّذِي أَطْعَمَنَا وَسَقَانَا وَجَعَلَنَا مُسْلِمِينَ", latin: "Alhamdulillahilladzii ath'amanaa wa saqaanaa wa ja'alanaa muslimiin.", arti: "Segala puji bagi Allah yang telah memberi kami makan dan minum, serta menjadikan kami termasuk golongan orang-orang muslim." },
                { title: "Doa Keluar Rumah", arab: "بِسْمِ اللَّهِ تَوَكَّلْتُ عَلَى اللَّهِ لاَ حَوْلَ وَلاَ قُوَّةَ إِلاَّ بِاللَّهِ", latin: "Bismillahi tawakkaltu 'alallah laa hawla wa laa quwwata illaa billaah.", arti: "Dengan nama Allah, aku bertawakal kepada Allah, tiada daya dan kekuatan kecuali dengan pertolongan Allah." }
            ];

            let html = `
                <div class="bg-emerald-600 p-4 pt-8 sticky top-0 z-20 flex items-center shadow-md text-white">
                    <button onclick="goBack()" class="p-2 mr-2 hover:bg-emerald-700 rounded-full transition-colors">
                        <i data-lucide="arrow-left"></i>
                    </button>
                    <h1 class="text-lg font-bold">Kumpulan Doa Harian</h1>
                </div>
                <div class="p-4 grid gap-4">
            `;

            data.forEach((doa) => {
                html += `
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-emerald-50 hover:border-emerald-200 transition-colors">
                        <h3 class="font-bold text-gray-800 mb-4">${doa.title}</h3>
                        <p class="text-[26px] font-arabic text-right mb-3 leading-[2.5] text-emerald-800" dir="rtl">${doa.arab}</p>
                        <p class="text-sm text-emerald-600 italic mb-2">${doa.latin}</p>
                        <p class="text-xs text-gray-500 bg-gray-50 p-2 rounded-lg">${doa.arti}</p>
                    </div>
                `;
            });

            html += `</div>`;
            container.innerHTML = html;
        }

        // --- Inisialisasi Pertama Kali ---
        window.onload = () => {
            render();
        };
    </script>
</body>
</html>
