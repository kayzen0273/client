<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HP Jadi Mikrofon Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes pulse-ring {
            0% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 20px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.8); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }
        .mic-active .mic-btn {
            animation: pulse-ring 2s infinite;
            background-color: #10b981; /* emerald-500 */
            color: white;
        }
        .mic-inactive .mic-btn {
            background-color: #374151; /* gray-700 */
            color: #9ca3af; /* gray-400 */
        }
        
        /* Custom range slider styling */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 24px;
            width: 24px;
            border-radius: 50%;
            background: #10b981;
            cursor: pointer;
            margin-top: -8px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 8px;
            cursor: pointer;
            background: #4b5563;
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen flex flex-col items-center justify-center font-sans antialiased p-4">

    <!-- Elemen Audio Tersembunyi untuk memaksa rute Media (Bluetooth) -->
    <audio id="audio-out" autoplay playsinline></audio>

    <div class="max-w-md w-full bg-gray-800 rounded-3xl shadow-2xl overflow-hidden border border-gray-700">
        <!-- Header -->
        <div class="p-6 text-center border-b border-gray-700">
            <h1 class="text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-green-400 to-emerald-500">Live Mic Pro</h1>
            <p class="text-sm text-gray-400 mt-1" id="status-text">Siap digunakan. Pastikan Bluetooth terhubung.</p>
        </div>

        <!-- Main Content -->
        <div class="p-8 flex flex-col items-center" id="app-container" class="mic-inactive">
            
            <!-- Visualizer Canvas -->
            <canvas id="visualizer" class="w-full h-24 mb-8 rounded-lg bg-gray-900 border border-gray-700"></canvas>

            <!-- Big Mic Button -->
            <button id="toggle-btn" class="mic-btn w-32 h-32 rounded-full flex items-center justify-center transition-all duration-300 shadow-lg mb-8 focus:outline-none focus:ring-4 focus:ring-green-500 focus:ring-opacity-50">
                <svg id="mic-icon" xmlns="http://www.w3.org/2000/svg" class="h-12 w-12" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
                </svg>
            </button>

            <!-- Pengaturan Output & Volume -->
            <div class="w-full space-y-4">
                
                <!-- Output Device Selector (Akan muncul jika didukung browser) -->
                <div id="output-device-container" class="hidden bg-gray-900 p-3 rounded-xl border border-gray-700">
                    <label for="output-select" class="block text-xs font-medium text-gray-400 mb-1">Pilih Speaker Keluar:</label>
                    <select id="output-select" class="w-full bg-gray-800 text-white text-sm rounded-lg border border-gray-600 p-2 focus:ring-green-500 focus:border-green-500 outline-none">
                        <!-- Opsi akan diisi oleh JavaScript -->
                    </select>
                </div>

                <!-- Volume Control -->
                <div class="bg-gray-900 p-4 rounded-xl border border-gray-700">
                    <div class="flex justify-between items-center mb-2">
                        <span class="text-sm font-medium text-gray-300 flex items-center">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z" />
                            </svg>
                            Volume Mikrofon
                        </span>
                        <span id="volume-val" class="text-sm font-bold text-green-400">100%</span>
                    </div>
                    <input type="range" id="volume-slider" min="0" max="3" step="0.1" value="1">
                </div>
            </div>

        </div>
    </div>

    <!-- Modal Peringatan Error -->
    <div id="error-modal" class="fixed inset-0 bg-black/80 flex items-center justify-center z-50 hidden opacity-0 transition-opacity duration-300">
        <div class="bg-gray-800 p-6 rounded-2xl max-w-sm w-full mx-4 border border-red-500 text-center">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-red-500 mx-auto mb-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <h3 class="text-lg font-bold text-white mb-2">Terjadi Kesalahan</h3>
            <p id="error-message" class="text-gray-300 text-sm mb-6">Pesan error di sini.</p>
            <button onclick="closeError()" class="bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-6 rounded-lg w-full transition-colors">Tutup</button>
        </div>
    </div>

    <script>
        // DOM Elements
        const toggleBtn = document.getElementById('toggle-btn');
        const statusText = document.getElementById('status-text');
        const appContainer = document.getElementById('app-container');
        const volumeSlider = document.getElementById('volume-slider');
        const volumeVal = document.getElementById('volume-val');
        const canvas = document.getElementById('visualizer');
        const canvasCtx = canvas.getContext('2d');
        const audioElement = document.getElementById('audio-out');
        const outputSelect = document.getElementById('output-select');
        const outputDeviceContainer = document.getElementById('output-device-container');
        const errorModal = document.getElementById('error-modal');
        const errorMessage = document.getElementById('error-message');

        // Audio Variables
        let audioContext = null;
        let mediaStream = null;
        let sourceNode = null;
        let gainNode = null;
        let analyserNode = null;
        let destinationNode = null;
        let isActive = false;
        let animationId = null;

        // Inisialisasi Canvas
        function resizeCanvas() {
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function drawIdle() {
            canvasCtx.fillStyle = 'rgb(17, 24, 39)'; 
            canvasCtx.fillRect(0, 0, canvas.width, canvas.height);
            canvasCtx.lineWidth = 2;
            canvasCtx.strokeStyle = '#374151'; 
            canvasCtx.beginPath();
            canvasCtx.moveTo(0, canvas.height / 2);
            canvasCtx.lineTo(canvas.width, canvas.height / 2);
            canvasCtx.stroke();
        }
        drawIdle();

        toggleBtn.addEventListener('click', async () => {
            if (isActive) stopMic();
            else await startMic();
        });

        volumeSlider.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            volumeVal.innerText = Math.round(val * 100) + '%';
            if (gainNode) gainNode.gain.value = val;
        });

        // Event saat output device diubah
        outputSelect.addEventListener('change', async (e) => {
            try {
                if (typeof audioElement.setSinkId !== 'undefined') {
                    await audioElement.setSinkId(e.target.value);
                    console.log('Audio dialihkan ke:', e.target.value);
                }
            } catch (err) {
                console.error('Gagal mengalihkan audio:', err);
            }
        });

        async function updateOutputDevices() {
            if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return;
            
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const audioOutputs = devices.filter(device => device.kind === 'audiooutput');

                // Hanya tampilkan jika browser mendukung pemilihan sinkId (Seperti Chrome)
                if (audioOutputs.length > 0 && typeof audioElement.setSinkId !== 'undefined') {
                    outputDeviceContainer.classList.remove('hidden');
                    outputSelect.innerHTML = '';
                    
                    audioOutputs.forEach(device => {
                        const option = document.createElement('option');
                        option.value = device.deviceId;
                        // Nama perangkat, jika kosong beri nama default
                        option.text = device.label || `Speaker ${outputSelect.length + 1} (Mungkin Bluetooth)`;
                        outputSelect.appendChild(option);
                    });
                }
            } catch (err) {
                console.error('Error mengambil daftar perangkat:', err);
            }
        }

        async function startMic() {
            try {
                // Konfigurasi ini mengurangi kompresi ala "telepon" agar suara lebih natural
                const constraints = { 
                    audio: {
                        echoCancellation: false, 
                        noiseSuppression: false,
                        autoGainControl: false
                    } 
                };
                mediaStream = await navigator.mediaDevices.getUserMedia(constraints);

                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                
                sourceNode = audioContext.createMediaStreamSource(mediaStream);
                gainNode = audioContext.createGain();
                analyserNode = audioContext.createAnalyser();
                analyserNode.fftSize = 256;
                gainNode.gain.value = parseFloat(volumeSlider.value);

                // BUAT DESTINASI STREAM (Kunci agar bisa masuk ke tag <audio>)
                destinationNode = audioContext.createMediaStreamDestination();

                sourceNode.connect(analyserNode);
                sourceNode.connect(gainNode);
                gainNode.connect(destinationNode); // Hubungkan ke Stream, bukan ke Default Speaker

                // Masukkan stream ke elemen <audio>
                audioElement.srcObject = destinationNode.stream;
                
                // Pastikan audio berjalan
                try {
                    await audioElement.play();
                } catch (playErr) {
                    console.log("Auto-play terblokir, tapi harusnya aman karena di-trigger user klik.", playErr);
                }

                // Ambil daftar perangkat output SETELAH mendapat izin mic (agar nama bluetooth muncul)
                await updateOutputDevices();

                isActive = true;
                appContainer.className = 'mic-active';
                statusText.innerText = 'Mikrofon Aktif (On Air)';
                statusText.className = 'text-sm mt-1 text-green-400 font-bold';

                visualize();

            } catch (err) {
                console.error('Error:', err);
                showError("Tidak dapat mengakses mikrofon. Pastikan izin diberikan.");
            }
        }

        function stopMic() {
            if (mediaStream) mediaStream.getTracks().forEach(track => track.stop());
            if (audioContext) audioContext.close();
            
            audioElement.pause();
            audioElement.srcObject = null;

            audioContext = null;
            mediaStream = null;
            sourceNode = null;
            gainNode = null;
            analyserNode = null;
            destinationNode = null;
            isActive = false;

            if (animationId) cancelAnimationFrame(animationId);

            appContainer.className = 'mic-inactive';
            statusText.innerText = 'Mikrofon Dimatikan.';
            statusText.className = 'text-sm text-gray-400 mt-1';
            drawIdle();
        }

        function visualize() {
            if (!analyserNode) return;

            const bufferLength = analyserNode.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);

            function draw() {
                if (!isActive) return;
                animationId = requestAnimationFrame(draw);

                analyserNode.getByteTimeDomainData(dataArray);

                canvasCtx.fillStyle = 'rgb(17, 24, 39)'; 
                canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

                canvasCtx.lineWidth = 3;
                
                const gradient = canvasCtx.createLinearGradient(0, 0, canvas.width, 0);
                gradient.addColorStop(0, '#10b981'); // emerald
                gradient.addColorStop(0.5, '#3b82f6'); // blue
                gradient.addColorStop(1, '#10b981'); // emerald
                canvasCtx.strokeStyle = gradient;

                canvasCtx.beginPath();

                const sliceWidth = canvas.width * 1.0 / bufferLength;
                let x = 0;

                for (let i = 0; i < bufferLength; i++) {
                    const v = dataArray[i] / 128.0;
                    const y = v * canvas.height / 2;

                    if (i === 0) canvasCtx.moveTo(x, y);
                    else canvasCtx.lineTo(x, y);

                    x += sliceWidth;
                }

                canvasCtx.lineTo(canvas.width, canvas.height / 2);
                canvasCtx.stroke();
            }

            draw();
        }

        // Handle error modal
        function showError(msg) {
            errorMessage.innerText = msg;
            errorModal.classList.remove('hidden');
            setTimeout(() => errorModal.classList.remove('opacity-0'), 10);
        }

        function closeError() {
            errorModal.classList.add('opacity-0');
            setTimeout(() => errorModal.classList.add('hidden'), 300); 
        }
    </script>
</body>
</html>
