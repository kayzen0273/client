<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Peace Sign Blur ✌️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #070710;
      --surface:     #10101a;
      --surface2:    #16162a;
      --border:      rgba(255,255,255,0.07);
      --accent:      #7c3aed;
      --accent-glow: rgba(124, 58, 237, 0.35);
      --peace:       #ec4899;
      --peace-glow:  rgba(236, 72, 153, 0.4);
      --text:        #f0eff8;
      --muted:       #6b7280;
      --ok:          #22c55e;
    }

    html, body {
      min-height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', system-ui, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px 48px;
    }

    /* ── Header ── */
    header { text-align: center; margin-bottom: 28px; }

    .eyebrow {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 10px;
    }

    h1 {
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      font-weight: 800;
      letter-spacing: -0.04em;
      background: linear-gradient(135deg, #c4b5fd 0%, #ec4899 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      margin-top: 8px;
      font-size: 0.88rem;
      color: var(--muted);
    }

    /* ── Camera card ── */
    .cam-card {
      position: relative;
      width: min(720px, 100%);
      aspect-ratio: 16/9;
      border-radius: 18px;
      overflow: hidden;
      background: var(--surface);
      border: 1px solid var(--border);
      box-shadow:
        0 0 0 1px var(--border),
        0 40px 100px -20px rgba(0,0,0,0.7),
        0 0 60px -10px var(--accent-glow);
    }

    #webcam {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform: scaleX(-1);   /* mirror like a selfie cam */
      transition: filter 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    #webcam.blurred {
      filter: blur(24px) brightness(0.8) saturate(0.6);
    }

    /* ── Loading overlay ── */
    #loadingOverlay {
      position: absolute;
      inset: 0;
      background: var(--surface);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      z-index: 10;
      transition: opacity 0.3s;
    }
    #loadingOverlay.hidden { display: none; }

    .spinner {
      width: 42px;
      height: 42px;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .loading-label { font-weight: 700; font-size: 1rem; }
    .loading-step  { font-size: 0.8rem; color: var(--muted); }

    /* ── Error overlay ── */
    #errorOverlay {
      position: absolute;
      inset: 0;
      background: var(--surface);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 28px;
      text-align: center;
      z-index: 20;
    }
    #errorOverlay.show { display: flex; }

    .err-icon  { font-size: 2.8rem; margin-bottom: 4px; }
    .err-title { font-weight: 700; font-size: 1.05rem; }
    .err-msg   { font-size: 0.82rem; color: var(--muted); line-height: 1.55; max-width: 300px; }

    .retry-btn {
      margin-top: 10px;
      padding: 9px 22px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .retry-btn:hover { opacity: 0.85; }

    /* ── Status badge ── */
    .status-badge {
      position: absolute;
      top: 14px;
      left: 14px;
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 5px 14px 5px 9px;
      border-radius: 999px;
      background: rgba(7, 7, 16, 0.72);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid var(--border);
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--muted);
      z-index: 5;
      transition: border-color 0.2s, color 0.2s, box-shadow 0.2s;
    }
    .status-badge.peace {
      border-color: var(--peace);
      color: var(--peace);
      box-shadow: 0 0 14px var(--peace-glow);
    }
    .status-badge.ready { color: #c4b5fd; }

    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
      transition: background 0.2s;
    }
    .status-badge.ready .dot  { background: var(--ok); }
    .status-badge.peace .dot  {
      background: var(--peace);
      animation: blink 0.7s ease-in-out infinite;
    }
    @keyframes blink {
      0%,100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.4; transform: scale(1.4); }
    }

    /* ── Peace emoji pop ── */
    .peace-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 4;
    }

    #peaceEmoji {
      font-size: clamp(5rem, 18vw, 10rem);
      opacity: 0;
      transform: scale(0.5) rotate(-15deg);
      transition:
        opacity 0.22s ease,
        transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
      filter: drop-shadow(0 0 28px var(--peace-glow));
      user-select: none;
    }
    #peaceEmoji.show {
      opacity: 1;
      transform: scale(1) rotate(0deg);
    }

    /* ── Instructions ── */
    .hints {
      margin-top: 22px;
      display: flex;
      gap: 32px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .hint {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      color: var(--muted);
    }
    .hint span:first-child { font-size: 1.1rem; }
  </style>
</head>
<body>

<header>
  <p class="eyebrow">Gesture Camera</p>
  <h1>Peace Sign Blur ✌️</h1>
  <p class="subtitle">Tunjukkan peace sign ke kamera untuk memblur layar</p>
</header>

<div class="cam-card">

  <!-- Video feed -->
  <video id="webcam" autoplay playsinline muted></video>

  <!-- Loading -->
  <div id="loadingOverlay">
    <div class="spinner"></div>
    <p class="loading-label">Memuat model AI…</p>
    <p class="loading-step" id="loadingStep">Menginisialisasi MediaPipe</p>
  </div>

  <!-- Error -->
  <div id="errorOverlay">
    <div class="err-icon">📵</div>
    <p class="err-title" id="errTitle">Terjadi Masalah</p>
    <p class="err-msg"   id="errMsg">—</p>
    <button class="retry-btn" onclick="location.reload()">Coba Lagi</button>
  </div>

  <!-- Status badge -->
  <div class="status-badge" id="badge">
    <div class="dot"></div>
    <span id="badgeText">Memuat…</span>
  </div>

  <!-- Peace emoji overlay -->
  <div class="peace-overlay">
    <span id="peaceEmoji">✌️</span>
  </div>

</div>

<div class="hints">
  <div class="hint"><span>✌️</span><span>Peace sign → layar blur</span></div>
  <div class="hint"><span>✋</span><span>Lepas → kembali normal</span></div>
</div>

<script type="module">
  import { HandLandmarker, FilesetResolver }
    from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/vision_bundle.mjs";

  /* ── DOM refs ── */
  const webcam    = document.getElementById('webcam');
  const loading   = document.getElementById('loadingOverlay');
  const stepEl    = document.getElementById('loadingStep');
  const errorBox  = document.getElementById('errorOverlay');
  const errTitle  = document.getElementById('errTitle');
  const errMsg    = document.getElementById('errMsg');
  const badge     = document.getElementById('badge');
  const badgeText = document.getElementById('badgeText');
  const peaceEmoji = document.getElementById('peaceEmoji');

  let landmarker   = null;
  let lastVideoTime = -1;

  /* ── Deteksi peace sign (logika sama dengan versi Python) ──
     Landmark MediaPipe tangan:
       8  = ujung telunjuk      6  = sendi tengah telunjuk
       12 = ujung jari tengah  10  = sendi tengah jari tengah
       16 = ujung jari manis   14  = sendi tengah jari manis
       20 = ujung kelingking   18  = sendi tengah kelingking
     Y=0 di atas, Y=1 di bawah (koordinat ternormalisasi).
  */
  function isPeace(lm) {
    return (
      lm[8].y  < lm[6].y  &&   // telunjuk tegak
      lm[12].y < lm[10].y &&   // jari tengah tegak
      lm[16].y > lm[14].y &&   // jari manis ditekuk
      lm[20].y > lm[18].y      // kelingking ditekuk
    );
  }

  function setStatus(text, mode) {
    badge.className = 'status-badge ' + (mode || '');
    badgeText.textContent = text;
  }

  function showError(title, msg) {
    loading.classList.add('hidden');
    errorBox.classList.add('show');
    errTitle.textContent = title;
    errMsg.textContent   = msg;
  }

  /* ── Inisialisasi ── */
  async function init() {
    try {
      stepEl.textContent = 'Memuat WASM runtime…';
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/wasm"
      );

      stepEl.textContent = 'Mengunduh model tangan…';
      landmarker = await HandLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath:
            "https://storage.googleapis.com/mediapipe-models/hand_landmarker/" +
            "hand_landmarker/float16/1/hand_landmarker.task",
        },
        runningMode: "VIDEO",
        numHands: 2,
        minHandDetectionConfidence: 0.5,
        minHandPresenceConfidence : 0.5,
        minTrackingConfidence     : 0.5,
      });

      stepEl.textContent = 'Mengakses kamera…';
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' },
        audio: false,
      });

      webcam.srcObject = stream;
      webcam.addEventListener('loadeddata', () => {
        loading.classList.add('hidden');
        setStatus('Siap — coba peace sign! ✌️', 'ready');
        loop();
      }, { once: true });

    } catch (err) {
      console.error(err);
      if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
        showError(
          'Izin Kamera Ditolak',
          'Klik ikon 🔒 di address bar, lalu izinkan kamera. Setelah itu muat ulang halaman.'
        );
      } else if (err.name === 'NotFoundError') {
        showError(
          'Kamera Tidak Ditemukan',
          'Pastikan webcam terpasang dan tidak sedang dipakai aplikasi lain.'
        );
      } else {
        showError('Gagal Memuat', err.message || 'Terjadi kesalahan tidak terduga.');
      }
    }
  }

  /* ── Loop deteksi per-frame ── */
  function loop() {
    if (webcam.currentTime !== lastVideoTime) {
      lastVideoTime = webcam.currentTime;

      const results = landmarker.detectForVideo(webcam, performance.now());
      let peace = false;

      if (results.landmarks?.length) {
        for (const hand of results.landmarks) {
          if (isPeace(hand)) { peace = true; break; }
        }
      }

      if (peace) {
        webcam.classList.add('blurred');
        peaceEmoji.classList.add('show');
        setStatus('Peace terdeteksi! ✌️', 'peace');
      } else {
        webcam.classList.remove('blurred');
        peaceEmoji.classList.remove('show');
        const hasHand = results.landmarks?.length > 0;
        setStatus(hasHand ? 'Tangan terdeteksi 👋' : 'Menunggu gesture…', 'ready');
      }
    }

    requestAnimationFrame(loop);
  }

  init();
</script>

</body>
</html>
