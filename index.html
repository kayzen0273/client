<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pelacak Lokasi Sederhana</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      text-align: center;
      max-width: 600px;
      margin: auto;
    }
    input {
      width: 90%;
      padding: 10px;
      font-size: 1em;
    }
    a {
      color: blue;
      word-break: break-all;
    }
    #lokasi {
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>Pelacak Lokasi Sederhana</h1>
  <div id="app">Memuat...</div>

  <script>
    const app = document.getElementById('app');
    const params = new URLSearchParams(window.location.search);

    const lat = params.get('lat');
    const lng = params.get('lng');
    const shareId = params.get('share');

    if (lat && lng) {
      // Mode pengguna pertama menerima lokasi
      app.innerHTML = `
        <p>Lokasi diterima:</p>
        <p><strong>Latitude:</strong> ${lat}<br/><strong>Longitude:</strong> ${lng}</p>
        <p><a href="https://www.google.com/maps?q=${lat},${lng}" target="_blank" rel="noopener">Lihat di Google Maps</a></p>
      `;
    } else if (shareId) {
      // Mode pengguna kedua mengirim lokasi
      app.innerHTML = `<p>Meminta izin lokasi...</p>`;

      if (!navigator.geolocation) {
        app.innerHTML = '<p>Browser Anda tidak mendukung Geolocation.</p>';
      } else {
        navigator.geolocation.getCurrentPosition(position => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          // Redirect ke pengguna pertama dengan koordinat di URL
          const redirectUrl = `${location.origin}${location.pathname}?lat=${lat}&lng=${lng}&from=${shareId}`;
          location.href = redirectUrl;
        }, () => {
          app.innerHTML = '<p>Gagal mendapatkan lokasi. Mohon izinkan akses lokasi.</p>';
        });
      }
    } else {
      // Mode pengguna pertama membuat link unik
      const id = Math.random().toString(36).substr(2, 6);
      const link = `${location.origin}${location.pathname}?share=${id}`;
      app.innerHTML = `
        <p>Kirim link ini ke orang yang ingin Anda lacak lokasinya:</p>
        <input type="text" readonly value="${link}" onclick="this.select()" />
        <p>Setelah mereka membuka link dan mengizinkan akses lokasi, koordinat mereka akan muncul di sini.</p>
      `;
    }
  </script>
</body>
</html>
